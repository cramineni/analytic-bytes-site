<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title id="t">The decision chain, and where a piece can break it</title>
<desc id="d">Six nodes run left to right: construct, representation, inference, decision, action, then consequence set below the row. A dashed teal return leg runs from consequence back to construct. Beneath the chain, three bands mark where the library's three failure points sit along it: meaning at the front, validity across the middle, authority across the back half. Every diagnostic piece in the library names one or two links where the chain stops working.</desc>
<rect width="1200" height="640" fill="#FFFFFF"/>

<text x="600" y="54" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">THE AB LIBRARY FRAMEWORK</text>
<text x="600" y="98" font-size="31" font-weight="700" fill="#0F2A4A" text-anchor="middle">The decision chain.</text>
<text x="600" y="132" font-size="20" fill="#475569" text-anchor="middle">Every diagnostic piece in this library names where it stops working.</text>

<line x1="90" y1="168" x2="1110" y2="168" stroke="#E2E8F0" stroke-width="1"/>

<g stroke="#0F2A4A" stroke-width="1.6" fill="#0F2A4A">
  <line x1="265" y1="248" x2="291" y2="248" stroke-linecap="round"/><polygon points="299,248 288,243 288,253"/>
  <line x1="465" y1="248" x2="491" y2="248" stroke-linecap="round"/><polygon points="499,248 488,243 488,253"/>
  <line x1="665" y1="248" x2="691" y2="248" stroke-linecap="round"/><polygon points="699,248 688,243 688,253"/>
  <line x1="865" y1="248" x2="891" y2="248" stroke-linecap="round"/><polygon points="899,248 888,243 888,253"/>
</g>

<g text-anchor="middle">
  <rect x="90" y="212" width="175" height="72" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.8"/>
  <text x="177" y="244" font-size="20" font-weight="500" fill="#0F2A4A">construct</text>
  <text x="177" y="268" font-size="15" fill="#475569">what we mean</text>

  <rect x="290" y="212" width="175" height="72" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.8"/>
  <text x="377" y="244" font-size="20" font-weight="500" fill="#0F2A4A">representation</text>
  <text x="377" y="268" font-size="15" fill="#475569">what stands for it</text>

  <rect x="490" y="212" width="175" height="72" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.8"/>
  <text x="577" y="244" font-size="20" font-weight="500" fill="#0F2A4A">inference</text>
  <text x="577" y="268" font-size="15" fill="#475569">what we read off it</text>

  <rect x="690" y="212" width="175" height="72" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.8"/>
  <text x="777" y="244" font-size="20" font-weight="500" fill="#0F2A4A">decision</text>
  <text x="777" y="268" font-size="15" fill="#475569">who settles it</text>

  <rect x="890" y="212" width="175" height="72" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.8"/>
  <text x="977" y="244" font-size="20" font-weight="500" fill="#0F2A4A">action</text>
  <text x="977" y="268" font-size="15" fill="#475569">what gets done</text>

  <rect x="890" y="342" width="175" height="72" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.8"/>
  <text x="977" y="374" font-size="20" font-weight="500" fill="#0F2A4A">consequence</text>
  <text x="977" y="398" font-size="15" fill="#475569">what followed</text>
</g>

<path d="M 1065 248 Q 1105 248 1105 295 Q 1105 342 1071 372" fill="none" stroke="#0F2A4A" stroke-width="1.6"/>
<polygon points="1065,378 1078,372 1070,364" fill="#0F2A4A"/>

<path d="M 890 378 L 200 378 Q 160 378 160 330 L 160 292" fill="none" stroke="#0EA5E9" stroke-width="1.8" stroke-dasharray="7 5"/>
<polygon points="160,284 154,297 166,297" fill="#0EA5E9"/>
<text x="525" y="368" font-size="18" font-weight="500" fill="#0EA5E9" text-anchor="middle">the return leg</text>
<text x="525" y="400" font-size="15" fill="#475569" text-anchor="middle">what the outcome showed, written into the next measurement</text>

<line x1="90" y1="458" x2="1110" y2="458" stroke="#E2E8F0" stroke-width="1"/>
<text x="90" y="494" font-size="18" font-weight="500" fill="#0F2A4A">Where the three failure points sit along it</text>

<g font-size="15">
  <rect x="90" y="516" width="280" height="5" rx="2.5" fill="#0F2A4A" opacity="0.85"/>
  <text x="90" y="552" font-size="18" font-weight="500" fill="#0F2A4A">meaning</text>
  <text x="90" y="578" fill="#475569">the construct is undefined, or defined</text>
  <text x="90" y="600" fill="#475569">differently in different places</text>

  <rect x="440" y="516" width="280" height="5" rx="2.5" fill="#0EA5E9"/>
  <text x="440" y="552" font-size="18" font-weight="500" fill="#0EA5E9">validity</text>
  <text x="440" y="578" fill="#475569">the number does not support the</text>
  <text x="440" y="600" fill="#475569">claim being read off it</text>

  <rect x="790" y="516" width="280" height="5" rx="2.5" fill="#94A3B8"/>
  <text x="790" y="552" font-size="18" font-weight="500" fill="#475569">authority</text>
  <text x="790" y="578" fill="#475569">nobody owns the call,</text>
  <text x="790" y="600" fill="#475569">or nobody may act</text>
</g>
</svg>
