<text x="90" y="536" font-size="13" fill="#475569">The dashed frames mark the two questions these documents almost never answer. The first panel is the control: a third of the same employers do write authority</text>
<text x="90" y="555" font-size="13" fill="#475569">down, in the same block, about the same role. The gap is inside the document, not between one set of employers and a better set.</text>
<rect x="63" y="584" width="7" height="7" fill="#0F2A4A"/>
<text x="90" y="592" font-size="13" fill="#475569">Sixty-six senior data, analytics and AI leadership postings, director level and above, collected June to August 2026. Coded twice by two coders working blind from a</text>
<text x="90" y="611" font-size="13" fill="#475569">rule written down before any posting was opened; twelve disagreements adjudicated on stated lines and recorded. Square position carries no meaning.</text>
