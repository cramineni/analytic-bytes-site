<title>Decision rights at the door</title>
<desc>Three panels, each showing the same sixty-six job postings as a grid of sixty-six small squares. In the first panel, headed a decision the hire may make, twenty-three squares are filled navy and the panel is framed in a solid navy line. In the second panel, what an AI system may decide, two squares are filled. In the third, whether the hire may halt or gate a model, one square is filled and it is marked hedged. The second and third panels are framed in teal dashed lines to mark what is missing.</desc>
