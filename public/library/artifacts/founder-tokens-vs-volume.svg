<text x="540" y="920" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" fill="#94A3B8" text-anchor="middle">Token data measured on 21 of 83 sessions. Four categories not yet extracted — shown with volume only.</text>
<text x="540" y="945" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" fill="#94A3B8" text-anchor="middle">Read the shape, not absolute percentages.</text>

