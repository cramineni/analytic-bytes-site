<!-- Row 4: Research &amp; Framework Review — vol 8%, tok 0.5% -->
<text x="270" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="end">Research &amp; framework review</text>
