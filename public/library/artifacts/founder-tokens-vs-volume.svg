<text x="469" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#0F2A4A" text-anchor="start">12%</text>
<text x="469" y="582" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-style="italic" fill="#94A3B8" text-anchor="start">— token data pending —</text>

