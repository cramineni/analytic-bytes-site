<text x="437" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#0EA5E9" text-anchor="end">12%</text>
<text x="512" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#0F2A4A" text-anchor="start">15%</text>

<!-- Row 6: Talk prep — vol 7%, tok 6% -->
<text x="270" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="end">Talk prep</text>
<line x1="366" y1="520" x2="381" y2="520" stroke="#CBD5E1" stroke-width="4"/>
<circle cx="366" cy="520" r="9" fill="#0EA5E9"/>
<circle cx="381" cy="520" r="9" fill="#0F2A4A"/>
<text x="350" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#0EA5E9" text-anchor="end">6%</text>
<text x="397" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#0F2A4A" text-anchor="start">7%</text>

