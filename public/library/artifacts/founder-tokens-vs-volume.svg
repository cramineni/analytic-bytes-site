<svg viewBox="0 0 1080 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Where a founder's time actually goes — volume vs. tokens</title>
<desc>A dumbbell chart comparing message-volume share to token-usage share per task category, revealing that Website &amp; Technical Dev consumes 44% of tokens on only 8% of volume, while Recurring Automation consumes only 1% of tokens on 15% of volume.</desc>

<!-- Background -->
<rect width="1080" height="1000" fill="#FFFFFF"/>

<!-- Header block -->
<text x="80" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#0F2A4A">The shape shifts when you look at cost</text>
<text x="80" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569">Same 10 categories, this time by token usage — where the model actually worked hardest.</text>

<!-- Divider -->
<line x1="80" y1="130" x2="1000" y2="130" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.4"/>

<!-- Legend -->
<circle cx="95" cy="165" r="8" fill="#0F2A4A"/>
<text x="115" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#475569">Message volume %</text>
<circle cx="295" cy="165" r="8" fill="#0EA5E9"/>
<text x="315" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#475569">Token usage %</text>
<line x1="480" y1="165" x2="520" y2="165" stroke="#CBD5E1" stroke-width="4"/>
<text x="530" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#475569">Divergence</text>

<!-- Chart area -->
<!-- X-axis: 0% at x=280, 50% at x=1000 → 14.4px per %  -->
<!-- Y-axis: 10 rows, y=220 to y=780 → 56px per row -->

<!-- Grid lines -->
<g stroke="#E2E8F0" stroke-width="1">
  <line x1="280" y1="220" x2="280" y2="800"/>
  <line x1="424" y1="220" x2="424" y2="800"/>
  <line x1="568" y1="220" x2="568" y2="800"/>
  <line x1="712" y1="220" x2="712" y2="800"/>
  <line x1="856" y1="220" x2="856" y2="800"/>
  <line x1="1000" y1="220" x2="1000" y2="800"/>
</g>

<!-- X-axis labels -->
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">
  <text x="280" y="820">0%</text>
  <text x="424" y="820">10%</text>
  <text x="568" y="820">20%</text>
  <text x="712" y="820">30%</text>
  <text x="856" y="820">40%</text>
  <text x="1000" y="820">50%</text>
</g>
<text x="640" y="845" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">% share</text>

<!-- Data rows: sorted by absolute gap (biggest divergence at top) -->
<!-- Row 1: Website &amp; Technical Dev — vol 8%, tok 44% -->
<text x="270" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2A4A" text-anchor="end">Website &amp; Technical Dev</text>
<line x1="395" y1="240" x2="914" y2="240" stroke="#CBD5E1" stroke-width="4"/>
<circle cx="395" cy="240" r="9" fill="#0F2A4A"/>
<circle cx="914" cy="240" r="9" fill="#0EA5E9"/>
<text x="380" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#0F2A4A" text-anchor="end">8%</text>
<text x="930" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#0EA5E9" text-anchor="start">44%</text>

<!-- Row 2: Strategic &amp; Meta-Reflection — vol 20%, tok 36% -->
<text x="270" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="end">Strategic thinking &amp; reflection</text>
