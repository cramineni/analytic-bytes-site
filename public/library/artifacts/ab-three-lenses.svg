<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, Helvetica, Arial, sans-serif" role="img">
  <title>Three lenses on the same practice — 90-day audit of AB as an AI-native practice, Jul 31, 2026</title>
  <desc>Grouped horizontal bar chart across six task categories, each read through three measurement lenses: raw session count (throughput), weighted-proxy volume (attention estimate), and real token share (cost measurement). Top two categories (Recurring Automation, Website and Tech Dev) sit in an HITL band — AI drives, human oversees. Bottom four (Strategic and Meta-Reflection, Opportunity Evaluation, AB Product and Framework, Research and Framework) sit in an AITL band — human drives, AI assists. Where the three lenses align, the story holds; where they diverge, one method needs review. Caveat: tokens measured for 30 of 93 sessions; fuller measurement may shift AITL token share upward.</desc>
  <defs>
    <style>
      .ab-ink { fill: #0F2A4A; }
      .ab-ink-2 { fill: #475569; }
      .ab-ink-3 { fill: #94A3B8; }
      .ab-slate-bar { fill: #B4C0CC; }
      .ab-navy-bar { fill: #0F2A4A; }
      .ab-teal-bar { fill: #0EA5E9; }
      .hitl-band { fill: #0EA5E9; opacity: 0.055; }
      .aitl-band { fill: #94A3B8; opacity: 0.055; }
      .hitl-border { fill: none; stroke: #0EA5E9; stroke-opacity: 0.35; stroke-width: 1; }
      .aitl-border { fill: none; stroke: #94A3B8; stroke-opacity: 0.4; stroke-width: 1; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="1000" fill="#FFFFFF"/>

  <!-- header -->
  <text x="80" y="70" font-size="34" font-weight="700" class="ab-ink" letter-spacing="-0.5">Three lenses on the same practice</text>
  <text x="80" y="105" font-size="17" font-weight="500" class="ab-ink-2" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.5">90-day audit of AB as an AI-native practice   ·   Jul 31, 2026</text>
  <text x="80" y="140" font-size="17" class="ab-ink-3" font-style="italic">Same 93-session corpus, three measurement methods. Where two lenses align, the story holds; where they diverge, one method needs review.</text>

  <!-- band backgrounds (HITL top 2 rows, AITL bottom 4 rows) -->
  <rect class="hitl-band" x="240" y="190" width="980" height="214" rx="6"/>
  <rect class="hitl-border" x="240" y="190" width="980" height="214" rx="6"/>
  <rect class="aitl-band" x="240" y="404" width="980" height="426" rx="6"/>
  <rect class="aitl-border" x="240" y="404" width="980" height="426" rx="6"/>

  <!-- x-axis gridlines: 0, 10, 20, 30, 40, 50, 60 -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="340" y1="190" x2="340" y2="830" stroke-dasharray="2 3"/>
    <line x1="440" y1="190" x2="440" y2="830" stroke-dasharray="2 3"/>
    <line x1="540" y1="190" x2="540" y2="830" stroke-dasharray="2 3"/>
    <line x1="640" y1="190" x2="640" y2="830" stroke-dasharray="2 3"/>
    <line x1="740" y1="190" x2="740" y2="830" stroke-dasharray="2 3"/>
    <line x1="840" y1="190" x2="840" y2="830" stroke-dasharray="2 3"/>
    <line x1="940" y1="190" x2="940" y2="830" stroke-dasharray="2 3"/>
    <line x1="1040" y1="190" x2="1040" y2="830" stroke-dasharray="2 3"/>
    <line x1="1140" y1="190" x2="1140" y2="830" stroke-dasharray="2 3"/>
  </g>
  <line x1="240" y1="190" x2="240" y2="830" stroke="#94A3B8" stroke-width="1"/>

  <!-- ============ ROW 1: Recurring Automation (HITL) ============ -->
  <text x="225" y="240" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">Recurring</text>
  <text x="225" y="260" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">Automation</text>
  <rect class="ab-teal-bar" x="240" y="208" width="898.9" height="22" rx="2"/>
  <text x="1147" y="223" font-size="13" font-weight="500" class="ab-ink">57.4%</text>
  <rect class="ab-navy-bar" x="240" y="236" width="252.3" height="22" rx="2"/>
  <text x="500" y="251" font-size="13" font-weight="500" class="ab-ink">16.1%</text>
  <rect class="ab-slate-bar" x="240" y="264" width="858.5" height="22" rx="2"/>
  <text x="1107" y="279" font-size="13" font-weight="500" class="ab-ink">54.8%</text>

  <!-- ============ ROW 2: Website & Tech Dev (HITL) ============ -->
  <text x="225" y="347" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">Website &amp;</text>
  <text x="225" y="367" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">Tech Dev</text>
  <rect class="ab-teal-bar" x="240" y="315" width="280.4" height="22" rx="2"/>
  <text x="528" y="330" font-size="13" font-weight="500" class="ab-ink">17.9%</text>
  <rect class="ab-navy-bar" x="240" y="343" width="111.2" height="22" rx="2"/>
  <text x="359" y="358" font-size="13" font-weight="500" class="ab-ink">7.1%</text>
  <rect class="ab-slate-bar" x="240" y="371" width="50.1" height="22" rx="2"/>
  <text x="298" y="386" font-size="13" font-weight="500" class="ab-ink">3.2%</text>

  <!-- ============ ROW 3: Strategic & Meta-Reflection (AITL) ============ -->
  <text x="225" y="454" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">Strategic &amp;</text>
  <text x="225" y="474" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">Meta-Reflection</text>
  <rect class="ab-teal-bar" x="240" y="422" width="227.1" height="22" rx="2"/>
  <text x="475" y="437" font-size="13" font-weight="500" class="ab-ink">14.5%</text>
  <rect class="ab-navy-bar" x="240" y="450" width="415.1" height="22" rx="2"/>
  <text x="663" y="465" font-size="13" font-weight="500" class="ab-ink">26.5%</text>
  <rect class="ab-slate-bar" x="240" y="478" width="101.8" height="22" rx="2"/>
  <text x="349" y="493" font-size="13" font-weight="500" class="ab-ink">6.5%</text>

  <!-- ============ ROW 4: Opportunity Evaluation (AITL) ============ -->
  <text x="225" y="561" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">Opportunity</text>
  <text x="225" y="581" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">Evaluation</text>
  <rect class="ab-teal-bar" x="240" y="529" width="108.1" height="22" rx="2"/>
  <text x="356" y="544" font-size="13" font-weight="500" class="ab-ink">6.9%</text>
  <rect class="ab-navy-bar" x="240" y="557" width="208.3" height="22" rx="2"/>
  <text x="456" y="572" font-size="13" font-weight="500" class="ab-ink">13.3%</text>
  <rect class="ab-slate-bar" x="240" y="585" width="184.9" height="22" rx="2"/>
  <text x="432" y="600" font-size="13" font-weight="500" class="ab-ink">11.8%</text>

  <!-- ============ ROW 5: AB Product & Framework (AITL) ============ -->
  <text x="225" y="668" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">AB Product</text>
  <text x="225" y="688" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">&amp; Framework</text>
  <rect class="ab-teal-bar" x="240" y="636" width="6.3" height="22" rx="2"/>
  <text x="254" y="651" font-size="13" font-weight="500" class="ab-ink">0.4%</text>
  <rect class="ab-navy-bar" x="240" y="664" width="166.1" height="22" rx="2"/>
  <text x="414" y="679" font-size="13" font-weight="500" class="ab-ink">10.6%</text>
  <rect class="ab-slate-bar" x="240" y="692" width="84.6" height="22" rx="2"/>
  <text x="332" y="707" font-size="13" font-weight="500" class="ab-ink">5.4%</text>

  <!-- ============ ROW 6: Research & Framework (AITL) ============ -->
  <text x="225" y="775" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">Research</text>
  <text x="225" y="795" text-anchor="end" font-size="15" font-weight="500" class="ab-ink">&amp; Framework</text>
  <rect class="ab-teal-bar" x="240" y="743" width="1.6" height="22" rx="2"/>
  <text x="250" y="758" font-size="13" font-weight="500" class="ab-ink">0.1%</text>
  <rect class="ab-navy-bar" x="240" y="771" width="177.1" height="22" rx="2"/>
  <text x="425" y="786" font-size="13" font-weight="500" class="ab-ink">11.3%</text>
  <rect class="ab-slate-bar" x="240" y="799" width="134.7" height="22" rx="2"/>
  <text x="382" y="814" font-size="13" font-weight="500" class="ab-ink">8.6%</text>

  <!-- x-axis tick labels -->
  <g font-size="13" fill="#94A3B8" text-anchor="middle">
    <text x="240" y="855">0%</text>
    <text x="340" y="855">10%</text>
    <text x="440" y="855">20%</text>
    <text x="540" y="855">30%</text>
    <text x="640" y="855">40%</text>
    <text x="740" y="855">50%</text>
    <text x="840" y="855">60%</text>
  </g>
  <text x="620" y="880" font-size="14" class="ab-ink-2" text-anchor="middle" font-style="italic">% share</text>

  <!-- HITL card (aligned with rows 1-2) -->
  <g transform="translate(1260, 250)">
    <rect x="0" y="0" width="280" height="94" rx="6" fill="#FFFFFF" stroke="#0EA5E9" stroke-opacity="0.5" stroke-width="1.25"/>
    <text x="140" y="26" text-anchor="middle" font-size="14" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="1.5" fill="#0369A1">HITL</text>
    <text x="140" y="52" text-anchor="middle" font-size="15" font-weight="600" class="ab-ink">Human-in-the-loop</text>
    <text x="140" y="76" text-anchor="middle" font-size="13" class="ab-ink-2">AI drives · human oversees</text>
  </g>
  <!-- AITL card (aligned with rows 3-6) -->
  <g transform="translate(1260, 570)">
    <rect x="0" y="0" width="280" height="94" rx="6" fill="#FFFFFF" stroke="#0F2A4A" stroke-opacity="0.35" stroke-width="1.25"/>
    <text x="140" y="26" text-anchor="middle" font-size="14" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="1.5" class="ab-ink">AITL</text>
    <text x="140" y="52" text-anchor="middle" font-size="15" font-weight="600" class="ab-ink">AI-in-the-loop</text>
    <text x="140" y="76" text-anchor="middle" font-size="13" class="ab-ink-2">Human drives · AI assists</text>
  </g>

  <!-- Legend for the three lenses (bottom) -->
  <g transform="translate(80, 910)">
    <rect x="0" y="-11" width="18" height="14" class="ab-slate-bar" rx="2"/>
    <text x="26" y="0" font-size="13" class="ab-ink-2">Raw session-count %  ·  throughput lens</text>
    <rect x="380" y="-11" width="18" height="14" class="ab-navy-bar" rx="2"/>
    <text x="406" y="0" font-size="13" class="ab-ink-2">Weighted-proxy volume %  ·  attention estimate</text>
    <rect x="800" y="-11" width="18" height="14" class="ab-teal-bar" rx="2"/>
    <text x="826" y="0" font-size="13" class="ab-ink-2">Real token %  ·  cost measurement</text>
  </g>

  <!-- Caveat -->
  <text x="80" y="948" font-size="12.5" class="ab-ink-3" font-style="italic">Caveat: tokens measured for 30 of 93 sessions. Fuller measurement (Phase 2) may shift AITL token share upward — Product + Research most affected.</text>

  <!-- AB signature footer -->
  <line x1="80" y1="968" x2="1520" y2="968" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="988" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="2" class="ab-ink-3">ANALYTIC BYTES  ·  2026</text>
  <text x="1520" y="988" text-anchor="end" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="1" class="ab-ink-3">/library/artifacts/ab-three-lenses</text>
</svg>
