<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="720" fill="#FFFFFF"/>

  <!-- chart title: structural, centered, navy -->
  <text x="600" y="58" font-size="33" font-weight="700" fill="#0F2A4A" text-anchor="middle">Three conditions a measure must meet</text>

  <!-- column headers -->
  <text x="660" y="122" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="middle">Comparable</text>
  <text x="660" y="147" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="middle">across groups</text>

  <text x="850" y="122" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="middle">Definition holds</text>
  <text x="850" y="147" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="middle">over time</text>

  <text x="1040" y="122" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="middle">Grain matches</text>
  <text x="1040" y="147" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="middle">the decision</text>

  <line x1="60" y1="170" x2="1140" y2="170" stroke="#0F2A4A" stroke-width="1.4"/>

  <!-- row 1 — drug overdose -->
  <text x="60" y="214" font-size="22" fill="#0F2A4A">Drug overdose deaths by race</text>
  <text x="60" y="238" font-size="22" fill="#94A3B8">administrative, vital records · national grain</text>
  <circle cx="660" cy="218" r="10" fill="none" stroke="#0EA5E9" stroke-width="2.8"/>
  <circle cx="850" cy="218" r="10" fill="#0F2A4A"/>
  <circle cx="1040" cy="218" r="10" fill="#0F2A4A"/>
  <line x1="60" y1="258" x2="1140" y2="258" stroke="#E2E8F0" stroke-width="1"/>

  <!-- row 2 — NAEP -->
  <text x="60" y="292" font-size="22" fill="#0F2A4A">NAEP grade 8 mathematics</text>
  <text x="60" y="316" font-size="22" fill="#94A3B8">assessment, sampled · national and state grain</text>
  <circle cx="660" cy="296" r="10" fill="#0F2A4A"/>
  <circle cx="850" cy="296" r="10" fill="#0F2A4A"/>
  <circle cx="1040" cy="296" r="10" fill="none" stroke="#0EA5E9" stroke-width="2.8"/>
  <line x1="60" y1="336" x2="1140" y2="336" stroke="#E2E8F0" stroke-width="1"/>

  <!-- row 3 — NJ absenteeism -->
  <text x="60" y="370" font-size="22" fill="#0F2A4A">New Jersey chronic absenteeism</text>
  <text x="60" y="394" font-size="22" fill="#94A3B8">administrative · school and district grain</text>
  <circle cx="660" cy="374" r="10" fill="#0F2A4A"/>
  <circle cx="850" cy="374" r="10" fill="none" stroke="#0EA5E9" stroke-width="2.8"/>
  <circle cx="1040" cy="374" r="10" fill="#0F2A4A"/>
  <line x1="60" y1="414" x2="1140" y2="414" stroke="#E2E8F0" stroke-width="1"/>

  <!-- row 4 — flourishing -->
  <text x="60" y="448" font-size="22" fill="#0F2A4A">Child flourishing, NSCH</text>
  <text x="60" y="472" font-size="22" fill="#94A3B8">survey, caregiver-reported · state grain</text>
  <circle cx="660" cy="452" r="10" fill="#0F2A4A"/>
  <circle cx="850" cy="452" r="10" fill="none" stroke="#0EA5E9" stroke-width="2.8"/>
  <circle cx="1040" cy="452" r="10" fill="none" stroke="#0EA5E9" stroke-width="2.8"/>
  <line x1="60" y1="492" x2="1140" y2="492" stroke="#E2E8F0" stroke-width="1"/>

  <!-- row 5 — YRBSS -->
  <text x="60" y="526" font-size="22" fill="#0F2A4A">Adolescent mental health, YRBSS</text>
  <text x="60" y="550" font-size="22" fill="#94A3B8">survey, self-reported · national grain</text>
  <circle cx="660" cy="530" r="10" fill="#0F2A4A"/>
  <circle cx="850" cy="530" r="10" fill="none" stroke="#0EA5E9" stroke-width="2.8"/>
  <circle cx="1040" cy="530" r="10" fill="none" stroke="#0EA5E9" stroke-width="2.8"/>
  <line x1="60" y1="570" x2="1140" y2="570" stroke="#E2E8F0" stroke-width="1"/>

  <!-- row 6 — HRRP -->
  <text x="60" y="604" font-size="22" fill="#0F2A4A">Medicare 30-day readmissions</text>
  <text x="60" y="628" font-size="22" fill="#94A3B8">administrative · hospital grain, penalties from 2013</text>
  <circle cx="660" cy="608" r="10" fill="#0F2A4A"/>
  <circle cx="850" cy="608" r="10" fill="#0F2A4A"/>
  <circle cx="1040" cy="608" r="10" fill="#0F2A4A"/>

  <!-- legend -->
  <circle cx="68" cy="681" r="8" fill="#0F2A4A"/>
  <text x="86" y="688" font-size="22" fill="#475569">holds</text>
  <circle cx="208" cy="681" r="8" fill="none" stroke="#0EA5E9" stroke-width="2.4"/>
  <text x="226" y="688" font-size="22" fill="#475569">does not hold</text>
</svg>
