<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <defs>
    <marker id="rtnavy" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0F2A4A"/></marker>
    <marker id="rtteal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0EA5E9"/></marker>
  </defs>

  <text x="600" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F2A4A" text-anchor="middle">The round trip between the sheet and the record</text>

  <rect x="50" y="150" width="330" height="200" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="50" y="150" width="4" height="200" fill="#0F2A4A"/>
  <text x="215" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" letter-spacing="2" fill="#475569" text-anchor="middle">THE WORKING SHEET</text>
  <text x="215" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">Her columns, her rows</text>
  <text x="215" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">The surface she trusts</text>

  <rect x="820" y="150" width="330" height="200" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="820" y="150" width="4" height="200" fill="#0F2A4A"/>
  <text x="985" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" letter-spacing="2" fill="#475569" text-anchor="middle">THE RECORD</text>
  <text x="985" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">The system&#8217;s fields</text>
  <text x="985" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">What the institution holds</text>

  <text x="600" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569" text-anchor="middle">the model drafts,</text>
  <text x="600" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569" text-anchor="middle">the owner confirms</text>
  <line x1="398" y1="232" x2="800" y2="232" stroke="#0F2A4A" stroke-width="1.6" marker-end="url(#rtnavy)"/>

  <rect x="505" y="252" width="190" height="50" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.6"/>
  <text x="600" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0EA5E9" text-anchor="middle">The crosswalk</text>

  <line x1="802" y1="322" x2="400" y2="322" stroke="#0EA5E9" stroke-width="1.6" marker-end="url(#rtteal)"/>

  <text x="600" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#0EA5E9" text-anchor="middle">the export returns in the shape of the sheet, with the disagreements marked</text>

  <line x1="330" y1="446" x2="870" y2="446" stroke="#E2E8F0" stroke-width="1"/>
  <text x="600" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569" text-anchor="middle">the crosswalk is confirmed, dated, owned and versioned</text>
  <text x="600" y="516" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569" text-anchor="middle">ordinary code runs the confirmed rule every cycle</text>
</svg>
