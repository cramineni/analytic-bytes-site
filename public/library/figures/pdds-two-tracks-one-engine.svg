<svg viewBox="0 0 960 770" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>PDDS two-track architecture</title>
  <desc>One shared engine feeds two parallel tracks: the frozen six panels, golden-locked, and the extension panels 07 to 09, which are live. Each track has its own seeds, gates, and export, and both converge at the Next.js renderer.</desc>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#97A3B2"/>
    </marker>
    <style>
      .band{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
      .nt{fill:#1E293B;font-size:13.5px;font-weight:700}
      .sub{fill:#55637A;font-size:10.5px}
      .neu{fill:#EFF2F6;stroke:#C6CFD9;stroke-width:1.2}
      .fz{fill:#E3F0F0;stroke:#1C8C8C;stroke-width:1.3}
      .fzt{fill:#0F5F5F;font-size:13px;font-weight:700}
      .ex{fill:#ECE6F3;stroke:#7B6CA8;stroke-width:1.3}
      .ext{fill:#43356B;font-size:13px;font-weight:700}
      .chip{font-size:11px;font-weight:600}
      .flow{stroke:#97A3B2;stroke-width:1.6;fill:none}
      .cap{fill:#6E7686;font-size:11px}
    </style>
  </defs>

  <!-- SHARED FOUNDATION -->
  <rect class="neu" x="60" y="72" width="840" height="66" rx="10"/>
  <text class="nt" x="480" y="98" text-anchor="middle">Shared foundation — one engine, two tracks</text>
  <text class="sub" x="480" y="119" text-anchor="middle">Public sources → ingest → dbt-duckdb warehouse → AI narration layer</text>

  <!-- split -->
  <path class="flow" d="M480,138 L480,156 L250,156 L250,176" marker-end="url(#a2)"/>
  <path class="flow" d="M480,156 L710,156 L710,176" marker-end="url(#a2)"/>

  <!-- LEFT COLUMN: FROZEN SIX -->
  <text class="band" x="250" y="196" text-anchor="middle" fill="#1C8C8C">Frozen six · golden-locked</text>
  <g class="chip" fill="#0F5F5F">
    <rect class="fz" x="72" y="206" width="112" height="28" rx="6"/><text x="128" y="224" text-anchor="middle">maternal</text>
    <rect class="fz" x="194" y="206" width="112" height="28" rx="6"/><text x="250" y="224" text-anchor="middle">naep</text>
    <rect class="fz" x="316" y="206" width="112" height="28" rx="6"/><text x="372" y="224" text-anchor="middle">overdose</text>
    <rect class="fz" x="72" y="240" width="112" height="28" rx="6"/><text x="128" y="258" text-anchor="middle">readmissions</text>
    <rect class="fz" x="194" y="240" width="112" height="28" rx="6"/><text x="250" y="258" text-anchor="middle">scorecard</text>
    <rect class="fz" x="316" y="240" width="112" height="28" rx="6"/><text x="372" y="258" text-anchor="middle">slds</text>
  </g>
  <rect class="fz" x="90" y="288" width="320" height="46" rx="8"/>
  <text class="fzt" x="250" y="308" text-anchor="middle">Seeds &amp; models — raw_* / dim_* · fct_*</text>
  <text class="sub" x="250" y="325" text-anchor="middle" fill="#3C6E6E">the verified six</text>
  <path class="flow" d="M250,334 L250,352" marker-end="url(#a2)"/>
  <rect class="fz" x="90" y="352" width="320" height="46" rx="8"/>
  <text class="fzt" x="250" y="372" text-anchor="middle">Gates — assert_*</text>
  <text class="sub" x="250" y="389" text-anchor="middle" fill="#3C6E6E">grounding · caveats · voice · grain</text>
  <path class="flow" d="M250,398 L250,416" marker-end="url(#a2)"/>
  <rect class="fz" x="90" y="416" width="320" height="52" rx="8"/>
  <text class="fzt" x="250" y="438" text-anchor="middle">build_dashboard_json + golden_lock</text>
  <text class="sub" x="250" y="456" text-anchor="middle" fill="#3C6E6E">→ dashboard.json · drift blocked</text>

  <!-- RIGHT COLUMN: EXTENSION -->
  <text class="band" x="710" y="196" text-anchor="middle" fill="#7B6CA8">Extension 07–09 · live</text>
  <g class="chip" fill="#43356B">
    <rect class="ex" x="534" y="206" width="112" height="28" rx="6"/><text x="590" y="224" text-anchor="middle">NSCH</text>
    <rect class="ex" x="654" y="206" width="112" height="28" rx="6"/><text x="710" y="224" text-anchor="middle">absenteeism</text>
    <rect class="ex" x="774" y="206" width="112" height="28" rx="6"/><text x="830" y="224" text-anchor="middle">YRBS</text>
  </g>
  <rect class="ex" x="550" y="288" width="320" height="46" rx="8"/>
  <text class="ext" x="710" y="308" text-anchor="middle">Seeds &amp; models — raw_*_ext / *_ext</text>
  <text class="sub" x="710" y="325" text-anchor="middle" fill="#5A4C7A">the messy-survey panels</text>
  <path class="flow" d="M710,334 L710,352" marker-end="url(#a2)"/>
  <rect class="ex" x="550" y="346" width="320" height="58" rx="8"/>
  <text class="ext" x="710" y="366" text-anchor="middle">Gates — assert_*_ext</text>
  <text class="sub" x="710" y="383" text-anchor="middle" fill="#5A4C7A">grounding · caveats · voice</text>
  <text class="sub" x="710" y="397" text-anchor="middle" fill="#5A4C7A">+ suppression · reconciliation · lever typing</text>
  <path class="flow" d="M710,404 L710,416" marker-end="url(#a2)"/>
  <rect class="ex" x="550" y="416" width="320" height="52" rx="8"/>
  <text class="ext" x="710" y="438" text-anchor="middle">build_dashboard_ext_json</text>
  <text class="sub" x="710" y="456" text-anchor="middle" fill="#5A4C7A">→ dashboard_ext.json · not locked</text>

  <!-- converge -->
  <path class="flow" d="M250,468 L250,492 L480,492" marker-end="url(#a2)"/>
  <path class="flow" d="M710,468 L710,492 L482,492"/>
  <path class="flow" d="M480,492 L480,512" marker-end="url(#a2)"/>

  <!-- RENDERER -->
  <rect class="neu" x="270" y="512" width="420" height="54" rx="9"/>
  <text class="nt" x="480" y="535" text-anchor="middle">Next.js renderer</text>
  <text class="sub" x="480" y="553" text-anchor="middle">reads dashboard.json + dashboard_ext.json</text>

  <!-- CALLOUT -->
  <rect x="60" y="592" width="840" height="48" rx="8" fill="#FBF6EA" stroke="#E6D3A6"/>
  <text x="80" y="621" font-size="12" fill="#6E4A0E" font-weight="600">golden_lock freezes the six: any drift stops the build. The extension track stays open so new panels can evolve before they earn a lock.</text>

  <!-- LEGEND -->
  <rect x="60" y="656" width="16" height="16" rx="3" class="fz"/><text class="cap" x="84" y="669">Frozen six (locked)</text>
  <rect x="260" y="656" width="16" height="16" rx="3" class="ex"/><text class="cap" x="284" y="669">Extension (live)</text>
  <rect x="470" y="656" width="16" height="16" rx="3" class="neu"/><text class="cap" x="494" y="669">Shared across both tracks</text>
</svg>
