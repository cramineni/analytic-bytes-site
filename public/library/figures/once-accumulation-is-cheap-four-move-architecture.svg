<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Four moves that carry an AI-native operating layer</title>
<desc>A four-box horizontal diagram naming the four moves that carry an AI-native operating layer. Two navy boxes (Production, Recurrence) mark the moves that have become cheap: AI made production cheap; infrastructure makes recurrence cheap. Two teal boxes (Measurement, Governance) mark the moves that still cost real work: measurement keeps recurrence honest; governance acts on what measurement surfaces. A vertical divider separates the two pairs.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>

<!-- Chart title -->
<text x="600" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F2A4A" text-anchor="middle">Four moves that carry an AI-native operating layer</text>

<!-- Column group headers -->
<text x="330" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="3" fill="#94A3B8" text-anchor="middle">MADE CHEAP</text>
<text x="870" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="3" fill="#94A3B8" text-anchor="middle">STILL COST WORK</text>

<!-- Vertical divider between the two pairs -->
<line x1="600" y1="170" x2="600" y2="520" stroke="#E6ECF2" stroke-width="1"/>

<!-- Box 1: Production -->
<rect x="110" y="180" width="220" height="320" fill="none" stroke="#0F2A4A" stroke-width="1.4" rx="3"/>
<text x="220" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F2A4A" text-anchor="middle">Production</text>
<line x1="175" y1="258" x2="265" y2="258" stroke="#0F2A4A" stroke-width="1"/>
<text x="220" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569" text-anchor="middle">
  <tspan x="220" dy="0">One draft,</tspan>
  <tspan x="220" dy="26">one visual,</tspan>
  <tspan x="220" dy="26">one round of tightening.</tspan>
</text>
<text x="220" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0F2A4A" text-anchor="middle">AI made this cheap.</text>

<!-- Box 2: Recurrence -->
<rect x="350" y="180" width="220" height="320" fill="none" stroke="#0F2A4A" stroke-width="1.4" rx="3"/>
<text x="460" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F2A4A" text-anchor="middle">Recurrence</text>
<line x1="415" y1="258" x2="505" y2="258" stroke="#0F2A4A" stroke-width="1"/>
<text x="460" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569" text-anchor="middle">
  <tspan x="460" dy="0">The second draft,</tspan>
  <tspan x="460" dy="26">the thirtieth visual,</tspan>
  <tspan x="460" dy="26">the hundredth cover letter.</tspan>
</text>
<text x="460" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0F2A4A" text-anchor="middle">Infrastructure makes this cheap.</text>

<!-- Box 3: Measurement -->
<rect x="630" y="180" width="220" height="320" fill="none" stroke="#0EA5E9" stroke-width="1.8" rx="3"/>
<text x="740" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0EA5E9" text-anchor="middle">Measurement</text>
<line x1="695" y1="258" x2="785" y2="258" stroke="#0EA5E9" stroke-width="1"/>
<text x="740" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569" text-anchor="middle">
  <tspan x="740" dy="0">Definitions to check</tspan>
  <tspan x="740" dy="26">the recurrence</tspan>
  <tspan x="740" dy="26">against.</tspan>
</text>
<text x="740" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0EA5E9" text-anchor="middle">Keeps recurrence honest.</text>

<!-- Box 4: Governance -->
<rect x="870" y="180" width="220" height="320" fill="none" stroke="#0EA5E9" stroke-width="1.8" rx="3"/>
<text x="980" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0EA5E9" text-anchor="middle">Governance</text>
<line x1="935" y1="258" x2="1025" y2="258" stroke="#0EA5E9" stroke-width="1"/>
<text x="980" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569" text-anchor="middle">
  <tspan x="980" dy="0">Acts on what</tspan>
  <tspan x="980" dy="26">measurement</tspan>
  <tspan x="980" dy="26">surfaces.</tspan>
</text>
<text x="980" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0EA5E9" text-anchor="middle">The scarce work now.</text>

</svg>
