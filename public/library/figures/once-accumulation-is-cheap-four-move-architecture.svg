<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Four moves that carry an AI-native operating layer</title>
<desc>A two-by-two diagram. Left column, under the header Made cheap, holds two navy boxes: Production, which AI made cheap, and Recurrence, which infrastructure makes cheap. Right column, under the header Still cost work, holds two teal boxes: Measurement, which keeps recurrence honest, and Governance, which acts on what measurement surfaces. A thin vertical rule separates the columns.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>

<text x="600" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F2A4A" text-anchor="middle">Four moves that carry an AI-native operating layer</text>

<text x="50" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="2" fill="#94A3B8">MADE CHEAP</text>
<text x="630" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="2" fill="#94A3B8">STILL COST WORK</text>

<line x1="600" y1="145" x2="600" y2="545" stroke="#E6ECF2" stroke-width="1"/>

<!-- Production -->
<rect x="50" y="145" width="520" height="190" fill="none" stroke="#0F2A4A" stroke-width="1.4" rx="3"/>
<text x="80" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A">Production</text>
<text x="80" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0F2A4A">AI made this cheap.</text>
<text x="80" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569">
  <tspan x="80" dy="0">One draft, one visual,</tspan>
  <tspan x="80" dy="28">one round of tightening.</tspan>
</text>

<!-- Recurrence -->
<rect x="50" y="355" width="520" height="190" fill="none" stroke="#0F2A4A" stroke-width="1.4" rx="3"/>
<text x="80" y="401" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A">Recurrence</text>
<text x="80" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0F2A4A">Infrastructure makes this cheap.</text>
<text x="80" y="483" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569">
  <tspan x="80" dy="0">The second draft, the thirtieth visual,</tspan>
  <tspan x="80" dy="28">the hundredth cover letter.</tspan>
</text>

<!-- Measurement -->
<rect x="630" y="145" width="520" height="190" fill="none" stroke="#0EA5E9" stroke-width="1.8" rx="3"/>
<text x="660" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0EA5E9">Measurement</text>
<text x="660" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0EA5E9">Keeps recurrence honest.</text>
<text x="660" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569">
  <tspan x="660" dy="0">A definition that checks</tspan>
  <tspan x="660" dy="28">the recurrence.</tspan>
</text>

<!-- Governance -->
<rect x="630" y="355" width="520" height="190" fill="none" stroke="#0EA5E9" stroke-width="1.8" rx="3"/>
<text x="660" y="401" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0EA5E9">Governance</text>
<text x="660" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0EA5E9">Acts on what measurement surfaces.</text>
<text x="660" y="483" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569">
  <tspan x="660" dy="0">The scarce work now.</tspan>
</text>
</svg>
