<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="540" fill="#FFFFFF"/>
  <text x="600" y="48" font-size="33" font-weight="700" fill="#0F2A4A" text-anchor="middle">The chain across the stack</text>

  <!-- five nodes -->
  <g stroke="#0F2A4A" stroke-width="1.5" fill="#FFFFFF">
    <rect x="20" y="150" width="180" height="64" rx="4"/>
    <rect x="265" y="150" width="180" height="64" rx="4"/>
    <rect x="510" y="150" width="180" height="64" rx="4"/>
    <rect x="755" y="150" width="180" height="64" rx="4"/>
    <rect x="1000" y="150" width="180" height="64" rx="4"/>
  </g>
  <g font-size="22" fill="#0F2A4A" text-anchor="middle">
    <text x="110" y="190">Observation</text>
    <text x="355" y="190">Score</text>
    <text x="600" y="190">Aggregate</text>
    <text x="845" y="190">Outcome</text>
    <text x="1090" y="190">Decision</text>
  </g>

  <!-- navy links -->
  <g stroke="#0F2A4A" stroke-width="1.5" fill="none">
    <line x1="200" y1="182" x2="258" y2="182"/>
    <line x1="445" y1="182" x2="503" y2="182"/>
    <line x1="935" y1="182" x2="993" y2="182"/>
  </g>
  <g fill="#0F2A4A">
    <polygon points="258,177 266,182 258,187"/>
    <polygon points="503,177 511,182 503,187"/>
    <polygon points="993,177 1001,182 993,187"/>
  </g>
  <!-- the warranted link, teal -->
  <line x1="690" y1="182" x2="748" y2="182" stroke="#0EA5E9" stroke-width="3"/>
  <polygon points="748,176 757,182 748,188" fill="#0EA5E9"/>
  <circle cx="722" cy="182" r="7" fill="#0EA5E9"/>

  <!-- inference names above links -->
  <g font-size="22" fill="#475569" text-anchor="middle" letter-spacing="1">
    <text x="232" y="134">scoring</text>
    <text x="477" y="134">generalization</text>
    <text x="722" y="134" fill="#0EA5E9">extrapolation</text>
    <text x="967" y="134">use</text>
  </g>

  <!-- stack steps below nodes -->
  <g font-size="22" fill="#475569" text-anchor="middle">
    <text x="110" y="250">collection rule,</text>
    <text x="110" y="276">validation</text>
    <text x="355" y="250">metric</text>
    <text x="355" y="276">definition</text>
    <text x="600" y="250">rollup by</text>
    <text x="600" y="276">site, cohort</text>
    <text x="845" y="250">what the signal</text>
    <text x="845" y="276">is licensed to say</text>
    <text x="1090" y="250">funder or</text>
    <text x="1090" y="276">manager acts</text>
  </g>

  <!-- who holds which half -->
  <g stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4">
    <line x1="20" y1="318" x2="690" y2="318"/>
    <line x1="757" y1="318" x2="1180" y2="318"/>
  </g>
  <g font-size="22" fill="#475569" text-anchor="middle" letter-spacing="1">
    <text x="355" y="348">carried by the infrastructure, every day</text>
    <text x="968" y="348">acted on</text>
  </g>
  <line x1="722" y1="189" x2="722" y2="372" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="722" y="398" font-size="22" fill="#0EA5E9" text-anchor="middle" letter-spacing="1">established by evidence, dated</text>

  <!-- three fields on the link -->
  <g>
    <rect x="342" y="420" width="240" height="78" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="342" y="420" width="5" height="78" fill="#0EA5E9"/>
    <rect x="602" y="420" width="240" height="78" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="602" y="420" width="5" height="78" fill="#0EA5E9"/>
    <rect x="862" y="420" width="240" height="78" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="862" y="420" width="5" height="78" fill="#0EA5E9"/>
  </g>
  <g font-size="22" fill="#0F2A4A" text-anchor="middle">
    <text x="466" y="453">1  Claim licensed</text>
    <text x="726" y="453">2  Evidence, date</text>
    <text x="986" y="453">3  Recheck, owner</text>
  </g>
  <g font-size="22" fill="#475569" text-anchor="middle">
    <text x="466" y="482">operational or impact</text>
    <text x="726" y="482">study, population, date</text>
    <text x="986" y="482">trigger, decision owner</text>
  </g>
</svg>
