<svg viewBox="0 -110 1600 1400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dashboard as artifact vs dashboard as decision surface — embed</title>
<desc>Two-panel comparison for inline use within The Take-Home Test essay. Left: the same enrollment data rendered as a generic monthly board dashboard with no owner, no cadence, no decision. Right: the same data rendered as the Monday-morning surface the enrollment lead decides from, with owner, cadence, and the specific recurring call named. No top header or bottom AB band — those are carried by the page.</desc>

<!-- Background -->
<rect x="0" y="-110" width="1600" height="1400" fill="#FFFFFF"/>
<text x="800" y="-60" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="44" font-weight="700" fill="#0F2A4A" text-anchor="middle">Dashboard vs. decision surface</text>
<g transform="translate(0, 0)">

<!-- ===== LEFT PANEL: A DISPLAY ===== -->
<g transform="translate(80, 20)">
  <!-- Panel frame -->
  <rect x="0" y="0" width="680" height="1160" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Panel eyebrow -->
  <rect x="0" y="0" width="680" height="60" fill="#0F2A4A"/>
  <text x="22" y="40" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#FFFFFF">DASHBOARD AS ARTIFACT</text>

  <!-- Dashboard title -->
  <text x="22" y="115" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#0F2A4A">Monthly Enrollment</text>
  <text x="22" y="153" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#0F2A4A">Dashboard</text>
  <text x="22" y="195" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="500" fill="#64748B">Audience: Board</text>
  <text x="22" y="228" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="500" fill="#64748B">Updated monthly</text>

  <!-- 2x2 chart grid -->

  <!-- Chart 1: Total enrollment trend line -->
  <g transform="translate(22, 260)">
    <rect x="0" y="0" width="305" height="240" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="32" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#64748B">TOTAL ENROLLMENT</text>
    <text x="14" y="80" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#0F2A4A">4,827</text>
    <polyline points="14,195 60,185 106,175 152,165 198,155 244,145 290,140" fill="none" stroke="#0EA5E9" stroke-width="2.5"/>
    <line x1="14" y1="220" x2="290" y2="220" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- Chart 2: Conversion donut -->
  <g transform="translate(353, 260)">
    <rect x="0" y="0" width="305" height="240" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="32" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#64748B">CONVERSION RATE</text>
    <text x="14" y="80" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#0F2A4A">63%</text>
    <!-- donut -->
    <circle cx="225" cy="150" r="55" fill="none" stroke="#E2E8F0" stroke-width="18"/>
    <circle cx="225" cy="150" r="55" fill="none" stroke="#0EA5E9" stroke-width="18" stroke-dasharray="217 345" transform="rotate(-90 225 150)"/>
  </g>

  <!-- Chart 3: Bar chart by region -->
  <g transform="translate(22, 520)">
    <rect x="0" y="0" width="305" height="240" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="32" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#64748B">BY REGION</text>
    <rect x="40" y="90" width="42" height="110" fill="#0EA5E9"/>
    <rect x="98" y="120" width="42" height="80" fill="#0EA5E9"/>
    <rect x="156" y="75" width="42" height="125" fill="#0EA5E9"/>
    <rect x="214" y="140" width="42" height="60" fill="#0EA5E9"/>
    <line x1="14" y1="205" x2="290" y2="205" stroke="#94A3B8" stroke-width="1"/>
  </g>

  <!-- Chart 4: KPI tiles -->
  <g transform="translate(353, 520)">
    <rect x="0" y="0" width="305" height="240" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="32" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#64748B">YEAR-OVER-YEAR</text>
    <text x="14" y="98" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#0F2A4A">+4.2%</text>
    <text x="14" y="135" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#64748B">vs prior year</text>
    <text x="14" y="195" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#0EA5E9">▲ on plan</text>
  </g>

  <!-- Missing fields - stacked rows -->
  <g transform="translate(22, 800)">
    <text x="0" y="24" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#94A3B8">OWNER</text>
    <text x="200" y="24" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-style="italic" fill="#94A3B8">unspecified</text>

    <text x="0" y="78" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#94A3B8">CADENCE</text>
    <text x="200" y="78" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#475569">monthly</text>

    <text x="0" y="132" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#94A3B8">DECISION</text>
    <text x="200" y="132" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-style="italic" fill="#94A3B8">unspecified</text>
  </g>

  <!-- Bottom label -->
  <line x1="22" y1="1000" x2="658" y2="1000" stroke="#CBD5E1" stroke-width="1"/>
  <text x="22" y="1060" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5" fill="#0F2A4A">A display.</text>
  <text x="22" y="1100" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#64748B">Built for the audience.</text>
  <text x="22" y="1132" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#64748B">No call attached.</text>
</g>

<!-- ===== DIVIDER ===== -->
<g transform="translate(795, 20)">
  <line x1="0" y1="20" x2="0" y2="1140" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="0" cy="580" r="30" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <text x="0" y="590" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#0EA5E9">VS</text>
</g>

<!-- ===== RIGHT PANEL: A DECISION SURFACE ===== -->
<g transform="translate(840, 20)">
  <!-- Panel frame -->
  <rect x="0" y="0" width="680" height="1160" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>

  <!-- Panel eyebrow -->
  <rect x="0" y="0" width="680" height="60" fill="#0EA5E9"/>
  <text x="22" y="40" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#FFFFFF">DECISION SURFACE</text>

  <!-- Dashboard title -->
  <text x="22" y="115" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#0F2A4A">Enrollment Lead</text>
  <text x="22" y="153" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#0F2A4A">Monday 8:30 am</text>
  <text x="22" y="195" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="500" fill="#64748B">Audience: Enrollment Lead</text>
  <text x="22" y="228" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="500" fill="#64748B">Refreshed weekly</text>

  <!-- The decision, called out at top -->
  <g transform="translate(22, 260)">
    <rect x="0" y="0" width="636" height="110" fill="#0F2A4A"/>
    <text x="18" y="36" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#0EA5E9">THIS WEEK'S CALL</text>
    <text x="18" y="72" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Where do the next 40</text>
    <text x="18" y="102" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">outreach hours go?</text>
  </g>

  <!-- One focused chart -->
  <g transform="translate(22, 390)">
    <rect x="0" y="0" width="636" height="380" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="18" y="36" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#475569">ZIP CODES · GAP TO TARGET · WK 14</text>

    <!-- Bars: horizontal, sorted by gap -->
    <g transform="translate(18, 70)">
      <text x="0" y="18" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A">10453</text>
      <rect x="82" y="2" width="300" height="22" fill="#0EA5E9"/>
      <text x="390" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A">−112</text>
      <text x="470" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#0EA5E9">SEND TEAM</text>
    </g>
    <g transform="translate(18, 112)">
      <text x="0" y="18" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A">11226</text>
      <rect x="82" y="2" width="235" height="22" fill="#0EA5E9"/>
      <text x="325" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A">−88</text>
      <text x="470" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#0EA5E9">SEND TEAM</text>
    </g>
    <g transform="translate(18, 154)">
      <text x="0" y="18" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A">10458</text>
      <rect x="82" y="2" width="175" height="22" fill="#0EA5E9" opacity="0.7"/>
      <text x="265" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A">−65</text>
      <text x="470" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#0F2A4A">CALL LIST</text>
    </g>
    <g transform="translate(18, 196)">
      <text x="0" y="18" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A">10467</text>
      <rect x="82" y="2" width="110" height="22" fill="#0EA5E9" opacity="0.5"/>
      <text x="200" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A">−41</text>
      <text x="470" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#0F2A4A">CALL LIST</text>
    </g>
    <g transform="translate(18, 238)">
      <text x="0" y="18" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A">11216</text>
      <rect x="82" y="2" width="50" height="22" fill="#94A3B8"/>
      <text x="140" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#475569">−18</text>
      <text x="470" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#64748B">MONITOR</text>
    </g>
    <g transform="translate(18, 280)">
      <text x="0" y="18" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A">11221</text>
      <rect x="82" y="2" width="26" height="22" fill="#94A3B8"/>
      <text x="116" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#475569">−9</text>
      <text x="470" y="20" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#64748B">MONITOR</text>
    </g>

    <text x="18" y="356" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#64748B">Sorted by absolute gap. Action from prior-year lift.</text>
  </g>

  <!-- Named fields - stacked rows -->
  <g transform="translate(22, 800)">
    <text x="0" y="24" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#0EA5E9">OWNER</text>
    <text x="200" y="24" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#0F2A4A">Enrollment Lead</text>

    <text x="0" y="78" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#0EA5E9">CADENCE</text>
    <text x="200" y="78" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#0F2A4A">Every Mon, 8:30 am</text>

    <text x="0" y="132" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#0EA5E9">DECISION</text>
    <text x="200" y="132" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#0F2A4A">Where outreach goes</text>
  </g>

  <!-- Bottom label -->
  <line x1="22" y1="1000" x2="658" y2="1000" stroke="#0EA5E9" stroke-width="1"/>
  <text x="22" y="1060" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5" fill="#0EA5E9">A decision surface.</text>
  <text x="22" y="1100" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#64748B">Built backward from a decision,</text>
  <text x="22" y="1132" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#64748B">an owner, and a cadence.</text>
</g>
</g>
</svg>
