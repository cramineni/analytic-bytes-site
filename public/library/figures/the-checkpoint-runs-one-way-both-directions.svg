<rect x="180" y="152.0" width="5" height="96" fill="#0F2A4A"/>
<text x="287.0" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">Certify</text>
<text x="287.0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569" text-anchor="middle">alignment Y and Z</text>
<line x1="391" y1="200" x2="397" y2="200" stroke="#0F2A4A" stroke-width="1.6"/>
<polyline points="393,196 398,200 393,204" fill="none" stroke="#0F2A4A" stroke-width="1.6"/>
