<text x="507.0" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">Evaluator</text>
<text x="507.0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569" text-anchor="middle">embedded, on site</text>
<line x1="611" y1="200" x2="617" y2="200" stroke="#0F2A4A" stroke-width="1.6"/>
<polyline points="613,196 618,200 613,204" fill="none" stroke="#0F2A4A" stroke-width="1.6"/>
