<text x="1094" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569">moves</text>
<text x="40" y="346.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#0F2A4A">Benefit claim<tspan font-weight="400" fill="#94A3B8">  proposed here, not in place</tspan></text>
