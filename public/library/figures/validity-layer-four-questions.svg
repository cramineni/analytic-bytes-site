<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" role="img" aria-labelledby="title desc">
  <title id="title">The four validity questions</title>
  <desc id="desc">A vertical stack of four cards enumerating the validity questions the responsible-AI floor depends on. The first names the construct. The second asks what validation evidence exists and what use it was built for. The third asks where the case is thinnest and what policy applies there, including a named decision owner and the date the gap opened. The fourth asks what drift monitoring runs and what it triggers. A footer notes that the last three are questions about use rather than about the instrument, and attributes the position to Kane 1992 and Messick 1995.</desc>

  <rect x="0" y="0" width="1200" height="920" fill="#FFFFFF"/>
  <text x="600" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">Four validity questions</text>

  <!-- Q1 -->
  <g>
    <rect x="48" y="100" width="1104" height="160" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="48" y="100" width="6" height="160" fill="#0EA5E9"/>
    <text x="80" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0EA5E9" letter-spacing="3">Q1</text>
    <text x="80" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F2A4A">What is the construct?</text>
    <text x="80" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">The thing the model claims to detect, named in one sentence, before anything else</text>
    <text x="80" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">can be evaluated against it.</text>
  </g>

  <!-- Q2 -->
  <g>
    <rect x="48" y="280" width="1104" height="190" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="48" y="280" width="6" height="190" fill="#0EA5E9"/>
    <text x="80" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0EA5E9" letter-spacing="3">Q2</text>
    <text x="80" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F2A4A">What validation evidence, and what use was it built for?</text>
    <text x="80" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Sample sizes, populations, comparators, time horizons, independence.</text>
    <text x="80" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Published or proprietary. And the use cases the evidence actually covers,</text>
    <text x="80" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">which is rarely the use in front of you.</text>
  </g>

  <!-- Q3 -->
  <g>
    <rect x="48" y="490" width="1104" height="190" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="48" y="490" width="6" height="190" fill="#0EA5E9"/>
    <text x="80" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0EA5E9" letter-spacing="3">Q3</text>
    <text x="80" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F2A4A">Where is the case thinnest, and what happens there?</text>
    <text x="80" y="606" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">The under-validated populations and use cases, named before deployment,</text>
    <text x="80" y="636" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">not after a regulator asks. Each with a policy: disclosure, restricted use,</text>
    <text x="80" y="666" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">human-in-the-loop, or a named owner and a start date.</text>
  </g>

  <!-- Q4 -->
  <g>
    <rect x="48" y="700" width="1104" height="160" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="48" y="700" width="6" height="160" fill="#0EA5E9"/>
    <text x="80" y="740" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0EA5E9" letter-spacing="3">Q4</text>
    <text x="80" y="780" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F2A4A">What drift monitoring, and what does it trigger?</text>
    <text x="80" y="816" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Cadence for construct, population, and user-effect drift after deployment.</text>
    <text x="80" y="846" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">And what the institution actually does when one of them surfaces.</text>
  </g>

  <!-- Footer: the frame the four questions sit inside -->
  <line x1="48" y1="898" x2="1152" y2="898" stroke="#E2E8F0" stroke-width="1"/>
</svg>
