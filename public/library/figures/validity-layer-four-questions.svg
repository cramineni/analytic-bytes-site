<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -110 1200 810" width="1200" height="700" role="img" aria-labelledby="title desc">
<!-- HEADER -->
<text x="72" y="-60" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#0F2A4A" text-anchor="start">The four validity questions</text>
<text x="72" y="-34" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">What the responsible-AI floor rests on — the questions that have to hold for a claim to earn a decision.</text>
  <title id="title">The four validity questions</title>
  <desc id="desc">A vertical stack of four cards enumerating the validity questions the responsible-AI floor depends on. The first names the construct. The second asks what validation evidence exists and what use it was built for. The third asks where the case is thinnest and what policy applies there, including a named decision owner and the date the gap opened. The fourth asks what drift monitoring runs and what it triggers. A footer notes that the last three are questions about use rather than about the instrument, and attributes the position to Kane 1992 and Messick 1995.</desc>

  <rect x="0" y="0" width="1200" height="700" fill="#FFFFFF"/>

  <!-- Q1 -->
  <g>
    <rect x="72" y="64" width="1056" height="120" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="64" width="6" height="120" fill="#0EA5E9"/>
    <text x="104" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0EA5E9" letter-spacing="2">Q1</text>
    <text x="104" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A">What is the construct?</text>
    <text x="104" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">The thing the model claims to detect, named in one sentence, before anything else can be</text>
    <text x="104" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">evaluated against it.</text>
  </g>

  <!-- Q2 -->
  <g>
    <rect x="72" y="204" width="1056" height="120" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="204" width="6" height="120" fill="#0EA5E9"/>
    <text x="104" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0EA5E9" letter-spacing="2">Q2</text>
    <text x="104" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A">What validation evidence, and what use was it built for?</text>
    <text x="104" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Sample sizes, populations, comparators, time horizons, independence. Published or proprietary.</text>
    <text x="104" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">And the use cases the evidence actually covers, which is rarely the use in front of you.</text>
  </g>

  <!-- Q3 -->
  <g>
    <rect x="72" y="344" width="1056" height="120" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="344" width="6" height="120" fill="#0EA5E9"/>
    <text x="104" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0EA5E9" letter-spacing="2">Q3</text>
    <text x="104" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A">Where is the case thinnest, and what happens there?</text>
    <text x="104" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">The under-validated populations and use cases, named before deployment, not after a regulator asks.</text>
    <text x="104" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Each with a policy: disclosure, restricted use, human-in-the-loop, or a named owner and a start date.</text>
  </g>

  <!-- Q4 -->
  <g>
    <rect x="72" y="484" width="1056" height="120" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="484" width="6" height="120" fill="#0EA5E9"/>
    <text x="104" y="516" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0EA5E9" letter-spacing="2">Q4</text>
    <text x="104" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A">What drift monitoring, and what does it trigger?</text>
    <text x="104" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Cadence for construct, population, and user-effect drift after deployment.</text>
    <text x="104" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">And what the institution actually does when one of them surfaces.</text>
  </g>

  <!-- Footer: the frame the four questions sit inside -->
  <line x1="72" y1="636" x2="1128" y2="636" stroke="#E2E8F0" stroke-width="1"/>
  
  
</svg>
