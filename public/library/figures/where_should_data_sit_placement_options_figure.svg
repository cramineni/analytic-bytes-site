<svg viewBox="0 -110 1200 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Where data can sit — five common placements, one AB-argued position</title>
<desc>Five horizontal placement bands, each labeled with a common reporting line and its typical framing. From top to bottom: under the CTO (technical infrastructure), under the CFO (governed asset), under the CDO or CDAO (standalone strategic asset), under the CPO (product-serving), and the AB-argued placement — an independent function positioned closest to the COO. The COO-adjacent placement is highlighted in teal as the essay's argument, with a small annotation.</desc>
<rect x="0" y="-110" width="1200" height="900" fill="#FFFFFF"/>
<text x="600" y="-60" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">Placement options</text>
<g transform="translate(0, -110)">
<!-- HEADER -->

<!-- Placement 1: CTO -->
<rect x="30" y="120" width="1140" height="110" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="55" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A" text-anchor="start">Under the CTO</text>
<text x="1145" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="end">data as technical infrastructure</text>
<text x="55" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94A3B8" text-anchor="start">Serves engineering. Rubric emphasizes pipelines and platform depth.</text>

<!-- Placement 2: CFO -->
<rect x="30" y="250" width="1140" height="110" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="55" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A" text-anchor="start">Under the CFO</text>
<text x="1145" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="end">data as governed, risk-bearing asset</text>
<text x="55" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94A3B8" text-anchor="start">Serves finance and compliance. Rubric emphasizes controls and audit.</text>

<!-- Placement 3: CDO / CDAO — standalone -->
<rect x="30" y="380" width="1140" height="110" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="55" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A" text-anchor="start">Standalone CDO / CDAO</text>
<text x="1145" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="end">data as its own strategic seat</text>
<text x="55" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94A3B8" text-anchor="start">Serves the enterprise but often abstracted from operational decisions.</text>

<!-- Placement 4: CPO — product-serving -->
<rect x="30" y="510" width="1140" height="110" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="55" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A" text-anchor="start">Under the CPO</text>
<text x="1145" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="end">data in service of the product</text>
<text x="55" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94A3B8" text-anchor="start">Serves product priorities. Enterprise-decision reach is limited.</text>

<!-- Placement 5: AB-argued — independent, COO-adjacent — teal highlight -->
<rect x="30" y="640" width="1140" height="150" fill="none" stroke="#0EA5E9" stroke-width="2" rx="3"/>
<text x="55" y="685" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A" text-anchor="start">Independent function, closest to the COO</text>
<text x="1145" y="685" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0EA5E9" text-anchor="end">the AB-argued placement</text>
<text x="55" y="725" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">Serves the whole-organization decision interface. Collaborates closely</text>
<text x="55" y="753" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">with the CTO on infrastructure.</text>
<text x="55" y="781" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">Independent from any single function's incentives.</text>
</g>
</svg>
