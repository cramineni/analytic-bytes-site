<svg viewBox="0 0 1200 478" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Six drift modes in two families</title>
<desc>Two side-by-side families of drift. The left family, labeled Instrument, holds model drift, conversational drift, and detection-accuracy regression, and is marked as already covered by responsible-AI monitoring. The right family, labeled Claim and drawn in teal, holds construct drift, population drift, and user-effect drift, and is marked as the layer the validity discipline adds.</desc>
<rect width="1200" height="540" fill="#FFFFFF"/>
<text x="600" y="28" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F2A4A" text-anchor="middle">Six drift modes, two families</text>
<g transform="translate(0, -62)">

<!-- HEADER -->

<!-- LEFT FAMILY: instrument -->
<rect x="70" y="130" width="500" height="360" fill="none" stroke="#CBD5E1" stroke-width="1" rx="4"/>
<text x="320" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="middle">FAMILY ONE — THE INSTRUMENT</text>
<text x="320" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">What responsible-AI monitoring already names</text>

<rect x="100" y="211" width="440" height="76" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="122" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A">Model drift</text>
<text x="122" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">The underlying model is updated and responses shift,</text>
<text x="122" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">including how distress is handled.</text>

<rect x="100" y="301" width="440" height="76" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="122" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A">Conversational drift</text>
<text x="122" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">Prompt and content changes accumulate until tone and</text>
<text x="122" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">scope no longer match the clinical design.</text>

<rect x="100" y="391" width="440" height="76" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="122" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A">Detection-accuracy regression</text>
<text x="122" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">Performance degrades for one group while the</text>
<text x="122" y="459" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">aggregate numbers still look fine.</text>

<!-- RIGHT FAMILY: claim -->
<rect x="630" y="130" width="500" height="360" fill="none" stroke="#0EA5E9" stroke-width="2" rx="4"/>
<text x="880" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#0EA5E9" text-anchor="middle">FAMILY TWO — THE CLAIM</text>
<text x="880" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">What the validity layer adds</text>

<rect x="660" y="211" width="440" height="76" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="682" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A">Construct drift</text>
<text x="682" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">What the field means by depression, wellbeing or</text>
<text x="682" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">engagement shifts against the validated proxy.</text>

<rect x="660" y="301" width="440" height="76" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="682" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A">Population drift</text>
<text x="682" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">The people using the system change in composition,</text>
<text x="682" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">so the original validation stops applying.</text>

<rect x="660" y="391" width="440" height="76" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="682" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A">User-effect drift</text>
<text x="682" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">The system's effect on users over months of repeated</text>
<text x="682" y="459" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">use, which point-in-time evaluation cannot see.</text>
</g>
</svg>
