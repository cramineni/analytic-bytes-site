<svg viewBox="0 -110 1200 780" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The validity gap — the score is identical, the construct and the consequence are not</title>
<desc>A three-stage diagram. On the left, two stacked boxes: the claimed path starts from Construct, what the system says it measures; the actual path starts from Proxy, what it learned to track instead. Both feed into a single shared middle box holding the score and the decision it triggers, marked identical on both paths, and noting that agreement, accuracy and fairness checks all run there and cannot see the split. On the right the paths separate again into two consequence boxes, the intended outcome and a different actual outcome that concentrates on the people the proxy tracks worst. A teal band between the two right-hand boxes is labelled the validity gap. The caption states that the divergence is invisible at the score and shows up only at the two ends.</desc>
<rect x="0" y="-110" width="1200" height="780" fill="#FFFFFF"/>
<text x="600" y="-60" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">The validity gap</text>
<g transform="translate(0, -110)">
<!-- HEADER -->

<!-- LEFT: two starting points -->
<text x="185" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="middle">CLAIMED PATH</text>
<rect x="30" y="175" width="310" height="170" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="185" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A" text-anchor="middle">Construct</text>
<text x="185" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">what the system claims</text>
<text x="185" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">to be measuring</text>

<text x="185" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="middle">ACTUAL PATH</text>
<rect x="30" y="455" width="310" height="170" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>
<text x="185" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="middle">Proxy</text>
<text x="185" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94A3B8" text-anchor="middle">what it learned to track</text>
<text x="185" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94A3B8" text-anchor="middle">instead</text>

<line x1="340" y1="260" x2="390" y2="260" stroke="#0F2A4A" stroke-width="1.5"/>
<polygon points="386,254 400,260 386,266" fill="#0F2A4A"/>
<line x1="340" y1="540" x2="390" y2="540" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
<polygon points="386,534 400,540 386,546" fill="#475569"/>

<!-- MIDDLE: the shared, indistinguishable stretch -->
<rect x="400" y="175" width="330" height="450" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="565" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#0F2A4A" text-anchor="middle">The score</text>
<text x="565" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">and the decision it triggers</text>
<line x1="440" y1="305" x2="690" y2="305" stroke="#CBD5E1" stroke-width="1"/>
<text x="565" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1.5" fill="#0EA5E9" text-anchor="middle">IDENTICAL ON</text>
<text x="565" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1.5" fill="#0EA5E9" text-anchor="middle">BOTH PATHS</text>
<text x="565" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">Agreement with human raters,</text>
<text x="565" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">accuracy, and fairness across</text>
<text x="565" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">groups are all measured here.</text>
<text x="565" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#475569" text-anchor="middle">None of them can see</text>
<text x="565" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#475569" text-anchor="middle">the split.</text>

<line x1="730" y1="260" x2="780" y2="260" stroke="#0F2A4A" stroke-width="1.5"/>
<polygon points="776,254 790,260 776,266" fill="#0F2A4A"/>
<line x1="730" y1="540" x2="780" y2="540" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
<polygon points="776,534 790,540 776,546" fill="#475569"/>

<!-- RIGHT: where the two paths come apart again -->
<rect x="790" y="170" width="380" height="180" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="815" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A">Intended</text>
<text x="815" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A">consequence</text>
<text x="815" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569">The outcome the deployment was</text>
<text x="815" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569">justified by, reaching the people it named.</text>

<rect x="790" y="370" width="380" height="70" fill="#E0F2FE"/>
<text x="980" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="#0EA5E9" text-anchor="middle">THE VALIDITY GAP</text>

<rect x="790" y="460" width="380" height="180" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>
<text x="815" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#475569">Actual</text>
<text x="815" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#475569">consequence</text>
<text x="815" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94A3B8">A different outcome, concentrated on</text>
<text x="815" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94A3B8">the people the proxy tracks worst.</text>

<!-- Caption -->
</g>
</svg>
