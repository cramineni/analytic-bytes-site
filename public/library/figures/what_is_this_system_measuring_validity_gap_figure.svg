<svg viewBox="0 -110 1200 730" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The validity gap — the score is identical, the construct and the consequence are not</title>
<desc>A three-stage diagram. On the left, two stacked boxes: the claimed path starts from Construct, what the system says it measures; the actual path starts from Proxy, what it learned to track instead. Both feed into a single shared middle box holding the score and the decision it triggers, marked identical on both paths, and noting that agreement, accuracy and fairness checks all run there and cannot see the split. On the right the paths separate again into two consequence boxes, the intended outcome and a different actual outcome that concentrates on the people the proxy tracks worst. A teal band between the two right-hand boxes is labelled the validity gap. The caption states that the divergence is invisible at the score and shows up only at the two ends.</desc>
<rect x="0" y="-110" width="1200" height="730" fill="#FFFFFF"/>
<text x="600" y="-65" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="13" font-weight="600" fill="#0EA5E9" letter-spacing="3" text-anchor="middle">THE VALIDITY GAP</text>
<!-- HEADER -->

<!-- LEFT: two starting points -->
<text x="185" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="middle">CLAIMED PATH</text>
<rect x="60" y="210" width="250" height="90" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="185" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A" text-anchor="middle">Construct</text>
<text x="185" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">what the system claims</text>
<text x="185" y="283" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">to be measuring</text>

<text x="185" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="middle">ACTUAL PATH</text>
<rect x="60" y="370" width="250" height="90" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>
<text x="185" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">Proxy</text>
<text x="185" y="427" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">what it learned to track</text>
<text x="185" y="443" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">instead</text>

<line x1="310" y1="255" x2="356" y2="255" stroke="#0F2A4A" stroke-width="1.5"/>
<polygon points="352,249 365,255 352,261" fill="#0F2A4A"/>
<line x1="310" y1="415" x2="356" y2="415" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
<polygon points="352,409 365,415 352,421" fill="#475569"/>

<!-- MIDDLE: the shared, indistinguishable stretch -->
<rect x="370" y="210" width="280" height="250" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="510" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F2A4A" text-anchor="middle">The score</text>
<text x="510" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">and the decision it triggers</text>
<line x1="410" y1="302" x2="610" y2="302" stroke="#CBD5E1" stroke-width="1"/>
<text x="510" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#0EA5E9" text-anchor="middle">IDENTICAL ON BOTH PATHS</text>
<text x="510" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">Agreement with human raters,</text>
<text x="510" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">accuracy, and fairness across groups</text>
<text x="510" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">are all measured here.</text>
<text x="510" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-style="italic" fill="#475569" text-anchor="middle">None of them can see the split.</text>

<line x1="650" y1="250" x2="696" y2="250" stroke="#0F2A4A" stroke-width="1.5"/>
<polygon points="692,244 705,250 692,256" fill="#0F2A4A"/>
<line x1="650" y1="420" x2="696" y2="420" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
<polygon points="692,414 705,420 692,426" fill="#475569"/>

<!-- RIGHT: where the two paths come apart again -->
<rect x="710" y="200" width="430" height="100" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="734" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A">Intended consequence</text>
<text x="734" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">The outcome the deployment was justified by, reaching</text>
<text x="734" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">the people it named.</text>

<rect x="710" y="310" width="430" height="50" fill="#E0F2FE"/>
<text x="925" y="341" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#0EA5E9" text-anchor="middle">THE VALIDITY GAP</text>

<rect x="710" y="370" width="430" height="100" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>
<text x="734" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#475569">Actual consequence</text>
<text x="734" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94A3B8">A different outcome, concentrated on the people the</text>
<text x="734" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94A3B8">proxy tracks worst.</text>

<!-- Caption -->



</svg>
