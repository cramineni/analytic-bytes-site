<svg viewBox="0 -150 1200 720" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Three surfaces, one keystone: three reporting products sitting on one canonical semantic layer</title>
<desc>Three navy-bordered surface boxes across the top labeled Executive, Operations, Analytical, each with a short essence line. All three connect by downward converging lines to a wider teal keystone at the bottom labeled Semantic layer, one canonical computation per concept. The visual encodes the essay's thesis that three different products can share one governed definition.</desc>
<rect x="0" y="-150" width="1200" height="720" fill="#FFFFFF"/>
<text x="600" y="-100" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">Three surfaces, one keystone</text>

<!-- Three surface boxes across the top -->
<g>
  <!-- Executive -->
  <rect x="30" y="30" width="360" height="180" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
  <text x="210" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="middle">Executive surface</text>
  <text x="210" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">Board / Chief. Cycle cadence.</text>
  <text x="210" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">Publication-grade output.</text>

  <!-- Operations -->
  <rect x="420" y="30" width="360" height="180" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
  <text x="600" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="middle">Operations surface</text>
  <text x="600" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">Program / delivery. Weekly.</text>
  <text x="600" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">Action-oriented console.</text>

  <!-- Analytical -->
  <rect x="810" y="30" width="360" height="180" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
  <text x="990" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="middle">Analytical surface</text>
  <text x="990" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">Analyst / researcher. Ad hoc.</text>
  <text x="990" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">Deep exploration + BI.</text>
</g>

<!-- Converging lines to keystone -->
<line x1="210" y1="210" x2="600" y2="380" stroke="#94A3B8" stroke-width="1.2"/>
<line x1="600" y1="210" x2="600" y2="380" stroke="#94A3B8" stroke-width="1.2"/>
<line x1="990" y1="210" x2="600" y2="380" stroke="#94A3B8" stroke-width="1.2"/>

<!-- Keystone -->
<rect x="240" y="380" width="720" height="140" fill="none" stroke="#0EA5E9" stroke-width="2" rx="3"/>
<text x="600" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A" text-anchor="middle">The keystone — semantic layer</text>
</svg>
