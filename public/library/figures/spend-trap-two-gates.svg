<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Two gates, not one: a cost-per-outcome number has to pass both same-scope and warrant</title>
<desc>A raw cost-over-outcomes ratio has to pass two separate gates to become a defensible claim. Gate 1, same-scope, is this note's move: both numbers carry the same program, cohort, site, and period; without it the division compares mismatched slices. Gate 2, warrant, belongs to The Valid Dollar: the evidence has to earn the verb — supported, contributed to, produced; without it a correlation is dressed as a cause. A number needs both.</desc>
<rect width="1200" height="560" fill="#FFFFFF"/>

<text x="600" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">Two gates, not one</text>

<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">

<!-- input node -->
<rect x="30" y="240" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.6"/>
<text x="120" y="222" font-size="22" letter-spacing="2" fill="#94A3B8" text-anchor="middle">THE NUMBER</text>
<text x="120" y="292" font-size="22" fill="#0F2A4A" text-anchor="middle">cost</text>
<text x="120" y="320" font-size="22" fill="#0F2A4A" text-anchor="middle">&#247;</text>
<text x="120" y="348" font-size="22" fill="#0F2A4A" text-anchor="middle">outcomes</text>

<text x="232" y="308" font-size="30" fill="#0F2A4A" text-anchor="middle">&#8594;</text>

<!-- gate 1: same-scope (this note, teal) -->
<rect x="260" y="140" width="320" height="320" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="260" y="140" width="6" height="320" fill="#0EA5E9"/>
<text x="286" y="180" font-size="22" font-weight="700" letter-spacing="0.5" fill="#0EA5E9">GATE 1 &#183; SAME-SCOPE</text>
<text x="286" y="220" font-size="22" fill="#475569">both numbers carry the</text>
<text x="286" y="248" font-size="22" fill="#475569">same program &#183; cohort</text>
<text x="286" y="276" font-size="22" fill="#475569">&#183; site &#183; period</text>
<line x1="286" y1="298" x2="556" y2="298" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="286" y="330" font-size="22" font-style="italic" fill="#94A3B8">without it:</text>
<text x="286" y="358" font-size="22" font-style="italic" fill="#94A3B8">mismatched slices</text>
<text x="420" y="430" font-size="22" fill="#0EA5E9" text-anchor="middle">this note</text>

<text x="602" y="308" font-size="30" fill="#0F2A4A" text-anchor="middle">&#8594;</text>

<!-- gate 2: warrant (companion, navy) -->
<rect x="630" y="140" width="320" height="320" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="630" y="140" width="6" height="320" fill="#0F2A4A"/>
<text x="656" y="180" font-size="22" font-weight="700" letter-spacing="0.5" fill="#0F2A4A">GATE 2 &#183; WARRANT</text>
<text x="656" y="220" font-size="22" fill="#475569">the evidence earns the</text>
<text x="656" y="248" font-size="22" fill="#475569">verb &#8212; supported &#183;</text>
<text x="656" y="276" font-size="22" fill="#475569">contributed &#183; produced</text>
<line x1="656" y1="298" x2="926" y2="298" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="656" y="330" font-size="22" font-style="italic" fill="#94A3B8">without it:</text>
<text x="656" y="358" font-size="22" font-style="italic" fill="#94A3B8">correlation as cause</text>
<text x="790" y="430" font-size="22" font-style="italic" fill="#475569" text-anchor="middle">The Valid Dollar</text>

<text x="972" y="308" font-size="30" fill="#0F2A4A" text-anchor="middle">&#8594;</text>

<!-- output node -->
<rect x="1000" y="240" width="180" height="120" rx="8" fill="#0F2A4A"/>
<text x="1090" y="290" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">defensible</text>
<text x="1090" y="320" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">cost per</text>
<text x="1090" y="348" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">outcome</text>
</g>
</svg>
