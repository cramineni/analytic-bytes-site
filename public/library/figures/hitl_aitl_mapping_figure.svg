<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>HITL / AITL mapping across ten task categories</title>
<desc>A three-column figure showing how the ten AB task categories map to HITL (AI drives), Shared, or AITL (operator drives). HITL: Recurring Automation. AITL: Strategic and Meta-Reflection, Product and Framework, Long-form Writing, Talk Prep, Content and Distribution, Learning and Reading. Shared: Website and Technical Dev, Project Proposals and Evaluations, Research and Framework Review.</desc>

<rect width="1200" height="560" fill="#FFFFFF"/>

<!-- Title -->
<text x="80" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F2A4A">Load-carrier axis: HITL / AITL across ten categories</text>
<text x="80" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-style="italic" fill="#475569">Which side of the operator carries the work — the human, the AI, or shared.</text>

<!-- Divider -->
<line x1="80" y1="110" x2="1120" y2="110" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.4"/>

<!-- Three column headers with explicit light backgrounds for contrast -->
<!-- Column 1: HITL (AI drives) — x=80 to x=440 -->
<rect x="80" y="130" width="340" height="46" fill="#E0F2FE"/>
<text x="250" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#0369A1" text-anchor="middle">HITL — AI DRIVES</text>
<text x="250" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Human oversees, corrects when it drifts</text>

<!-- Column 2: SHARED — x=440 to x=780 -->
<rect x="440" y="130" width="340" height="46" fill="#F1F5F9"/>
<text x="610" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#334155" text-anchor="middle">SHARED</text>
<text x="610" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Load moves back and forth per session</text>

<!-- Column 3: AITL (Operator drives) — x=780 to x=1120 -->
<rect x="780" y="130" width="340" height="46" fill="#EFF6FF"/>
<text x="950" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#0F2A4A" text-anchor="middle">AITL — OPERATOR DRIVES</text>
<text x="950" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">AI assists — drafts, synthesizes, scaffolds</text>

<!-- Column 1 chips: HITL categories -->
<!-- Recurring Automation -->
<rect x="100" y="200" width="300" height="46" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5" rx="4"/>
<text x="250" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F2A4A" text-anchor="middle">Recurring Automation</text>
<text x="250" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">AI carries almost fully</text>

<!-- Column 2 chips: SHARED categories -->
<!-- Website & Technical Dev -->
<rect x="460" y="200" width="300" height="46" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" rx="4"/>
<text x="610" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F2A4A" text-anchor="middle">Website &amp; Technical Dev</text>
<text x="610" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">AI scaffolds; operator directs</text>

<!-- Project Proposals & Evaluations -->
<rect x="460" y="256" width="300" height="46" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" rx="4"/>
<text x="610" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F2A4A" text-anchor="middle">Project Proposals &amp; Evaluations</text>
<text x="610" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Operator + AI shared</text>

<!-- Research & Framework Review -->
<rect x="460" y="312" width="300" height="46" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" rx="4"/>
<text x="610" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F2A4A" text-anchor="middle">Research &amp; Framework Review</text>
<text x="610" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">AI synthesizes; operator evaluates</text>

<!-- Column 3 chips: AITL categories -->
<!-- Strategic & Meta-Reflection -->
<rect x="800" y="200" width="300" height="46" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5" rx="4"/>
<text x="950" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F2A4A" text-anchor="middle">Strategic &amp; Meta-Reflection</text>
<text x="950" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Operator leads; AI is thinking partner</text>

<!-- Product & Framework -->
<rect x="800" y="256" width="300" height="46" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5" rx="4"/>
<text x="950" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F2A4A" text-anchor="middle">Product &amp; Framework</text>
<text x="950" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Operator authors; AI drafts research</text>

<!-- Long-form Writing -->
<rect x="800" y="312" width="300" height="46" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5" rx="4"/>
<text x="950" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F2A4A" text-anchor="middle">Long-form Writing</text>
<text x="950" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Operator authors; AI is scaffold</text>

<!-- Talk Prep -->
<rect x="800" y="368" width="300" height="46" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5" rx="4"/>
<text x="950" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F2A4A" text-anchor="middle">Talk Prep</text>
<text x="950" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Operator authors; AI is thinking partner</text>

<!-- Content & Distribution -->
<rect x="800" y="424" width="300" height="46" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5" rx="4"/>
<text x="950" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F2A4A" text-anchor="middle">Content &amp; Distribution</text>
<text x="950" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Operator directs voice; AI drafts</text>

<!-- Learning & Reading -->
<rect x="800" y="480" width="300" height="46" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5" rx="4"/>
<text x="950" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F2A4A" text-anchor="middle">Learning &amp; Reading</text>
<text x="950" y="518" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Operator learns; AI is study partner</text>

</svg>
