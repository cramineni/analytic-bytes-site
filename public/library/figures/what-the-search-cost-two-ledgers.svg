<text x="60.0" y="486.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#475569">The left column is standard practice. Nothing on the right</text>
<text x="60.0" y="506.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#475569">is collected by anyone, by either party, anywhere.</text>
<text x="60.0" y="540.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#0F2A4A">Only the teal group is identifiable. Those quantities do not</text>
<text x="60.0" y="560.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#0F2A4A">move when the candidate’s effort or production cost moves,</text>
<text x="60.0" y="580.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#0F2A4A">which is what makes them countable at all.</text>
