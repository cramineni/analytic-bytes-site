<rect x="60" y="192" width="470" height="32" rx="3" fill="none" stroke="#0F2A4A" stroke-width="1.2"/>
<rect x="74" y="204" width="9" height="9" fill="#0F2A4A"/>
<text x="96.0" y="213.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#0F2A4A">Cost-per-hire</text>
