<rect x="634" y="296" width="9" height="9" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="656.0" y="305.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#475569">Reschedules and silences absorbed</text>
<rect x="620" y="326" width="520" height="32" rx="3" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="634" y="338" width="9" height="9" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="656.0" y="347.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#475569">The cost of the waiting itself</text>
<line x1="620" y1="398" x2="1140" y2="398" stroke="#E2E8F0" stroke-width="1"/>
<text x="620.0" y="422.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0EA5E9" font-weight="600" letter-spacing="1.2">Set by the employer — so a candidate can count them</text>
<rect x="620" y="438" width="520" height="32" rx="3" fill="none" stroke="#0EA5E9" stroke-width="1.2"/>
<rect x="634" y="450" width="9" height="9" fill="none" stroke="#0EA5E9" stroke-width="1.6"/>
