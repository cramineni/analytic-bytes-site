<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="tt td" xmlns:c2pa="http://c2pa.org/manifest">
  <title>The timing rule</title><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="tt">The timing rule</title>
  <desc id="td">A decision flow. First question: does the output inform a consequential decision about a person? If yes, validate before deployment and design the pilot as the study. If no, second question: will the first buyer ask for evidence before signing? If yes, the study comes before the pilot. If no, third question: does the outcome take months to observe? If yes, start the study before a buyer asks. If no, the study can wait until a buyer asks. A teal band underneath applies to every path: three decisions written down before the first user, and four records kept from the first day of the pilot.</desc>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="68" text-anchor="middle" font-size="33" font-weight="700" fill="#0F2A4A">The timing rule</text>

    <!-- Questions (left column) -->
    <g fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5">
      <rect x="60" y="110" width="520" height="96" rx="8"/>
      <rect x="60" y="256" width="520" height="96" rx="8"/>
      <rect x="60" y="402" width="520" height="96" rx="8"/>
    </g>
    <g font-size="22" fill="#0F2A4A" text-anchor="middle">
      <text x="320" y="151">Does the output inform a consequential</text>
      <text x="320" y="181">decision about a person?</text>
      <text x="320" y="297">Will the first buyer ask for evidence</text>
      <text x="320" y="327">before signing?</text>
      <text x="320" y="443">Does the outcome take months</text>
      <text x="320" y="473">to observe?</text>
    </g>

    <!-- Outcomes (right column) -->
    <g fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5">
      <rect x="700" y="110" width="440" height="96" rx="8"/>
      <rect x="700" y="256" width="440" height="96" rx="8"/>
      <rect x="700" y="402" width="440" height="96" rx="8"/>
      <rect x="60" y="548" width="520" height="70" rx="8"/>
    </g>
    <g font-size="22" fill="#0F2A4A" text-anchor="middle">
      <text x="920" y="151">Validate before deployment;</text>
      <text x="920" y="181">design the pilot as the study</text>
      <text x="920" y="312">The study comes before the pilot</text>
      <text x="920" y="443">Start the study before</text>
      <text x="920" y="473">a buyer asks</text>
      <text x="320" y="591">The study can wait until a buyer asks</text>
    </g>

    <!-- Arrows -->
    <g stroke="#0F2A4A" stroke-width="1.5" fill="#0F2A4A">
      <line x1="582" y1="158" x2="688" y2="158"/><path d="M688,152 L700,158 L688,164 Z" stroke="none"/>
      <line x1="582" y1="304" x2="688" y2="304"/><path d="M688,298 L700,304 L688,310 Z" stroke="none"/>
      <line x1="582" y1="450" x2="688" y2="450"/><path d="M688,444 L700,450 L688,456 Z" stroke="none"/>
      <line x1="320" y1="208" x2="320" y2="244"/><path d="M314,244 L320,256 L326,244 Z" stroke="none"/>
      <line x1="320" y1="354" x2="320" y2="390"/><path d="M314,390 L320,402 L326,390 Z" stroke="none"/>
      <line x1="320" y1="500" x2="320" y2="536"/><path d="M314,536 L320,548 L326,536 Z" stroke="none"/>
    </g>
    <g font-size="21" fill="#475569">
      <text x="635" y="146" text-anchor="middle">Yes</text>
      <text x="635" y="292" text-anchor="middle">Yes</text>
      <text x="635" y="438" text-anchor="middle">Yes</text>
      <text x="334" y="233">No</text>
      <text x="334" y="379">No</text>
      <text x="334" y="525">No</text>
    </g>

    <!-- Every path -->
    <rect x="60" y="652" width="1080" height="84" rx="8" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2.4"/>
    <text x="600" y="686" text-anchor="middle" font-size="22" fill="#0F2A4A">On every path, three decisions are written down before the first user</text>
    <text x="600" y="716" text-anchor="middle" font-size="22" fill="#0F2A4A">and four records are kept from the first day of the pilot</text>
  </g>
</svg>
