<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc">
<title id="ttl">Naming a decision, by AI remit</title>
<desc id="desc">Two rows of small squares, one square per posting. The upper row is the twenty-six postings that hand the role an artificial intelligence or machine learning system: thirteen squares are filled navy, marking the postings that also name a decision the hire may make, and thirteen are left empty. The lower row is the thirty-nine postings that hand the role no such system: ten are filled and twenty-nine are empty. The lower row is visibly longer and visibly emptier. Square position carries no meaning.</desc>
