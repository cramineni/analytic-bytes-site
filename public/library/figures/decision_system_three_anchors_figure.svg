<svg viewBox="0 -140 1200 800" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The Decision System: three anchors — meaning, authority, validity — that must all hold together</title>
<desc>Triangular arrangement of three navy-bordered anchor nodes labeled MEANING, AUTHORITY, and VALIDITY, connected pairwise by navy lines to form a triangle. Each node carries a two-line gloss: the definition holds, an owner acts on cadence, and the claim holds for this use. Inside the triangle a teal label reads DECISION-READY. Below, a small caveat notes that detaching any one anchor produces confident output that cannot close a decision.</desc>
<rect x="0" y="-140" width="1200" height="800" fill="#FFFFFF"/>
<text x="600" y="-90" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">The three anchors</text>
<g transform="translate(0, -40)">
<!-- HEADER -->

<!-- Triangle geometry: 3 anchor circles positioned at triangle corners -->
<!-- Top: Meaning at (600, 130) -->
<!-- Bottom-left: Authority at (280, 450) -->
<!-- Bottom-right: Validity at (920, 450) -->

<!-- Connecting lines (drawn first so nodes overlay) -->
<line x1="580" y1="200" x2="345" y2="405" stroke="#0F2A4A" stroke-width="1.5"/>
<line x1="620" y1="200" x2="855" y2="405" stroke="#0F2A4A" stroke-width="1.5"/>
<line x1="380" y1="450" x2="820" y2="450" stroke="#0F2A4A" stroke-width="1.5"/>

<!-- MEANING node -->
<circle cx="600" cy="130" r="110" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="2"/>
<text x="600" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A" text-anchor="middle">MEANING</text>
<text x="600" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">the definition</text>
<text x="600" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">holds</text>

<!-- AUTHORITY node -->
<circle cx="280" cy="450" r="115" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="2"/>
<text x="280" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A" text-anchor="middle">AUTHORITY</text>
<text x="280" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">an owner acts</text>
<text x="280" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">on cadence</text>

<!-- VALIDITY node -->
<circle cx="920" cy="450" r="115" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="2"/>
<text x="920" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A" text-anchor="middle">VALIDITY</text>
<text x="920" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">the claim holds</text>
<text x="920" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">for this use</text>

<!-- DECISION-READY label at triangle centroid -->
<text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#0EA5E9" text-anchor="middle">DECISION-READY</text>

</g>

<!-- Caveat below triangle -->
<text x="600" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#64748B" text-anchor="middle">Detach any one anchor and the system produces confident output that cannot close a decision.</text>
</svg>
