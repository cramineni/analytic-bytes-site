<svg viewBox="0 -150 1200 1100" xmlns="http://www.w3.org/2000/svg" role="img">
<title>LO 2.0 — the layers exist, the stitching does not</title>
<desc>Four vertically stacked layer boxes labeled National, District, School, Classroom, each with a short essence line and cadence. Between each pair of layers is a teal stitching contract labeled with what has to move between them. On the right, a vertical bracket labeled Integration architecture — the thing LO 2.0 proposes — encloses the four layers and their contracts.</desc>
<rect x="0" y="-150" width="1200" height="1100" fill="#FFFFFF"/>
<text x="600" y="-100" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">The stitched layers</text>

<!-- NATIONAL layer -->
<rect x="40" y="30" width="900" height="160" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="70" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="start">National</text>
<text x="70" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">Census-style coverage. Macro-policy signal.</text>
<text x="70" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">UDISE+ · NAS · SEQI · policy cadence</text>

<!-- Stitching contract 1: national ↔ district -->
<line x1="490" y1="195" x2="490" y2="245" stroke="#0EA5E9" stroke-width="1.75" stroke-dasharray="6 4"/>
<text x="510" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0EA5E9" text-anchor="start" font-style="italic">stitching contract</text>

<!-- DISTRICT layer -->
<rect x="40" y="250" width="900" height="160" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="70" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="start">District</text>
<text x="70" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">District operations layer. Officer-level signal.</text>
<text x="70" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">rollups · funding · aggregate reporting</text>

<!-- Stitching contract 2 -->
<line x1="490" y1="415" x2="490" y2="465" stroke="#0EA5E9" stroke-width="1.75" stroke-dasharray="6 4"/>
<text x="510" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0EA5E9" text-anchor="start" font-style="italic">stitching contract</text>

<!-- SCHOOL layer -->
<rect x="40" y="470" width="900" height="160" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="70" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="start">School</text>
<text x="70" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">Building operations. Headmaster signal.</text>
<text x="70" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">headmaster · attendance · school dashboards</text>

<!-- Stitching contract 3 -->
<line x1="490" y1="635" x2="490" y2="685" stroke="#0EA5E9" stroke-width="1.75" stroke-dasharray="6 4"/>
<text x="510" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0EA5E9" text-anchor="start" font-style="italic">stitching contract</text>

<!-- CLASSROOM layer -->
<rect x="40" y="690" width="900" height="160" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="70" y="740" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0F2A4A" text-anchor="start">Classroom</text>
<text x="70" y="785" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">Instruction layer. Teacher-actionable signal.</text>
<text x="70" y="825" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">teacher · student mastery · real-time instruction</text>

<!-- Right-side integration architecture bracket -->
<g>
  <line x1="960" y1="30" x2="960" y2="850" stroke="#0EA5E9" stroke-width="1.75"/>
  <line x1="960" y1="30" x2="945" y2="30" stroke="#0EA5E9" stroke-width="1.75"/>
  <line x1="960" y1="850" x2="945" y2="850" stroke="#0EA5E9" stroke-width="1.75"/>
  <text x="978" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.5" fill="#0EA5E9" text-anchor="start">INTEGRATION</text>
  <text x="978" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.5" fill="#0EA5E9" text-anchor="start">ARCHITECTURE</text>
</g>
</svg>
