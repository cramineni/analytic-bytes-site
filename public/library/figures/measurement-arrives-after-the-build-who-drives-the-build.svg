<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Who drives the build</title><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Who drives the build</title>
  <desc id="d">Two rows of three boxes. The top row, a standardized assessment, runs measurement first (construct, scoring, validity evidence), then engineering (delivery and data collection), then the decision (placement, pass or fail). The bottom row, a platform that combines many inputs, runs engineering first, then the decision (an at-risk flag), then measurement last, drawn dashed because it comes later, if at all. Measurement is teal in both rows.</desc>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="600" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F2A4A">Who drives the build</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <!-- Row 1 -->
    <text x="60" y="140" font-size="21" fill="#475569">Standardized assessment</text>
    <rect x="60" y="160" width="300" height="100" rx="6" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2.4"/>
    <text x="210" y="203" text-anchor="middle" font-size="22" font-weight="600" fill="#0F2A4A">Measurement</text>
    <text x="210" y="236" text-anchor="middle" font-size="21" fill="#475569">construct, scoring, evidence</text>
    <rect x="450" y="160" width="300" height="100" rx="6" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5"/>
    <text x="600" y="203" text-anchor="middle" font-size="22" font-weight="600" fill="#0F2A4A">Engineering</text>
    <text x="600" y="236" text-anchor="middle" font-size="21" fill="#475569">delivery, data collection</text>
    <rect x="840" y="160" width="300" height="100" rx="6" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5"/>
    <text x="990" y="203" text-anchor="middle" font-size="22" font-weight="600" fill="#0F2A4A">Decision</text>
    <text x="990" y="236" text-anchor="middle" font-size="21" fill="#475569">placement, pass or fail</text>
    <!-- Row 2 -->
    <text x="60" y="350" font-size="21" fill="#475569">Platform combining many inputs</text>
    <rect x="60" y="370" width="300" height="100" rx="6" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5"/>
    <text x="210" y="413" text-anchor="middle" font-size="22" font-weight="600" fill="#0F2A4A">Engineering</text>
    <text x="210" y="446" text-anchor="middle" font-size="21" fill="#475569">inputs, pipelines, app</text>
    <rect x="450" y="370" width="300" height="100" rx="6" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5"/>
    <text x="600" y="413" text-anchor="middle" font-size="22" font-weight="600" fill="#0F2A4A">Decision</text>
    <text x="600" y="446" text-anchor="middle" font-size="21" fill="#475569">at-risk flag, needs help</text>
    <rect x="840" y="370" width="300" height="100" rx="6" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2.4" stroke-dasharray="9 7"/>
    <text x="990" y="413" text-anchor="middle" font-size="22" font-weight="600" fill="#0F2A4A">Measurement</text>
    <text x="990" y="446" text-anchor="middle" font-size="21" fill="#475569">later, if at all</text>
  </g>
  <g stroke="#0F2A4A" stroke-width="1.5" fill="#0F2A4A">
    <line x1="362" y1="210" x2="440" y2="210"/><path d="M440,204 L450,210 L440,216 Z" stroke="none"/>
    <line x1="752" y1="210" x2="830" y2="210"/><path d="M830,204 L840,210 L830,216 Z" stroke="none"/>
    <line x1="362" y1="420" x2="440" y2="420"/><path d="M440,414 L450,420 L440,426 Z" stroke="none"/>
    <line x1="752" y1="420" x2="830" y2="420" stroke-dasharray="6 5"/><path d="M830,414 L840,420 L830,426 Z" stroke="none"/>
  </g>
</svg>
