<rect x="304" y="210" width="158" height="34" rx="3"/>
<rect x="470" y="210" width="138" height="34" rx="3"/>
<rect x="616" y="210" width="120" height="34" rx="3"/>
<rect x="744" y="210" width="104" height="34" rx="3"/>
<rect x="856" y="210" width="90" height="34" rx="3"/>
<rect x="954" y="210" width="79" height="34" rx="3"/>
<rect x="1041" y="210" width="69" height="34" rx="3"/>
</g>

<text x="193" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#0F2A4A" text-anchor="middle">one turn: build, ship, improve</text>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#0F2A4A" text-anchor="middle">
<text x="383" y="232">two</text>
<text x="539" y="232">three</text>
<text x="676" y="232">four</text>
<text x="796" y="232">five</text>
<text x="901" y="232">six</text>
<text x="994" y="232">seven</text>
<text x="1076" y="232">eight</text>
</g>

<!-- bracket under capability turns 2 through 7 -->
<path d="M 304 254 L 304 262 L 1033 262 L 1033 254" fill="none" stroke="#94A3B8" stroke-width="1"/>
<text x="668" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Six capability turns ship inside the span of a single evaluation turn.</text>

<!-- ============ EVALUATION TRACK ============ -->
<text x="90" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#0F2A4A">THE EVALUATION LOOP  ·  DID THE FLOOR RISE, AND FOR WHOM</text>

<g fill="#F8FAFC" stroke="#0F2A4A" stroke-width="1">
<rect x="90" y="328" width="260" height="74" rx="3"/>
<rect x="358" y="328" width="250" height="74" rx="3"/>
<rect x="616" y="328" width="220" height="74" rx="3"/>
<rect x="844" y="328" width="194" height="74" rx="3"/>
</g>
<rect x="1046" y="328" width="64" height="74" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>

<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#0F2A4A" text-anchor="middle">
<text x="220" y="352">Define the construct</text>
<text x="483" y="352">Reach the right people</text>
<text x="726" y="352">Observe the outcome</text>
<text x="941" y="352">Establish the warrant</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
<text x="220" y="372">what &#8220;the floor rose&#8221; means,</text>
<text x="220" y="388">and rose for whom</text>
<text x="483" y="372">the ones it was meant to reach,</text>
<text x="483" y="388">not the ones easiest to survey</text>
<text x="726" y="372">which takes as long as</text>
<text x="726" y="388">the outcome itself takes</text>
<text x="941" y="372">rule out what would have</text>
<text x="941" y="388">happened anyway</text>
</g>
<text x="1078" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-style="italic" fill="#94A3B8" text-anchor="middle">turn two</text>
<text x="1078" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-style="italic" fill="#94A3B8" text-anchor="middle">begins</text>

<line x1="90" y1="428" x2="1110" y2="428" stroke="#E2E8F0" stroke-width="0.8"/>
<text x="90" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">The capability blocks narrow because each turn shortens the next. The evaluation segments hold their width, because a valid measure of a</text>
<text x="90" y="467" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">real-world outcome does not speed up when the model does. The gap between the two tracks is the part of the deployment nobody has checked.</text>

<text x="90" y="497" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">Cadence only. The number of turns shown is illustrative; no cycle times are claimed and there is no time axis to scale against.</text>
</svg>
