<svg viewBox="0 -110 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Two loops, one clock: the capability loop compounds and the evaluation loop does not</title>
<desc>A cadence diagram comparing two loops running over the same elapsed time. The upper track is the capability loop — build, ship, measure the model, improve. It is drawn as eight blocks that get progressively narrower from left to right, because each turn shortens the next. The lower track is the evaluation loop — did the floor rise, and for whom. It is drawn as a single turn split into four wide segments: define the construct, meaning what "the floor rose" means and for whom; reach the people it was meant to reach rather than the ones easiest to survey; observe the outcome, which takes as long as the outcome takes; and establish the warrant, ruling out what would have happened anyway. A dashed vertical line marks the point where the first evaluation turn closes. By that point the capability loop has completed seven turns, six of them entirely inside the span of that single evaluation turn. A footer states that the cadence is illustrative and no cycle times are claimed.</desc>

<rect x="0" y="-110" width="1200" height="630" fill="#FFFFFF"/>
<text x="600" y="-82" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F2A4A" text-anchor="middle">Two loops, different cadences</text>
<!-- HEADER -->

<!-- marker: first evaluation turn closes -->
<text x="1030" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="1.8" fill="#0F2A4A" text-anchor="end">FIRST EVALUATION TURN CLOSES</text>
<line x1="1038" y1="186" x2="1038" y2="404" stroke="#0F2A4A" stroke-width="1" stroke-dasharray="4 4"/>

<!-- ============ CAPABILITY TRACK ============ -->
<text x="90" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#0EA5E9">THE CAPABILITY LOOP  ·  BUILD, SHIP, MEASURE THE MODEL, IMPROVE</text>

<g fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1">
