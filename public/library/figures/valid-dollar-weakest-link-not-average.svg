<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" role="img" aria-labelledby="title desc">
  <title id="title">The score is the weakest link, not the average</title>
  <desc id="desc">Four inference links behind an impact number shown as bars. Three are strong; the fourth, contribution, is weak. An averaged verdict sits high and reads healthy. The minimum verdict sits at the weak link. The band between the two is what a composite figure conceals.</desc>

  <!-- background -->
  <rect x="0" y="0" width="1400" height="780" fill="#FFFFFF"/>

  <!-- chart title -->
  <text x="700" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">The weakest link, not the average</text>

  <g transform="translate(0, 70)">
  <!-- column headers -->
  <text x="90" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#94A3B8" letter-spacing="2">THE FOUR INFERENCES BEHIND AN IMPACT NUMBER</text>
  <text x="940" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#94A3B8" letter-spacing="2">VERDICT</text>

  <!-- divider -->
  <line x1="72" y1="160" x2="1328" y2="160" stroke="#E2E8F0" stroke-width="1"/>

  <!-- bars: three strong (navy), one weak (grey). -->
  <rect x="120" y="248" width="160" height="300" fill="#0F2A4A"/>
  <rect x="320" y="263" width="160" height="285" fill="#0F2A4A"/>
  <rect x="520" y="248" width="160" height="300" fill="#0F2A4A"/>
  <rect x="720" y="443" width="160" height="105" fill="#94A3B8"/>

  <!-- link numbers, each above its own bar -->
  <text x="200" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#94A3B8">1</text>
  <text x="400" y="247" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#94A3B8">2</text>
  <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#94A3B8">3</text>
  <text x="800" y="427" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0EA5E9">4</text>

  <!-- average line (what a composite reports) -->
  <line x1="100" y1="300" x2="920" y2="300" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- minimum line (what validity reports). -->
  <line x1="100" y1="443" x2="920" y2="443" stroke="#0EA5E9" stroke-width="3"/>

  <!-- baseline -->
  <line x1="100" y1="548" x2="920" y2="548" stroke="#CBD5E1" stroke-width="1"/>

  <!-- bracket measuring the distance the composite hides -->
  <line x1="898" y1="300" x2="898" y2="443" stroke="#0EA5E9" stroke-width="1.5"/>
  <line x1="890" y1="300" x2="906" y2="300" stroke="#0EA5E9" stroke-width="1.5"/>
  <line x1="890" y1="443" x2="906" y2="443" stroke="#0EA5E9" stroke-width="1.5"/>

  <!-- verdict labels -->
  <text x="940" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#94A3B8">AVERAGE</text>
  <text x="940" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">the composite reads healthy</text>

  <text x="940" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0EA5E9">MINIMUM</text>
  <text x="940" y="467" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">what the claim can actually carry</text>

  <!-- bar labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle">
    <text x="200" y="586" font-weight="600" fill="#0F2A4A">Measure</text>
    <text x="200" y="614" font-weight="400" fill="#475569">it right</text>

    <text x="400" y="586" font-weight="600" fill="#0F2A4A">Real,</text>
    <text x="400" y="614" font-weight="400" fill="#475569">not noise</text>

    <text x="600" y="586" font-weight="600" fill="#0F2A4A">Reflects</text>
    <text x="600" y="614" font-weight="400" fill="#475569">what matters</text>

    <text x="800" y="586" font-weight="600" fill="#0F2A4A">Ours,</text>
    <text x="800" y="614" font-weight="600" fill="#0F2A4A">not adjacent</text>
  </g>
  </g>
</svg>
