<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">The score is the weakest link, not the average</title>
  <desc id="desc">Four inference links behind an impact number shown as bars. Three are strong; the fourth, contribution, is weak. An averaged verdict sits high and reads healthy. The minimum verdict sits at the weak link. The band between the two is what a composite figure conceals.</desc>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="560" fill="#FFFFFF"/>

  <!-- chart title -->
  <text x="600" y="28" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F2A4A" text-anchor="middle">The weakest link, not the average</text>

  <!-- column headers -->
  <text x="120" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="2">THE FOUR INFERENCES BEHIND AN IMPACT NUMBER</text>
  <text x="820" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="2">VERDICT</text>

  <!-- divider -->
  <line x1="72" y1="124" x2="1128" y2="124" stroke="#E2E8F0" stroke-width="1"/>

  <!-- bars: three strong (navy), one weak (grey). Darkness carries strength, as in the other two figures. -->
  <rect x="140" y="196" width="120" height="240" fill="#0F2A4A"/>
  <rect x="300" y="208" width="120" height="228" fill="#0F2A4A"/>
  <rect x="460" y="196" width="120" height="240" fill="#0F2A4A"/>
  <rect x="620" y="352" width="120" height="84" fill="#94A3B8"/>

  <!-- link numbers, each above its own bar -->
  <text x="200" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">1</text>
  <text x="360" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">2</text>
  <text x="520" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">3</text>
  <text x="680" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0EA5E9">4</text>

  <!-- average line (what a composite reports) -->
  <line x1="120" y1="238" x2="800" y2="238" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- minimum line (what validity reports). Teal is the AB rule line, not a strength value. -->
  <line x1="120" y1="352" x2="800" y2="352" stroke="#0EA5E9" stroke-width="3"/>

  <!-- baseline -->
  <line x1="120" y1="436" x2="800" y2="436" stroke="#CBD5E1" stroke-width="1"/>

  <!-- bracket measuring the distance the composite hides -->
  <line x1="778" y1="238" x2="778" y2="352" stroke="#0EA5E9" stroke-width="1.5"/>
  <line x1="770" y1="238" x2="786" y2="238" stroke="#0EA5E9" stroke-width="1.5"/>
  <line x1="770" y1="352" x2="786" y2="352" stroke="#0EA5E9" stroke-width="1.5"/>

  <!-- verdict labels -->
  <text x="820" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#94A3B8">AVERAGE</text>
  <text x="820" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">the composite reads healthy</text>

  <text x="820" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#0EA5E9">MINIMUM</text>
  <text x="820" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">what the claim can actually carry</text>

  <!-- bar labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="200" y="462" font-weight="600" fill="#0F2A4A">Measure</text>
    <text x="200" y="480" font-weight="400" fill="#475569">it right</text>

    <text x="360" y="462" font-weight="600" fill="#0F2A4A">Real,</text>
    <text x="360" y="480" font-weight="400" fill="#475569">not noise</text>

    <text x="520" y="462" font-weight="600" fill="#0F2A4A">Reflects</text>
    <text x="520" y="480" font-weight="400" fill="#475569">what matters</text>

    <text x="680" y="462" font-weight="600" fill="#0F2A4A">Ours,</text>
    <text x="680" y="480" font-weight="600" fill="#0F2A4A">not adjacent</text>
  </g>
</svg>
