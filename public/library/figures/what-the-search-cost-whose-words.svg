<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Whose words open the document, 2013 to 2026</title>
<desc>Four horizontal bands, labelled from the bottom: the discipline’s words, the market’s words, mixed, and hers. A single navy line traces twenty-nine base documents in date order across the bands. It begins in the discipline’s band, jumps once to hers in December 2016 and immediately falls back, runs flat along the market’s band for most of a decade — including two documents written by a résumé service, drawn as hollow points — lifts into mixed through 2026, and ends in hers at July 2026. The two moments in her own words are marked in teal.</desc>
