<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc">
<title id="ttl">The same decision, restated as a credential</title>
<desc id="desc">Two panels side by side, taken from one insurer&#8217;s job posting. The left panel, headed responsibilities and marked in navy, quotes the employer granting the role a decision: resolve cross-stream data dependencies and tradeoffs. An arrow leads to the right panel, headed requirements and marked in teal, which quotes the same employer asking for experience resolving cross-team data dependencies and tradeoffs. The decision the role will make has become something the candidate is expected to have done already, somewhere else. Four postings in the corpus do this.</desc>
<rect width="1200" height="380" fill="#FFFFFF"/>
<text x="600" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F2A4A" text-anchor="middle">The same decision, restated as a credential</text>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<rect x="60" y="110" width="460" height="230" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="60" y="110" width="6" height="230" fill="#0F2A4A"/>
<text x="88" y="150" font-size="21" font-weight="700" letter-spacing="1.6" fill="#0F2A4A">RESPONSIBILITIES</text>
<text x="88" y="194" font-size="22" font-style="italic" fill="#0F2A4A">&#8220;Resolve cross-stream data</text>
<text x="88" y="224" font-size="22" font-style="italic" fill="#0F2A4A">dependencies and tradeoffs&#8230;&#8221;</text>
<line x1="88" y1="256" x2="496" y2="256" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="88" y="292" font-size="21" fill="#475569">a decision the role makes</text>
<text x="600" y="206" font-size="34" fill="#0EA5E9" text-anchor="middle">&#8594;</text>
<text x="600" y="244" font-size="21" letter-spacing="1.4" fill="#0EA5E9" text-anchor="middle">SAME</text>
<text x="600" y="266" font-size="21" letter-spacing="1.4" fill="#0EA5E9" text-anchor="middle">POSTING</text>
<rect x="680" y="110" width="460" height="230" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="680" y="110" width="6" height="230" fill="#0EA5E9"/>
<text x="708" y="150" font-size="21" font-weight="700" letter-spacing="1.6" fill="#0EA5E9">REQUIREMENTS</text>
<text x="708" y="194" font-size="22" font-style="italic" fill="#0F2A4A">&#8220;Experience resolving cross-team</text>
<text x="708" y="224" font-size="22" font-style="italic" fill="#0F2A4A">data dependencies and tradeoffs&#8230;&#8221;</text>
<line x1="708" y1="256" x2="1116" y2="256" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="708" y="292" font-size="21" fill="#475569">something the candidate</text>
<text x="708" y="318" font-size="21" fill="#475569">should already have done</text>
</g></svg>
