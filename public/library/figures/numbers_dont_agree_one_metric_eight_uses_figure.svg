<svg viewBox="0 -110 1200 960" xmlns="http://www.w3.org/2000/svg" role="img">
<title>One metric, eight recalculations: how a single word fragments across obligations</title>
<desc>Central navy circle labeled Student persistence with eight lines fanning outward to eight small endpoint nodes, each labeled by an obligation that required its own recalculation. Endpoint labels include program completion, state accountability, early-year persistence, S&amp;P bond rating, principal incentive, enrollment forecasting, federal accountability, and internal instructional cadence. A teal caption below names the pattern.</desc>
<rect x="0" y="-110" width="1200" height="960" fill="#FFFFFF"/>
<text x="600" y="-60" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">One metric, eight uses</text>
<g transform="translate(0, 0)">
<!-- Central node at (600, 400), radius 260 for endpoints -->
<g>
  <!-- 8 fan-out lines to endpoints -->
  <line x1="600" y1="400" x2="600" y2="140" stroke="#94A3B8" stroke-width="1"/>
  <line x1="600" y1="400" x2="784" y2="216" stroke="#94A3B8" stroke-width="1"/>
  <line x1="600" y1="400" x2="860" y2="400" stroke="#94A3B8" stroke-width="1"/>
  <line x1="600" y1="400" x2="784" y2="584" stroke="#94A3B8" stroke-width="1"/>
  <line x1="600" y1="400" x2="600" y2="660" stroke="#94A3B8" stroke-width="1"/>
  <line x1="600" y1="400" x2="416" y2="584" stroke="#94A3B8" stroke-width="1"/>
  <line x1="600" y1="400" x2="340" y2="400" stroke="#94A3B8" stroke-width="1"/>
  <line x1="600" y1="400" x2="416" y2="216" stroke="#94A3B8" stroke-width="1"/>

  <!-- Endpoint dots -->
  <circle cx="600" cy="140" r="8" fill="#475569"/>
  <circle cx="784" cy="216" r="8" fill="#475569"/>
  <circle cx="860" cy="400" r="8" fill="#475569"/>
  <circle cx="784" cy="584" r="8" fill="#475569"/>
  <circle cx="600" cy="660" r="8" fill="#475569"/>
  <circle cx="416" cy="584" r="8" fill="#475569"/>
  <circle cx="340" cy="400" r="8" fill="#475569"/>
  <circle cx="416" cy="216" r="8" fill="#475569"/>

  <!-- Endpoint labels (all bumped to 22) -->
  <text x="600" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">Program completion</text>
  <text x="800" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="start">State accountability</text>
  <text x="876" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="start">S&amp;P bond rating</text>
  <text x="800" y="596" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="start">Enrollment forecasting</text>
  <text x="600" y="694" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">Federal accountability</text>
  <text x="400" y="596" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="end">Principal incentive</text>
  <text x="324" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="end">Instructional cadence</text>
  <text x="400" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="end">Early-year persistence</text>

  <!-- Central navy circle — the shared word -->
  <circle cx="600" cy="400" r="105" fill="#0F2A4A"/>
  <text x="600" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Student</text>
  <text x="600" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">persistence</text>

  <!-- Teal accent ring around center -->
  <circle cx="600" cy="400" r="115" fill="none" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="3 3"/>
</g>
<!-- Caption below the ring -->
<text x="600" y="775" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0EA5E9" text-anchor="middle" font-style="italic">Each endpoint required its own recalculation.</text>
</g>
</svg>
