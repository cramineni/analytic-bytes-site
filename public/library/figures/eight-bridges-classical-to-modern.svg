<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -110 1400 804" role="img" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Eight bridges — classical automated scoring to modern AI evaluation</title>
  <desc>Two-column correspondence map. Left column (navy) lists eight classical automated-scoring disciplines developed in measurement science and psychometrics between the 1990s and 2010s. Right column (teal) lists their modern AI evaluation equivalents. Each row pairs one classical discipline with its modern counterpart, connected by a thin teal line, showing that the current wave of AI eval is rebuilding what already existed under different vocabulary.</desc>
  <defs>
    <style>
      .ink { fill: #0F2A4A; }
      .ink-2 { fill: #475569; }
      .ink-3 { fill: #94A3B8; }
    </style>
  </defs>

  <!-- White background -->
  <rect x="0" y="-110" width="1400" height="804" fill="#FFFFFF"/>
<text x="700" y="-82" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F2A4A" text-anchor="middle">Eight bridges, classical to modern</text>
<g transform="translate(0, -152)">
<!-- HEADER -->

  <!-- Header -->

  <!-- Column headers -->
  <text x="330" y="150" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="3" fill="#0F2A4A">CLASSICAL &#160;&#160;·&#160;&#160; 1990s&#8211;2010s</text>
  <text x="1070" y="150" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="3" fill="#0EA5E9">MODERN AI EVALUATION &#160;&#160;·&#160;&#160; 2020s</text>

  <!-- Divider hairlines under headers -->
  <line x1="130" y1="162" x2="530" y2="162" stroke="#0F2A4A" stroke-width="1" opacity="0.35"/>
  <line x1="870" y1="162" x2="1270" y2="162" stroke="#0EA5E9" stroke-width="1" opacity="0.5"/>

  <!-- Row engine: 8 rows, y = 210 + i*75 -->

  <!-- Row 1: Fairness across subgroups -->
  <text x="60" y="215" font-size="11" font-weight="600" letter-spacing="1.5" class="ink-3">1</text>
  <rect x="130" y="195" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="215" font-size="13" font-weight="600" class="ink">Standardized mean differences per subgroup</text>
  <text x="150" y="232" font-size="11.5" class="ink-2">ETS-published flagging thresholds (0.10 / 0.15)</text>
  <line x1="530" y1="218" x2="870" y2="218" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="218" r="3" fill="#0F2A4A"/>
  <circle cx="870" cy="218" r="3" fill="#0EA5E9"/>
  <rect x="870" y="195" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="215" font-size="13" font-weight="600" class="ink">HELM subgroup slices, BBQ identity gaps</text>
  <text x="890" y="232" font-size="11.5" class="ink-2">Per-group accuracy under distribution shift</text>

  <!-- Row 2: Adversarial evaluation -->
  <text x="60" y="290" font-size="11" font-weight="600" letter-spacing="1.5" class="ink-3">2</text>
  <rect x="130" y="270" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="290" font-size="13" font-weight="600" class="ink">CIRS &#8212; construct-irrelevant response strategies</text>
  <text x="150" y="307" font-size="11.5" class="ink-2">Synonym substitution vs. real GRE essays (2014)</text>
  <line x1="530" y1="293" x2="870" y2="293" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="293" r="3" fill="#0F2A4A"/>
  <circle cx="870" cy="293" r="3" fill="#0EA5E9"/>
  <rect x="870" y="270" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="290" font-size="13" font-weight="600" class="ink">GCG, PAIR, AutoDAN adversarial suffixes</text>
  <text x="890" y="307" font-size="11.5" class="ink-2">Red-team methods, reward-hacking probes</text>

  <!-- Row 3: A priori thresholds + guardrails -->
  <text x="60" y="365" font-size="11" font-weight="600" letter-spacing="1.5" class="ink-3">3</text>
  <rect x="130" y="345" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="365" font-size="13" font-weight="600" class="ink">Published kappa / r &#8805; 0.70 thresholds + CART caps</text>
  <text x="150" y="382" font-size="11.5" class="ink-2">Rule-on-top-of-model guardrails (2012)</text>
  <line x1="530" y1="368" x2="870" y2="368" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="368" r="3" fill="#0F2A4A"/>
  <circle cx="870" cy="368" r="3" fill="#0EA5E9"/>
  <rect x="870" y="345" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="365" font-size="13" font-weight="600" class="ink">NIST AI RMF, HELM acceptance criteria</text>
  <text x="890" y="382" font-size="11.5" class="ink-2">Constitutional AI classifiers, output filters</text>

  <!-- Row 4: Risk-tiered deployment -->
  <text x="60" y="440" font-size="11" font-weight="600" letter-spacing="1.5" class="ink-3">4</text>
  <rect x="130" y="420" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="440" font-size="13" font-weight="600" class="ink">Check-score vs. contributory scoring modes</text>
  <text x="150" y="457" font-size="11.5" class="ink-2">GRE vs. TOEFL implementation (2012)</text>
  <line x1="530" y1="443" x2="870" y2="443" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="443" r="3" fill="#0F2A4A"/>
  <circle cx="870" cy="443" r="3" fill="#0EA5E9"/>
  <rect x="870" y="420" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="440" font-size="13" font-weight="600" class="ink">HITL, HOTL, autonomous deployment tiers</text>
  <text x="890" y="457" font-size="11.5" class="ink-2">Mode-calibrated acceptance criteria</text>

  <!-- Row 5: Population-matched corpora -->
  <text x="60" y="515" font-size="11" font-weight="600" letter-spacing="1.5" class="ink-3">5</text>
  <rect x="130" y="495" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="515" font-size="13" font-weight="600" class="ink">Population-matched calibration corpora</text>
  <text x="150" y="532" font-size="11.5" class="ink-2">Cambridge Handbook on learner corpora (2015)</text>
  <line x1="530" y1="518" x2="870" y2="518" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="518" r="3" fill="#0F2A4A"/>
  <circle cx="870" cy="518" r="3" fill="#0EA5E9"/>
  <rect x="870" y="495" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="515" font-size="13" font-weight="600" class="ink">Preference-training + benchmark contamination</text>
  <text x="890" y="532" font-size="11.5" class="ink-2">Chatbot Arena, HumanEval, MMLU scarcity</text>

  <!-- Row 6: Prompt curation -->
  <text x="60" y="590" font-size="11" font-weight="600" letter-spacing="1.5" class="ink-3">6</text>
  <rect x="130" y="570" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="590" font-size="13" font-weight="600" class="ink">Aberrant &amp; deviant prompt detection</text>
  <text x="150" y="607" font-size="11.5" class="ink-2">Feature-distribution CI screening (NCME 2015)</text>
  <line x1="530" y1="593" x2="870" y2="593" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="593" r="3" fill="#0F2A4A"/>
  <circle cx="870" cy="593" r="3" fill="#0EA5E9"/>
  <rect x="870" y="570" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="590" font-size="13" font-weight="600" class="ink">Canary items, OOD prompt detection</text>
  <text x="890" y="607" font-size="11.5" class="ink-2">Prompt curation as first-class eval step</text>

  <!-- Row 7: Cross-domain generalization -->
  <text x="60" y="665" font-size="11" font-weight="600" letter-spacing="1.5" class="ink-3">7</text>
  <rect x="130" y="645" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="665" font-size="13" font-weight="600" class="ink">Timed-essay to naturalistic-writing transfer</text>
  <text x="150" y="682" font-size="11.5" class="ink-2">Coursework validity study (2017&#8211;18)</text>
  <line x1="530" y1="668" x2="870" y2="668" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="668" r="3" fill="#0F2A4A"/>
  <circle cx="870" cy="668" r="3" fill="#0EA5E9"/>
  <rect x="870" y="645" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="665" font-size="13" font-weight="600" class="ink">Benchmark-to-production drift</text>
  <text x="890" y="682" font-size="11.5" class="ink-2">HELM tops leaderboard, fails customer workflow</text>

  <!-- Row 8: Responsible-AI framing -->
  <text x="60" y="740" font-size="11" font-weight="600" letter-spacing="1.5" class="ink-3">8</text>
  <rect x="130" y="720" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="740" font-size="13" font-weight="600" class="ink">Statistical + ethical framing at deployment</text>
  <text x="150" y="757" font-size="11.5" class="ink-2">CCCC 2015: observed &#8800; causal; IRB frame</text>
  <line x1="530" y1="743" x2="870" y2="743" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="743" r="3" fill="#0F2A4A"/>
  <circle cx="870" cy="743" r="3" fill="#0EA5E9"/>
  <rect x="870" y="720" width="400" height="46" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="740" font-size="13" font-weight="600" class="ink">Model cards, system cards, RSPs, NIST RMF</text>
  <text x="890" y="757" font-size="11.5" class="ink-2">Observed-correlation vs. causal-impact framing</text>

  <!-- Footer note -->
</g>
</svg>
