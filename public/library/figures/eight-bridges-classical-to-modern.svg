<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -140 1400 1780" role="img" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Eight bridges — classical automated scoring to modern AI evaluation</title>
  <desc>Two-column correspondence map. Left column (navy) lists eight classical automated-scoring disciplines developed in measurement science and psychometrics between the 1990s and 2010s. Right column (teal) lists their modern AI evaluation equivalents. Each row pairs one classical discipline with its modern counterpart, connected by a thin teal line, showing that the current wave of AI eval is rebuilding what already existed under different vocabulary.</desc>
  <defs>
    <style>
      .ink { fill: #0F2A4A; }
      .ink-2 { fill: #475569; }
      .ink-3 { fill: #94A3B8; }
    </style>
  </defs>

  <!-- White background -->
  <rect x="0" y="-140" width="1400" height="1780" fill="#FFFFFF"/>
<text x="700" y="-90" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="39" font-weight="700" fill="#0F2A4A" text-anchor="middle">Eight bridges, classical to modern</text>
<g transform="translate(0, -40)">
<!-- HEADER -->

  <!-- Column headers -->
  <text x="330" y="70" text-anchor="middle" font-size="25" font-weight="700" letter-spacing="3" fill="#0F2A4A">CLASSICAL &#160;&#160;·&#160;&#160; 1990s&#8211;2010s</text>
  <text x="1070" y="70" text-anchor="middle" font-size="25" font-weight="700" letter-spacing="3" fill="#0EA5E9">MODERN AI EVAL &#160;&#160;·&#160;&#160; 2020s</text>

  <!-- Divider hairlines under headers -->
  <line x1="130" y1="90" x2="530" y2="90" stroke="#0F2A4A" stroke-width="1" opacity="0.35"/>
  <line x1="870" y1="90" x2="1270" y2="90" stroke="#0EA5E9" stroke-width="1" opacity="0.5"/>

  <!-- Row engine: 8 rows, y = 140 + i*180 -->

  <!-- Row 1 -->
  <text x="60" y="180" font-size="25" font-weight="700" letter-spacing="1.5" class="ink-3">1</text>
  <rect x="130" y="140" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="175" font-size="25" font-weight="700" class="ink">Standardized mean</text>
  <text x="150" y="205" font-size="25" font-weight="700" class="ink">differences per subgroup</text>
  <text x="150" y="242" font-size="25" class="ink-2">ETS flagging thresholds</text>
  <text x="150" y="270" font-size="25" class="ink-2">(0.10 / 0.15)</text>
  <line x1="530" y1="210" x2="870" y2="210" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="210" r="4" fill="#0F2A4A"/>
  <circle cx="870" cy="210" r="4" fill="#0EA5E9"/>
  <rect x="870" y="140" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="175" font-size="25" font-weight="700" class="ink">HELM subgroup slices,</text>
  <text x="890" y="205" font-size="25" font-weight="700" class="ink">BBQ identity gaps</text>
  <text x="890" y="242" font-size="25" class="ink-2">Per-group accuracy under</text>
  <text x="890" y="270" font-size="25" class="ink-2">distribution shift</text>

  <!-- Row 2 -->
  <text x="60" y="360" font-size="25" font-weight="700" letter-spacing="1.5" class="ink-3">2</text>
  <rect x="130" y="320" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="355" font-size="25" font-weight="700" class="ink">CIRS &#8212; construct-irrelevant</text>
  <text x="150" y="385" font-size="25" font-weight="700" class="ink">response strategies</text>
  <text x="150" y="422" font-size="25" class="ink-2">Synonym substitution vs.</text>
  <text x="150" y="450" font-size="25" class="ink-2">real GRE essays (2014)</text>
  <line x1="530" y1="390" x2="870" y2="390" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="390" r="4" fill="#0F2A4A"/>
  <circle cx="870" cy="390" r="4" fill="#0EA5E9"/>
  <rect x="870" y="320" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="355" font-size="25" font-weight="700" class="ink">GCG, PAIR, AutoDAN</text>
  <text x="890" y="385" font-size="25" font-weight="700" class="ink">adversarial suffixes</text>
  <text x="890" y="422" font-size="25" class="ink-2">Red-team methods,</text>
  <text x="890" y="450" font-size="25" class="ink-2">reward-hacking probes</text>

  <!-- Row 3 -->
  <text x="60" y="540" font-size="25" font-weight="700" letter-spacing="1.5" class="ink-3">3</text>
  <rect x="130" y="500" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="535" font-size="25" font-weight="700" class="ink">Published kappa / r &#8805; 0.70</text>
  <text x="150" y="565" font-size="25" font-weight="700" class="ink">thresholds + CART caps</text>
  <text x="150" y="602" font-size="25" class="ink-2">Rule-on-top-of-model</text>
  <text x="150" y="630" font-size="25" class="ink-2">guardrails (2012)</text>
  <line x1="530" y1="570" x2="870" y2="570" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="570" r="4" fill="#0F2A4A"/>
  <circle cx="870" cy="570" r="4" fill="#0EA5E9"/>
  <rect x="870" y="500" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="535" font-size="25" font-weight="700" class="ink">NIST AI RMF, HELM</text>
  <text x="890" y="565" font-size="25" font-weight="700" class="ink">acceptance criteria</text>
  <text x="890" y="602" font-size="25" class="ink-2">Constitutional AI classifiers,</text>
  <text x="890" y="630" font-size="25" class="ink-2">output filters</text>

  <!-- Row 4 -->
  <text x="60" y="720" font-size="25" font-weight="700" letter-spacing="1.5" class="ink-3">4</text>
  <rect x="130" y="680" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="715" font-size="25" font-weight="700" class="ink">Check-score vs. contributory</text>
  <text x="150" y="745" font-size="25" font-weight="700" class="ink">scoring modes</text>
  <text x="150" y="782" font-size="25" class="ink-2">GRE vs. TOEFL</text>
  <text x="150" y="810" font-size="25" class="ink-2">implementation (2012)</text>
  <line x1="530" y1="750" x2="870" y2="750" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="750" r="4" fill="#0F2A4A"/>
  <circle cx="870" cy="750" r="4" fill="#0EA5E9"/>
  <rect x="870" y="680" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="715" font-size="25" font-weight="700" class="ink">HITL, HOTL, autonomous</text>
  <text x="890" y="745" font-size="25" font-weight="700" class="ink">deployment tiers</text>
  <text x="890" y="782" font-size="25" class="ink-2">Mode-calibrated</text>
  <text x="890" y="810" font-size="25" class="ink-2">acceptance criteria</text>

  <!-- Row 5 -->
  <text x="60" y="900" font-size="25" font-weight="700" letter-spacing="1.5" class="ink-3">5</text>
  <rect x="130" y="860" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="895" font-size="25" font-weight="700" class="ink">Population-matched</text>
  <text x="150" y="925" font-size="25" font-weight="700" class="ink">calibration corpora</text>
  <text x="150" y="962" font-size="25" class="ink-2">Cambridge Handbook on</text>
  <text x="150" y="990" font-size="25" class="ink-2">learner corpora (2015)</text>
  <line x1="530" y1="930" x2="870" y2="930" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="930" r="4" fill="#0F2A4A"/>
  <circle cx="870" cy="930" r="4" fill="#0EA5E9"/>
  <rect x="870" y="860" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="895" font-size="25" font-weight="700" class="ink">Preference-training +</text>
  <text x="890" y="925" font-size="25" font-weight="700" class="ink">benchmark contamination</text>
  <text x="890" y="962" font-size="25" class="ink-2">Chatbot Arena, HumanEval,</text>
  <text x="890" y="990" font-size="25" class="ink-2">MMLU scarcity</text>

  <!-- Row 6 -->
  <text x="60" y="1080" font-size="25" font-weight="700" letter-spacing="1.5" class="ink-3">6</text>
  <rect x="130" y="1040" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="1075" font-size="25" font-weight="700" class="ink">Aberrant &amp; deviant</text>
  <text x="150" y="1105" font-size="25" font-weight="700" class="ink">prompt detection</text>
  <text x="150" y="1142" font-size="25" class="ink-2">Feature-distribution CI</text>
  <text x="150" y="1170" font-size="25" class="ink-2">screening (NCME 2015)</text>
  <line x1="530" y1="1110" x2="870" y2="1110" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="1110" r="4" fill="#0F2A4A"/>
  <circle cx="870" cy="1110" r="4" fill="#0EA5E9"/>
  <rect x="870" y="1040" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="1075" font-size="25" font-weight="700" class="ink">Canary items, OOD</text>
  <text x="890" y="1105" font-size="25" font-weight="700" class="ink">prompt detection</text>
  <text x="890" y="1142" font-size="25" class="ink-2">Prompt curation as</text>
  <text x="890" y="1170" font-size="25" class="ink-2">first-class eval step</text>

  <!-- Row 7 -->
  <text x="60" y="1260" font-size="25" font-weight="700" letter-spacing="1.5" class="ink-3">7</text>
  <rect x="130" y="1220" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="1255" font-size="25" font-weight="700" class="ink">Timed-essay to naturalistic-</text>
  <text x="150" y="1285" font-size="25" font-weight="700" class="ink">writing transfer</text>
  <text x="150" y="1322" font-size="25" class="ink-2">Coursework validity</text>
  <text x="150" y="1350" font-size="25" class="ink-2">study (2017&#8211;18)</text>
  <line x1="530" y1="1290" x2="870" y2="1290" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="1290" r="4" fill="#0F2A4A"/>
  <circle cx="870" cy="1290" r="4" fill="#0EA5E9"/>
  <rect x="870" y="1220" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="1255" font-size="25" font-weight="700" class="ink">Benchmark-to-</text>
  <text x="890" y="1285" font-size="25" font-weight="700" class="ink">production drift</text>
  <text x="890" y="1322" font-size="25" class="ink-2">HELM tops leaderboard,</text>
  <text x="890" y="1350" font-size="25" class="ink-2">fails customer workflow</text>

  <!-- Row 8 -->
  <text x="60" y="1440" font-size="25" font-weight="700" letter-spacing="1.5" class="ink-3">8</text>
  <rect x="130" y="1400" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.2"/>
  <text x="150" y="1435" font-size="25" font-weight="700" class="ink">Statistical + ethical framing</text>
  <text x="150" y="1465" font-size="25" font-weight="700" class="ink">at deployment</text>
  <text x="150" y="1502" font-size="25" class="ink-2">CCCC 2015: observed &#8800;</text>
  <text x="150" y="1530" font-size="25" class="ink-2">causal; IRB frame</text>
  <line x1="530" y1="1470" x2="870" y2="1470" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="530" cy="1470" r="4" fill="#0F2A4A"/>
  <circle cx="870" cy="1470" r="4" fill="#0EA5E9"/>
  <rect x="870" y="1400" width="400" height="140" rx="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="890" y="1435" font-size="25" font-weight="700" class="ink">Model cards, system cards,</text>
  <text x="890" y="1465" font-size="25" font-weight="700" class="ink">RSPs, NIST RMF</text>
  <text x="890" y="1502" font-size="25" class="ink-2">Observed-correlation vs.</text>
  <text x="890" y="1530" font-size="25" class="ink-2">causal-impact framing</text>

</g>
</svg>
