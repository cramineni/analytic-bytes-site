<svg viewBox="0 -110 1200 950" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Contracts between systems: the gap between bytes-move and can-act across three eras</title>
<desc>Three era columns — Legacy, Modern, Agentic — each showing a top row (bytes move) and a bottom row (someone can act) with a visible gap between them. In Legacy the gap is narrow. In Modern the gap widens. In Agentic the gap is highlighted in teal as consequential. Below, a one-line caption names the arc.</desc>
<rect x="0" y="-110" width="1200" height="950" fill="#FFFFFF"/>
<text x="600" y="-60" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">Three eras of system contracts</text>
<g transform="translate(0, 0)">
<!-- Era labels at top -->
<text x="200" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#94A3B8" text-anchor="middle">LEGACY</text>
<text x="600" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#94A3B8" text-anchor="middle">MODERN</text>
<text x="1000" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#0EA5E9" text-anchor="middle">AGENTIC</text>

<!-- LEGACY era -->
<g>
  <!-- Bytes-move box -->
  <rect x="60" y="70" width="280" height="130" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
  <text x="200" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A" text-anchor="middle">The bytes move</text>
  <text x="200" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">batch ETL, nightly,</text>
  <text x="200" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">report-out</text>
  <!-- Gap label -->
  <text x="200" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94A3B8" text-anchor="middle" font-style="italic">the gap</text>
  <!-- Can-act box -->
  <rect x="60" y="280" width="280" height="130" fill="none" stroke="#0F2A4A" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>
  <text x="200" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A" text-anchor="middle">Someone can act</text>
  <text x="200" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">humans read</text>
  <text x="200" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">reports</text>
  <!-- caption -->
  <text x="200" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle" font-style="italic">gap is narrow —</text>
  <text x="200" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle" font-style="italic">humans absorb it</text>
</g>

<!-- MODERN era -->
<g>
  <!-- Bytes-move box -->
  <rect x="460" y="70" width="280" height="130" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
  <text x="600" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A" text-anchor="middle">The bytes move</text>
  <text x="600" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">real-time, streaming,</text>
  <text x="600" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">APIs</text>
  <!-- Gap label -->
  <text x="600" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94A3B8" text-anchor="middle" font-style="italic">the gap widens</text>
  <!-- Can-act box -->
  <rect x="460" y="280" width="280" height="130" fill="none" stroke="#0F2A4A" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>
  <text x="600" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A" text-anchor="middle">Someone can act</text>
  <text x="600" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">definitions drift</text>
  <text x="600" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">silently</text>
  <!-- caption -->
  <text x="600" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle" font-style="italic">gap widens —</text>
  <text x="600" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle" font-style="italic">stewardship strained</text>
</g>

<!-- AGENTIC era — teal highlight -->
<g>
  <!-- Bytes-move box -->
  <rect x="860" y="70" width="280" height="130" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
  <text x="1000" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A" text-anchor="middle">The bytes move</text>
  <text x="1000" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">agents act at</text>
  <text x="1000" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">machine cadence</text>
  <!-- Gap label (teal, consequential) -->
  <text x="1000" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0EA5E9" text-anchor="middle" font-weight="700">the gap becomes</text>
  <text x="1000" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0EA5E9" text-anchor="middle" font-weight="700">consequential</text>
  <!-- Can-act box — teal border -->
  <rect x="860" y="280" width="280" height="130" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="4 3" rx="3"/>
  <text x="1000" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A" text-anchor="middle">Someone can act</text>
  <text x="1000" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">agents act without</text>
  <text x="1000" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">review</text>
</g>

<!-- Arrow spanning eras at the bottom -->
<line x1="60" y1="560" x2="1130" y2="560" stroke="#94A3B8" stroke-width="1"/>
<polygon points="1130,555 1145,560 1130,565" fill="#94A3B8"/>
<!-- Arrow caption -->
<text x="600" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#64748B" text-anchor="middle" font-style="italic">narrowing → widening → consequential</text>
</g>
</svg>
