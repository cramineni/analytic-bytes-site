<svg viewBox="0 0 820 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" font-family="Inter,Helvetica,Arial,sans-serif">
<title id="ttl">Same engagement, different calibrations</title>
<desc id="desc">A horizontal autonomy spectrum with four decisions from AB's Deliver Signal workflow plotted at different points. Diagnostic prioritization sits at the human-only end. Frontline-versus-boardroom framing is left of center, slightly higher autonomy. Gap ranking is mid-spectrum, escalation-heavy. Source-inventory tagging is well along the spectrum toward agent autonomy.</desc>
<rect width="820" height="620" fill="#FFFFFF"/>
<text x="410" y="40" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2A4A" text-anchor="middle">Autonomy range</text>

<!-- Axis endpoint labels (above axis) -->
<text x="30" y="105" font-size="16" letter-spacing="1.5" fill="#6B7A8C" font-weight="600">LOW AUTONOMY</text>
<text x="30" y="128" font-size="16" fill="#94A3B8" font-style="italic">human originates</text>
<text x="790" y="105" font-size="16" letter-spacing="1.5" fill="#6B7A8C" font-weight="600" text-anchor="end">HIGH AUTONOMY</text>
<text x="790" y="128" font-size="16" fill="#94A3B8" font-style="italic" text-anchor="end">checked by exception</text>

<!-- Spectrum axis with arrows -->
<line x1="30" y1="165" x2="790" y2="165" stroke="#0F2A4A" stroke-width="2"/>
<polygon points="30,165 44,158 44,172" fill="#0F2A4A"/>
<polygon points="790,165 776,158 776,172" fill="#0F2A4A"/>

<!-- Plot point 1: Diagnostic prioritization -->
<circle cx="150" cy="165" r="8" fill="#0F2A4A"/>
<line x1="150" y1="173" x2="150" y2="210" stroke="#0F2A4A" stroke-width="1.5"/>
<text x="150" y="235" font-size="18" fill="#0F2A4A" font-weight="600" text-anchor="middle">Diagnostic</text>
<text x="150" y="258" font-size="18" fill="#0F2A4A" font-weight="600" text-anchor="middle">prioritization</text>
<text x="150" y="288" font-size="15" fill="#6B7A8C" text-anchor="middle" font-style="italic">political readiness,</text>
<text x="150" y="308" font-size="15" fill="#6B7A8C" text-anchor="middle" font-style="italic">sponsor energy</text>

<!-- Plot point 2: Frontline-vs-boardroom framing -->
<circle cx="290" cy="165" r="8" fill="#0F2A4A"/>
<line x1="290" y1="173" x2="290" y2="380" stroke="#0F2A4A" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="290" y="405" font-size="18" fill="#0F2A4A" font-weight="600" text-anchor="middle">Frontline-vs-</text>
<text x="290" y="428" font-size="18" fill="#0F2A4A" font-weight="600" text-anchor="middle">boardroom framing</text>
<text x="290" y="458" font-size="15" fill="#6B7A8C" text-anchor="middle" font-style="italic">judgment about audience,</text>
<text x="290" y="478" font-size="15" fill="#6B7A8C" text-anchor="middle" font-style="italic">not pattern-matchable</text>

<!-- Plot point 3: Gap ranking -->
<circle cx="475" cy="165" r="8" fill="#0EA5E9"/>
<line x1="475" y1="173" x2="475" y2="210" stroke="#0EA5E9" stroke-width="1.5"/>
<text x="475" y="235" font-size="18" fill="#0F2A4A" font-weight="600" text-anchor="middle">Gap ranking</text>
<text x="475" y="265" font-size="15" fill="#6B7A8C" text-anchor="middle" font-style="italic">synthesizer-reviewer</text>
<text x="475" y="285" font-size="15" fill="#6B7A8C" text-anchor="middle" font-style="italic">with escalation</text>

<!-- Plot point 4: Source-inventory tagging -->
<circle cx="660" cy="165" r="8" fill="#0EA5E9"/>
<line x1="660" y1="173" x2="660" y2="210" stroke="#0EA5E9" stroke-width="1.5"/>
<text x="660" y="235" font-size="18" fill="#0F2A4A" font-weight="600" text-anchor="middle">Source-inventory</text>
<text x="660" y="258" font-size="18" fill="#0F2A4A" font-weight="600" text-anchor="middle">tagging</text>
<text x="660" y="288" font-size="15" fill="#6B7A8C" text-anchor="middle" font-style="italic">pattern-matchable,</text>
<text x="660" y="308" font-size="15" fill="#6B7A8C" text-anchor="middle" font-style="italic">recoverable cost</text>
</svg>
