<svg viewBox="0 0 820 462" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" font-family="Inter,Helvetica,Arial,sans-serif">
<title id="ttl">Same engagement, different calibrations</title>
<desc id="desc">A horizontal autonomy spectrum with four decisions from AB's Deliver Signal workflow plotted at different points. Diagnostic prioritization sits at the human-only end. Frontline-versus-boardroom framing is left of center, slightly higher autonomy. Gap ranking is mid-spectrum, escalation-heavy. Source-inventory tagging is well along the spectrum toward agent autonomy.</desc>
<rect width="820" height="500" fill="#FFFFFF"/>
<text x="410" y="28" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2A4A" text-anchor="middle">Autonomy range</text>
<g transform="translate(0, -37)">

<!-- HEADER -->

<!-- Axis endpoint labels (above axis) -->
<text x="80" y="145" font-size="11" letter-spacing="1.5" fill="#6B7A8C" font-weight="600">LOW AUTONOMY</text>
<text x="80" y="162" font-size="11" fill="#94A3B8" font-style="italic">human originates</text>
<text x="740" y="145" font-size="11" letter-spacing="1.5" fill="#6B7A8C" font-weight="600" text-anchor="end">HIGH AUTONOMY</text>
<text x="740" y="162" font-size="11" fill="#94A3B8" font-style="italic" text-anchor="end">checked by exception</text>

<!-- Spectrum axis with arrows -->
<line x1="80" y1="190" x2="740" y2="190" stroke="#0F2A4A" stroke-width="2"/>
<polygon points="80,190 92,184 92,196" fill="#0F2A4A"/>
<polygon points="740,190 728,184 728,196" fill="#0F2A4A"/>

<!-- Plot point 1: Diagnostic prioritization -->
<circle cx="180" cy="190" r="8" fill="#0F2A4A"/>
<line x1="180" y1="198" x2="180" y2="225" stroke="#0F2A4A" stroke-width="1.5"/>
<text x="180" y="244" font-size="14" fill="#0F2A4A" font-weight="600" text-anchor="middle">Diagnostic</text>
<text x="180" y="262" font-size="14" fill="#0F2A4A" font-weight="600" text-anchor="middle">prioritization</text>
<text x="180" y="284" font-size="11" fill="#6B7A8C" text-anchor="middle" font-style="italic">political readiness,</text>
<text x="180" y="298" font-size="11" fill="#6B7A8C" text-anchor="middle" font-style="italic">sponsor energy</text>

<!-- Plot point 2: Frontline-vs-boardroom framing -->
<circle cx="275" cy="190" r="8" fill="#0F2A4A"/>
<line x1="275" y1="198" x2="275" y2="345" stroke="#0F2A4A" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="275" y="365" font-size="14" fill="#0F2A4A" font-weight="600" text-anchor="middle">Frontline-vs-boardroom</text>
<text x="275" y="383" font-size="14" fill="#0F2A4A" font-weight="600" text-anchor="middle">framing</text>
<text x="275" y="405" font-size="11" fill="#6B7A8C" text-anchor="middle" font-style="italic">judgment about audience,</text>
<text x="275" y="419" font-size="11" fill="#6B7A8C" text-anchor="middle" font-style="italic">not pattern-matchable</text>

<!-- Plot point 3: Gap ranking -->
<circle cx="443" cy="190" r="8" fill="#0EA5E9"/>
<line x1="443" y1="198" x2="443" y2="225" stroke="#0EA5E9" stroke-width="1.5"/>
<text x="443" y="244" font-size="14" fill="#0F2A4A" font-weight="600" text-anchor="middle">Gap ranking</text>
<text x="443" y="266" font-size="11" fill="#6B7A8C" text-anchor="middle" font-style="italic">synthesizer-reviewer</text>
<text x="443" y="280" font-size="11" fill="#6B7A8C" text-anchor="middle" font-style="italic">with escalation</text>

<!-- Plot point 4: Source-inventory tagging -->
<circle cx="621" cy="190" r="8" fill="#0EA5E9"/>
<line x1="621" y1="198" x2="621" y2="225" stroke="#0EA5E9" stroke-width="1.5"/>
<text x="621" y="244" font-size="14" fill="#0F2A4A" font-weight="600" text-anchor="middle">Source-inventory</text>
<text x="621" y="262" font-size="14" fill="#0F2A4A" font-weight="600" text-anchor="middle">tagging</text>
<text x="621" y="284" font-size="11" fill="#6B7A8C" text-anchor="middle" font-style="italic">pattern-matchable,</text>
<text x="621" y="298" font-size="11" fill="#6B7A8C" text-anchor="middle" font-style="italic">recoverable cost</text>
</g>
</svg>
