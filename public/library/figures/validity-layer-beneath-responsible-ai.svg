<svg viewBox="0 0 1200 580" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Validity is the layer beneath the responsible-AI frameworks</title>
<desc>Two-layer stack. Top layer shows three responsible-AI frameworks side by side — RSPs, NIST AI RMF, EU AI Act — as navy-bordered boxes. Bottom layer, drawn wider and in teal, is labeled Measurement validity. A vertical relation shows that the frameworks rest on the validity layer beneath. A short caption names the argument.</desc>
<rect width="1200" height="580" fill="#FFFFFF"/>

<text x="600" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">THE LAYER BENEATH</text>
<text x="600" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="-0.4" fill="#0F2A4A" text-anchor="middle">Responsible-AI frameworks sit on a discipline they assume.</text>
<text x="600" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-style="italic" fill="#475569" text-anchor="middle">Measurement validity — the assumption underneath.</text>

<!-- TOP LAYER: three RA frameworks -->
<text x="600" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="middle">RESPONSIBLE-AI FRAMEWORKS</text>

<rect x="240" y="230" width="220" height="80" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="350" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A" text-anchor="middle">Frontier-lab RSPs</text>
<text x="350" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Responsible scaling</text>
<text x="350" y="299" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">policies (Anthropic, others)</text>

<rect x="490" y="230" width="220" height="80" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="600" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A" text-anchor="middle">NIST AI RMF</text>
<text x="600" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Risk management</text>
<text x="600" y="299" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">framework</text>

<rect x="740" y="230" width="220" height="80" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="850" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A" text-anchor="middle">EU AI Act</text>
<text x="850" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Regulation 2024/1689</text>
<text x="850" y="299" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">high-risk requirements</text>

<!-- Downward arrows from each RA framework to the validity layer -->
<line x1="350" y1="310" x2="350" y2="358" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="600" y1="310" x2="600" y2="358" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="850" y1="310" x2="850" y2="358" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>

<!-- BOTTOM LAYER: validity — teal accent -->
<rect x="180" y="360" width="840" height="100" fill="none" stroke="#0EA5E9" stroke-width="2" rx="3"/>
<text x="600" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#0EA5E9" text-anchor="middle">THE LAYER UNDERNEATH</text>
<text x="600" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A" text-anchor="middle">Measurement validity</text>
<text x="600" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Does the AI measure what its deployment context requires it to measure?</text>

<!-- Caption -->
<text x="600" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">The frameworks are necessary. They assume — but do not check — the discipline beneath.</text>
<text x="600" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Validity is the discipline that answers what the frameworks assume answered.</text>
</svg>
