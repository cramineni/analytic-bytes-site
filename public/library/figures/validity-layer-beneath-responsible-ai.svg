<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Validity is the layer beneath the responsible-AI frameworks</title>
<desc>Two-layer stack. Top layer shows three responsible-AI frameworks side by side — RSPs, NIST AI RMF, EU AI Act — as navy-bordered boxes. Bottom layer, drawn wider and in teal, is labeled Measurement validity. A vertical relation shows that the frameworks rest on the validity layer beneath.</desc>
<rect x="0" y="0" width="1200" height="500" fill="#FFFFFF"/>

<!-- Chart title -->
<text x="600" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">The layer underneath</text>

<!-- Section header (top) -->
<text x="600" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="middle">RESPONSIBLE-AI FRAMEWORKS</text>

<!-- TOP LAYER: three RA frameworks -->
<rect x="120" y="120" width="300" height="130" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="270" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F2A4A" text-anchor="middle">Frontier-lab RSPs</text>
<text x="270" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">Responsible scaling</text>
<text x="270" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">policies (Anthropic, others)</text>

<rect x="450" y="120" width="300" height="130" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F2A4A" text-anchor="middle">NIST AI RMF</text>
<text x="600" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">Risk management</text>
<text x="600" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">framework</text>

<rect x="780" y="120" width="300" height="130" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="930" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F2A4A" text-anchor="middle">EU AI Act</text>
<text x="930" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">Regulation 2024/1689</text>
<text x="930" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">high-risk requirements</text>

<!-- Downward arrows from each RA framework to the validity layer -->
<line x1="270" y1="250" x2="270" y2="300" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="600" y1="250" x2="600" y2="300" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="930" y1="250" x2="930" y2="300" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>

<!-- BOTTOM LAYER: validity — teal accent -->
<rect x="80" y="300" width="1040" height="180" fill="none" stroke="#0EA5E9" stroke-width="2" rx="3"/>
<text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#0EA5E9" text-anchor="middle">THE LAYER UNDERNEATH</text>
<text x="600" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#0F2A4A" text-anchor="middle">Measurement validity</text>
<text x="600" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#475569" text-anchor="middle">Does the claim this deployment is making hold,</text>
<text x="600" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#475569" text-anchor="middle">for this use and for these people?</text>
</svg>
