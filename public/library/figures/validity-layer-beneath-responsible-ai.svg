<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Validity is the layer beneath the responsible-AI frameworks</title>
<desc>Two-layer stack. Top layer shows three responsible-AI frameworks side by side — RSPs, NIST AI RMF, EU AI Act — as navy-bordered boxes. Bottom layer, drawn wider and in teal, is labeled Measurement validity. A vertical relation shows that the frameworks rest on the validity layer beneath.</desc>
<rect width="1200" height="500" fill="#FFFFFF"/>

<!-- TOP LAYER: three RA frameworks -->
<text x="600" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="middle">RESPONSIBLE-AI FRAMEWORKS</text>

<rect x="240" y="100" width="220" height="80" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="350" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A" text-anchor="middle">Frontier-lab RSPs</text>
<text x="350" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Responsible scaling</text>
<text x="350" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">policies (Anthropic, others)</text>

<rect x="490" y="100" width="220" height="80" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="600" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A" text-anchor="middle">NIST AI RMF</text>
<text x="600" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Risk management</text>
<text x="600" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">framework</text>

<rect x="740" y="100" width="220" height="80" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="850" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F2A4A" text-anchor="middle">EU AI Act</text>
<text x="850" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Regulation 2024/1689</text>
<text x="850" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">high-risk requirements</text>

<!-- Downward arrows from each RA framework to the validity layer -->
<line x1="350" y1="180" x2="350" y2="228" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="600" y1="180" x2="600" y2="228" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="850" y1="180" x2="850" y2="228" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>

<!-- BOTTOM LAYER: validity — teal accent -->
<rect x="180" y="230" width="840" height="100" fill="none" stroke="#0EA5E9" stroke-width="2" rx="3"/>
<text x="600" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#0EA5E9" text-anchor="middle">THE LAYER UNDERNEATH</text>
<text x="600" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A" text-anchor="middle">Measurement validity</text>
<text x="600" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Does the claim this deployment is making hold, for this use and for these people?</text>

<!-- Note -->
<text x="600" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">The frameworks are necessary. They assume &#8212; but do not check &#8212; the discipline beneath.</text>
<text x="600" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Validity is the discipline that answers what the frameworks assume answered.</text>
</svg>
