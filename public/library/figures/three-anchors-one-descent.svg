<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc">
<title id="ttl">Three questions, one descent</title>
<desc id="desc">Three panels, each showing the same sixty-five codable job postings as a grid of sixty-five small squares. In the first panel, an attribute the person must have, sixty-four squares are filled and the panel is framed in a solid navy line: this is the control, showing employers can and routinely do write this down. In the second, a decision the person may make, twenty-three are filled. In the third, a measure of the person&#8217;s own work, seven are filled. The second and third panels are framed in dashed teal to mark what these documents almost never write. Square position carries no meaning.</desc>
<rect width="1200" height="470" fill="#FFFFFF"/>
