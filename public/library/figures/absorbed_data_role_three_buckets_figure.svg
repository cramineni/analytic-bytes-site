<svg viewBox="0 -110 1200 710" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The three buckets of data work — and the one that keeps getting absorbed</title>
<desc>Three horizontal bands stacked vertically. Bucket 1 is data entry, distributed across delivery roles. Bucket 2 is interpretation and action, held by delivery roles who understand the operational context. Bucket 3 is the specialized semantic-layer, integration, quality, and governance work — highlighted in teal because it is the one that most often has no funded home and gets absorbed by whoever is capable. Captions below name the intended owner for each.</desc>
<rect x="0" y="-110" width="1200" height="710" fill="#FFFFFF"/>
<text x="600" y="-70" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">The absorbed data role, three buckets</text>
<g transform="translate(0, -212)">
<!-- HEADER -->

<!-- BUCKET 1 -->
<rect x="90" y="220" width="1020" height="160" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="110" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="start">BUCKET 1</text>
<text x="110" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F2A4A" text-anchor="start">Data entry</text>
<text x="110" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">Recording what happened. Owned by delivery roles.</text>

<!-- BUCKET 2 -->
<rect x="90" y="400" width="1020" height="160" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
<text x="110" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="start">BUCKET 2</text>
<text x="110" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F2A4A" text-anchor="start">Interpretation and action</text>
<text x="110" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569" text-anchor="start">Reading a dashboard. Acting on a flag. Owned by delivery.</text>

<!-- BUCKET 3 — teal accent, the misplaced one -->
<rect x="90" y="580" width="1020" height="200" fill="none" stroke="#0EA5E9" stroke-width="2" rx="3"/>
<text x="110" y="618" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#0EA5E9" text-anchor="start">BUCKET 3</text>
<text x="110" y="658" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F2A4A" text-anchor="start">Semantic layer, integration,</text>
<text x="110" y="688" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F2A4A" text-anchor="start">quality, governance</text>
<text x="110" y="742" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0EA5E9" text-anchor="start" font-weight="600">Needs a dedicated role. Usually has none.</text>

<!-- Caption -->
</g>
</svg>
