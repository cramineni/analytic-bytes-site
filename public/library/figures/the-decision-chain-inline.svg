<svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>The decision chain</title><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The decision chain</title>
<desc id="d">Six boxes: construct, representation, inference, decision and action in a row, with consequence below action. A dashed teal return leg runs from consequence back to construct. Three bands beneath mark where meaning, validity and authority fail along the chain.</desc>
<rect width="1200" height="540" fill="#FFFFFF"/>
<text x="600" y="48" font-size="33" font-weight="700" fill="#0F2A4A" text-anchor="middle">The decision chain</text>
<rect x="90" y="96" width="192" height="82" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.6"/>
<text x="186.0" y="130" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="middle">construct</text>
<text x="186.0" y="159" font-size="21" fill="#475569" text-anchor="middle">what we mean</text>
<line x1="284" y1="137.0" x2="289" y2="137.0" stroke="#0F2A4A" stroke-width="1.6"/><polygon points="295,137.0 287,132.0 287,142.0" fill="#0F2A4A"/>
<rect x="297" y="96" width="192" height="82" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.6"/>
<text x="393.0" y="130" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="middle">representation</text>
<text x="393.0" y="159" font-size="21" fill="#475569" text-anchor="middle">what stands for it</text>
<line x1="491" y1="137.0" x2="496" y2="137.0" stroke="#0F2A4A" stroke-width="1.6"/><polygon points="502,137.0 494,132.0 494,142.0" fill="#0F2A4A"/>
<rect x="504" y="96" width="192" height="82" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.6"/>
<text x="600.0" y="130" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="middle">inference</text>
<text x="600.0" y="159" font-size="21" fill="#475569" text-anchor="middle">what we read off it</text>
<line x1="698" y1="137.0" x2="703" y2="137.0" stroke="#0F2A4A" stroke-width="1.6"/><polygon points="709,137.0 701,132.0 701,142.0" fill="#0F2A4A"/>
<rect x="711" y="96" width="192" height="82" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.6"/>
<text x="807.0" y="130" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="middle">decision</text>
<text x="807.0" y="159" font-size="21" fill="#475569" text-anchor="middle">who settles it</text>
<line x1="905" y1="137.0" x2="910" y2="137.0" stroke="#0F2A4A" stroke-width="1.6"/><polygon points="916,137.0 908,132.0 908,142.0" fill="#0F2A4A"/>
<rect x="918" y="96" width="192" height="82" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.6"/>
<text x="1014.0" y="130" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="middle">action</text>
<text x="1014.0" y="159" font-size="21" fill="#475569" text-anchor="middle">what gets done</text>
<rect x="918" y="238" width="192" height="82" rx="5" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.6"/>
<text x="1014.0" y="272" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="middle">consequence</text>
<text x="1014.0" y="301" font-size="21" fill="#475569" text-anchor="middle">what followed</text>
<path d="M 1110 137.0 Q 1150 137.0 1150 208.0 Q 1150 279.0 1122 279.0" fill="none" stroke="#0F2A4A" stroke-width="1.6"/><polygon points="1112,279.0 1122,274.0 1122,284.0" fill="#0F2A4A"/>
<path d="M 918 279.0 L 211.0 279.0 Q 186.0 279.0 186.0 254.0 L 186.0 192" fill="none" stroke="#0EA5E9" stroke-width="1.8" stroke-dasharray="7 5"/><polygon points="186.0,181 180.0,193 192.0,193" fill="#0EA5E9"/>
<text x="555" y="265.0" font-size="21" font-weight="500" fill="#0EA5E9" text-anchor="middle">the return leg</text>
<text x="555" y="309.0" font-size="21" fill="#475569" text-anchor="middle">what the outcome showed, carried into the next round</text>
<rect x="90" y="372" width="320" height="5" rx="2.5" fill="#0F2A4A"/>
<text x="90" y="412" font-size="22" font-weight="500" fill="#0F2A4A">meaning</text>
<text x="90" y="442" font-size="21" fill="#475569">the construct is undefined,</text>
<text x="90" y="469" font-size="21" fill="#475569">or defined differently</text>
<text x="90" y="496" font-size="21" fill="#475569">in different places</text>
<rect x="430" y="372" width="320" height="5" rx="2.5" fill="#0EA5E9"/>
<text x="430" y="412" font-size="22" font-weight="500" fill="#0EA5E9">validity</text>
<text x="430" y="442" font-size="21" fill="#475569">the number does not support</text>
<text x="430" y="469" font-size="21" fill="#475569">the claim read off it</text>
<rect x="770" y="372" width="320" height="5" rx="2.5" fill="#94A3B8"/>
<text x="770" y="412" font-size="22" font-weight="500" fill="#475569">authority</text>
<text x="770" y="442" font-size="21" fill="#475569">nobody owns the call,</text>
<text x="770" y="469" font-size="21" fill="#475569">or nobody may act</text>
</svg>