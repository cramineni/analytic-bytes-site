<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <defs>
    <marker id="anavy" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0F2A4A"/>
    </marker>
    <marker id="ateal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <text x="600" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F2A4A" text-anchor="middle">Change maintenance, and the model inside it</text>

  <!-- CHANGE EVENTS -->
  <rect x="60" y="120" width="300" height="240" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="120" width="4" height="240" fill="#0F2A4A"/>
  <text x="210" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" letter-spacing="2" fill="#475569" text-anchor="middle">CHANGE EVENTS</text>
  <text x="210" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">A definition is reissued</text>
  <text x="210" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">A field is renamed</text>
  <text x="210" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">A person leaves</text>
  <text x="210" y="319" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">The year rolls over</text>

  <line x1="368" y1="240" x2="450" y2="240" stroke="#0F2A4A" stroke-width="1.6" marker-end="url(#anavy)"/>

  <!-- THREE JOBS -->
  <text x="600" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" letter-spacing="2" fill="#475569" text-anchor="middle">THREE JOBS</text>
  <rect x="465" y="160" width="270" height="56" fill="none" stroke="#0F2A4A" stroke-width="1.6"/>
  <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">Reconfigure</text>
  <rect x="465" y="228" width="270" height="56" fill="none" stroke="#0F2A4A" stroke-width="1.6"/>
  <text x="600" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">Re-teach</text>
  <rect x="465" y="296" width="270" height="56" fill="none" stroke="#0F2A4A" stroke-width="1.6"/>
  <text x="600" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0F2A4A" text-anchor="middle">Re-map</text>

  <line x1="750" y1="240" x2="832" y2="240" stroke="#0F2A4A" stroke-width="1.6" marker-end="url(#anavy)"/>

  <!-- THE CHANGE LOG -->
  <rect x="840" y="120" width="300" height="240" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="840" y="120" width="4" height="240" fill="#0F2A4A"/>
  <text x="990" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" letter-spacing="2" fill="#475569" text-anchor="middle">THE CHANGE LOG</text>
  <text x="990" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#0F2A4A" text-anchor="middle">What changed, and when</text>
  <text x="990" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#0F2A4A" text-anchor="middle">What it was mapped to</text>
  <text x="990" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#0F2A4A" text-anchor="middle">Who confirmed it</text>
  <text x="990" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#0F2A4A" text-anchor="middle">What the trend can claim</text>
  <text x="990" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#0F2A4A" text-anchor="middle">across the boundary</text>

  <!-- THE MODEL -->
  <rect x="465" y="470" width="270" height="56" fill="none" stroke="#0EA5E9" stroke-width="1.6"/>
  <text x="600" y="506" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0EA5E9" text-anchor="middle">The model</text>

  <line x1="600" y1="464" x2="600" y2="392" stroke="#0EA5E9" stroke-width="1.6"/>
  <line x1="465" y1="390" x2="735" y2="390" stroke="#0EA5E9" stroke-width="1.6"/>
  <line x1="530" y1="390" x2="530" y2="362" stroke="#0EA5E9" stroke-width="1.6" marker-end="url(#ateal)"/>
  <line x1="600" y1="390" x2="600" y2="362" stroke="#0EA5E9" stroke-width="1.6" marker-end="url(#ateal)"/>
  <line x1="670" y1="390" x2="670" y2="362" stroke="#0EA5E9" stroke-width="1.6" marker-end="url(#ateal)"/>
  <text x="600" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569" text-anchor="middle">drafts the translation, a person confirms it</text>

  <path d="M 465 498 L 210 498 L 210 370" fill="none" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ateal)"/>
  <text x="238" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569">and is itself a change event</text>
</svg>
