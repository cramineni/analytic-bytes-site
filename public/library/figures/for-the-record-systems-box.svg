<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- chart title: 33px canvas = 22px on screen at 1200 wide -->
  <text x="600" y="48" font-size="33" font-weight="700" fill="#0F2A4A" text-anchor="middle">The systems box, outside and inside</text>

  <!-- ===== LEFT PANEL: systems outside ===== -->
  <g transform="translate(60,90)">
    <text x="250" y="18" font-size="21" fill="#475569" text-anchor="middle" letter-spacing="1">SYSTEMS OUTSIDE</text>

    <!-- program / people / process boxes, swollen, dashed (cracking) borders -->
    <g stroke="#0F2A4A" stroke-width="1.4" fill="none" stroke-dasharray="9 6">
      <rect x="10" y="50" width="230" height="170" rx="4"/>
      <rect x="260" y="50" width="230" height="170" rx="4"/>
      <rect x="10" y="240" width="480" height="150" rx="4"/>
    </g>
    <g font-size="22" fill="#0F2A4A">
      <text x="125" y="80" text-anchor="middle">Program</text>
      <text x="375" y="80" text-anchor="middle">People</text>
      <text x="250" y="270" text-anchor="middle">Process</text>
    </g>

    <!-- spreadsheet icons filling the boxes -->
    <g stroke="#94A3B8" stroke-width="1" fill="#F8FAFC">
      <!-- program -->
      <rect x="30" y="95" width="34" height="26"/><rect x="72" y="95" width="34" height="26"/><rect x="114" y="95" width="34" height="26"/><rect x="156" y="95" width="34" height="26"/><rect x="198" y="95" width="34" height="26"/>
      <rect x="30" y="130" width="34" height="26"/><rect x="72" y="130" width="34" height="26"/><rect x="114" y="130" width="34" height="26"/><rect x="156" y="130" width="34" height="26"/><rect x="198" y="130" width="34" height="26"/>
      <rect x="30" y="165" width="34" height="26"/><rect x="72" y="165" width="34" height="26"/><rect x="114" y="165" width="34" height="26"/><rect x="156" y="165" width="34" height="26"/><rect x="198" y="165" width="34" height="26"/>
      <!-- people -->
      <rect x="280" y="95" width="34" height="26"/><rect x="322" y="95" width="34" height="26"/><rect x="364" y="95" width="34" height="26"/><rect x="406" y="95" width="34" height="26"/><rect x="448" y="95" width="34" height="26"/>
      <rect x="280" y="130" width="34" height="26"/><rect x="322" y="130" width="34" height="26"/><rect x="364" y="130" width="34" height="26"/><rect x="406" y="130" width="34" height="26"/><rect x="448" y="130" width="34" height="26"/>
      <rect x="280" y="165" width="34" height="26"/><rect x="322" y="165" width="34" height="26"/><rect x="364" y="165" width="34" height="26"/><rect x="406" y="165" width="34" height="26"/><rect x="448" y="165" width="34" height="26"/>
      <!-- process -->
      <rect x="30" y="290" width="34" height="26"/><rect x="72" y="290" width="34" height="26"/><rect x="114" y="290" width="34" height="26"/><rect x="156" y="290" width="34" height="26"/><rect x="198" y="290" width="34" height="26"/><rect x="240" y="290" width="34" height="26"/><rect x="282" y="290" width="34" height="26"/><rect x="324" y="290" width="34" height="26"/><rect x="366" y="290" width="34" height="26"/><rect x="408" y="290" width="34" height="26"/><rect x="450" y="290" width="34" height="26"/>
      <rect x="30" y="330" width="34" height="26"/><rect x="72" y="330" width="34" height="26"/><rect x="114" y="330" width="34" height="26"/><rect x="156" y="330" width="34" height="26"/><rect x="198" y="330" width="34" height="26"/><rect x="240" y="330" width="34" height="26"/><rect x="282" y="330" width="34" height="26"/><rect x="324" y="330" width="34" height="26"/><rect x="366" y="330" width="34" height="26"/><rect x="408" y="330" width="34" height="26"/><rect x="450" y="330" width="34" height="26"/>
    </g>
    <!-- grid lines on a few icons to read as spreadsheets -->
    <g stroke="#94A3B8" stroke-width="0.8">
      <path d="M30 104h34M30 113h34M41 95v26M52 95v26"/>
      <path d="M280 104h34M280 113h34M291 95v26M302 95v26"/>
      <path d="M30 299h34M30 308h34M41 290v26M52 290v26"/>
    </g>
    <text x="250" y="422" font-size="21" fill="#475569" text-anchor="middle">Spreadsheets for themselves</text>

    <!-- systems box, outside and below -->
    <rect x="130" y="445" width="240" height="70" rx="4" fill="none" stroke="#0F2A4A" stroke-width="1.6"/>
    <text x="250" y="475" font-size="22" fill="#0F2A4A" text-anchor="middle">Systems</text>
    <text x="250" y="500" font-size="18" fill="#475569" text-anchor="middle">for the record</text>
    <!-- arrow out to the audit -->
    <path d="M370 480 H450" stroke="#0F2A4A" stroke-width="1.4" fill="none"/>
    <path d="M450 480 l-10 -6 v12 z" fill="#0F2A4A"/>
    <text x="460" y="486" font-size="18" fill="#475569">state, funder</text>
  </g>

  <!-- divider -->
  <line x1="600" y1="100" x2="600" y2="600" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ===== RIGHT PANEL: systems inside ===== -->
  <g transform="translate(610,90)">
    <text x="250" y="18" font-size="21" fill="#475569" text-anchor="middle" letter-spacing="1">SYSTEMS INSIDE</text>
    <rect x="15" y="34" width="470" height="436" rx="6" fill="none" stroke="#0F2A4A" stroke-width="2"/>

    <!-- smaller, solid boxes -->
    <g stroke="#0F2A4A" stroke-width="1.6" fill="none">
      <rect x="40" y="50" width="180" height="120" rx="4"/>
      <rect x="280" y="50" width="180" height="120" rx="4"/>
      <rect x="40" y="200" width="420" height="90" rx="4"/>
    </g>
    <g font-size="22" fill="#0F2A4A">
      <text x="130" y="80" text-anchor="middle">Program</text>
      <text x="370" y="80" text-anchor="middle">People</text>
      <text x="250" y="230" text-anchor="middle">Process</text>
    </g>
    <!-- one working sheet per box, kept -->
    <g stroke="#94A3B8" stroke-width="1" fill="#F8FAFC">
      <rect x="112" y="105" width="36" height="28"/>
      <rect x="352" y="105" width="36" height="28"/>
      <rect x="232" y="245" width="36" height="28"/>
    </g>
    <g stroke="#94A3B8" stroke-width="0.8">
      <path d="M112 114h36M112 124h36M124 105v28M136 105v28"/>
      <path d="M352 114h36M352 124h36M364 105v28M376 105v28"/>
      <path d="M232 254h36M232 264h36M244 245v28M256 245v28"/>
    </g>

    <!-- systems box inside, connected by the crosswalk (teal) -->
    <rect x="120" y="360" width="260" height="70" rx="4" fill="none" stroke="#0F2A4A" stroke-width="1.6"/>
    <text x="250" y="390" font-size="22" fill="#0F2A4A" text-anchor="middle">Systems</text>
    <text x="250" y="415" font-size="18" fill="#475569" text-anchor="middle">written from the sheets</text>

    <!-- teal crosswalk lines: sheet -> systems -> sheet (both directions) -->
    <g stroke="#0EA5E9" stroke-width="1.6" fill="none" stroke-dasharray="6 5">
      <path d="M130 133 V360"/>
      <path d="M370 133 V360"/>
      <path d="M250 273 V360"/>
    </g>
    <g fill="#0EA5E9">
      <circle cx="130" cy="133" r="5"/><circle cx="370" cy="133" r="5"/><circle cx="250" cy="273" r="5"/>
      <circle cx="130" cy="360" r="5"/><circle cx="370" cy="360" r="5"/><circle cx="250" cy="360" r="5"/>
    </g>
    <rect x="120" y="308" width="260" height="26" fill="#FFFFFF"/>
    <text x="250" y="327" font-size="21" fill="#475569" text-anchor="middle">One working sheet each, kept</text>
    <rect x="130" y="440" width="240" height="22" fill="#FFFFFF"/>
    <text x="250" y="457" font-size="18" fill="#0EA5E9" text-anchor="middle">crosswalk, confirmed and versioned</text>

    <!-- arrow out to the audit, now from inside -->
    <path d="M250 470 V500" stroke="#0F2A4A" stroke-width="1.4" fill="none"/>
    <path d="M250 500 l-6 -10 h12 z" fill="#0F2A4A"/>
    <text x="250" y="524" text-anchor="middle" font-size="18" fill="#475569">state, funder</text>
  </g>
</svg>
