<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Three evidence standards</title>
<desc>Three stacked rows on light backing panels. Each row names one of the three questions in navy and, beneath it in slate, what counts as evidence that the question has been answered. The third row carries a teal accent bar; the first two are muted. The first two standards can be checked by operating the system. The third cannot.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>

<text x="600" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F2A4A" text-anchor="middle" dominant-baseline="hanging">Three evidence standards</text>

<rect x="90" y="150" width="1020" height="120" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/>
<rect x="90" y="150" width="6" height="120" fill="#94A3B8"/>
<text x="130" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A">Will it run</text>
<text x="130" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569">It holds under load, under change, and under whoever inherits it.</text>

<rect x="90" y="298" width="1020" height="120" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/>
<rect x="90" y="298" width="6" height="120" fill="#94A3B8"/>
<text x="130" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A">Will it return</text>
<text x="130" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569">The next increment gets funded on the strength of the last one.</text>

<rect x="90" y="446" width="1020" height="120" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/>
<rect x="90" y="446" width="6" height="120" fill="#0EA5E9"/>
<text x="130" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#0F2A4A">Is it supportable</text>
<text x="130" y="541" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#475569">The argument survives a reader who is trying to break it.</text>

</svg>
