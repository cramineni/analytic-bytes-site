<svg viewBox="0 -140 900 780" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>The flag is the easy part. The system is the work.</title>
<desc>Left panel shows a dashboard-style grid of colored flag dots (red, yellow, green) representing early-warning flags firing on a screen — but nothing happens. An arrow crosses to the right panel, which shows a triangle of three navy-outlined circles labeled MEANING, AUTHORITY, VALIDITY with a teal decision dot at the center — the decision system that turns flags into action.</desc>

<rect x="0" y="-140" width="900" height="780" fill="#FFFFFF"/>
<text x="450" y="-90" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F2A4A" text-anchor="middle">The flag vs. the decision system</text>
<!-- HEADER -->

<!-- LEFT PANEL: The flag wall (dashboard-style) -->
<g transform="translate(40, 20)">
  <text x="180" y="0" font-size="20" font-weight="700" letter-spacing="2" fill="#6B7A8C" text-anchor="middle">THE FLAG WALL</text>

  <!-- Dashboard rectangle -->
  <rect x="0" y="30" width="360" height="360" fill="none" stroke="#CBD6E0" stroke-width="1.2" rx="4"/>

  <!-- 6 rows x 4 cols of flag dots (24 flags) — mix of red, yellow, green -->
  <!-- Row 1 -->
  <circle cx="54" cy="82" r="12" fill="#DC2626"/>
  <circle cx="138" cy="82" r="12" fill="#F59E0B"/>
  <circle cx="222" cy="82" r="12" fill="#10B981"/>
  <circle cx="306" cy="82" r="12" fill="#DC2626"/>
  <!-- Row 2 -->
  <circle cx="54" cy="136" r="12" fill="#F59E0B"/>
  <circle cx="138" cy="136" r="12" fill="#DC2626"/>
  <circle cx="222" cy="136" r="12" fill="#F59E0B"/>
  <circle cx="306" cy="136" r="12" fill="#10B981"/>
  <!-- Row 3 -->
  <circle cx="54" cy="190" r="12" fill="#10B981"/>
  <circle cx="138" cy="190" r="12" fill="#F59E0B"/>
  <circle cx="222" cy="190" r="12" fill="#DC2626"/>
  <circle cx="306" cy="190" r="12" fill="#F59E0B"/>
  <!-- Row 4 -->
  <circle cx="54" cy="244" r="12" fill="#DC2626"/>
  <circle cx="138" cy="244" r="12" fill="#10B981"/>
  <circle cx="222" cy="244" r="12" fill="#F59E0B"/>
  <circle cx="306" cy="244" r="12" fill="#DC2626"/>
  <!-- Row 5 -->
  <circle cx="54" cy="298" r="12" fill="#F59E0B"/>
  <circle cx="138" cy="298" r="12" fill="#DC2626"/>
  <circle cx="222" cy="298" r="12" fill="#10B981"/>
  <circle cx="306" cy="298" r="12" fill="#F59E0B"/>
  <!-- Row 6 -->
  <circle cx="54" cy="352" r="12" fill="#10B981"/>
  <circle cx="138" cy="352" r="12" fill="#F59E0B"/>
  <circle cx="222" cy="352" r="12" fill="#DC2626"/>
  <circle cx="306" cy="352" r="12" fill="#10B981"/>

  <!-- Caption below -->
  <text x="180" y="435" font-size="22" fill="#0F2A4A" text-anchor="middle" font-weight="600">Nothing happens.</text>
  <text x="180" y="465" font-size="18" fill="#6B7A8C" text-anchor="middle" font-style="italic">The flag was the easy part.</text>
</g>


<!-- MIDDLE: horizontal arrow -->
<g transform="translate(420, 235)">
  <line x1="0" y1="0" x2="55" y2="0" stroke="#0F2A4A" stroke-width="1.75"/>
  <path d="M51,-6 L61,0 L51,6 z" fill="#0F2A4A"/>
  <text x="30" y="-16" font-size="18" font-weight="700" letter-spacing="2" fill="#0EA5E9" text-anchor="middle">SYSTEM</text>
  <text x="30" y="22" font-size="16" font-style="italic" fill="#475569" text-anchor="middle">meaning &#183; authority &#183; validity</text>
</g>

<!-- RIGHT PANEL: The decision system triangle -->
<g transform="translate(500, 20)">
  <text x="200" y="0" font-size="20" font-weight="700" letter-spacing="2" fill="#6B7A8C" text-anchor="middle">THE DECISION SYSTEM</text>

  <!-- Triangle at center of right panel -->
  <g transform="translate(200, 210)">
    <!-- Triangle lines -->
    <line x1="0" y1="-100" x2="-120" y2="90" stroke="#0EA5E9" stroke-width="1.5"/>
    <line x1="0" y1="-100" x2="120" y2="90" stroke="#0EA5E9" stroke-width="1.5"/>
    <line x1="-120" y1="90" x2="120" y2="90" stroke="#0EA5E9" stroke-width="1.5"/>

    <!-- Center decision dot -->
    <circle cx="0" cy="10" r="12" fill="#0EA5E9"/>
    <text x="0" y="50" font-size="18" font-weight="700" letter-spacing="1.5" fill="#0F2A4A" text-anchor="middle">DECISION</text>

    <!-- Vertices -->
    <circle cx="0" cy="-100" r="52" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5"/>
    <text x="0" y="-95" font-size="18" font-weight="700" letter-spacing="1" fill="#0F2A4A" text-anchor="middle">MEANING</text>

    <circle cx="-120" cy="90" r="58" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5"/>
    <text x="-120" y="95" font-size="18" font-weight="700" letter-spacing="0.5" fill="#0F2A4A" text-anchor="middle">AUTHORITY</text>

    <circle cx="120" cy="90" r="52" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5"/>
    <text x="120" y="95" font-size="18" font-weight="700" letter-spacing="1" fill="#0F2A4A" text-anchor="middle">VALIDITY</text>
  </g>

  <!-- Caption below -->
  <text x="200" y="435" font-size="22" fill="#0F2A4A" text-anchor="middle" font-weight="600">A decision happens.</text>
  <text x="200" y="465" font-size="18" fill="#6B7A8C" text-anchor="middle" font-style="italic">The system is the work.</text>
</g>

</svg>
