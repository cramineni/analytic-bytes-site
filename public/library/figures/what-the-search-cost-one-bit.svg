<svg viewBox="0 -110 1200 610" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>What a rejection transmits</title>
<desc>Seven causes of a rejection are listed on the left in navy: role cancelled or rescoped, internal candidate already chosen, budget freeze after posting, keyword screen did not match, compensation band mismatch, filled before the file was read, and a real capability gap. Lines from all seven converge on a single small box in the centre reading NO, labelled one bit, no reason attached. Dashed arrows fan back out from that box to the same seven causes on the right, now drawn in grey to show they are all still live for the candidate. One of them, real capability gap, is outlined in teal and annotated as the one most people pick. Notes beneath read: seven causes into one bit, lossy by design; and one bit back into seven, no unique solution.</desc>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
<rect x="0" y="-110" width="1200" height="610" fill="#FFFFFF"/>
<!-- HEADER -->
<!-- Column headers -->
  <text x="50" y="40" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">WHY A "NO" HAPPENS</text>
  <text x="570" y="40" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2" text-anchor="middle">SENT</text>
  <text x="760" y="40" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">WHAT THE CANDIDATE MUST INFER</text>

  <!-- Converging lines -->
  <g stroke="#CBD5E1" stroke-width="1" fill="none">
    <path d="M340,72 L515,237"/>
    <path d="M340,127 L515,237"/>
    <path d="M340,182 L515,237"/>
    <path d="M340,237 L515,237"/>
    <path d="M340,292 L515,237"/>
    <path d="M340,347 L515,237"/>
    <path d="M340,402 L515,237"/>
  </g>

  <!-- Diverging lines -->
  <g stroke="#CBD5E1" stroke-width="1" fill="none" stroke-dasharray="4 4" marker-end="url(#ah)">
    <path d="M625,237 L752,72"/>
    <path d="M625,237 L752,127"/>
    <path d="M625,237 L752,182"/>
    <path d="M625,237 L752,237"/>
    <path d="M625,237 L752,292"/>
    <path d="M625,237 L752,347"/>
    <path d="M625,237 L752,402"/>
  </g>

  <!-- LEFT: causes, known to the employer -->
  <g fill="none" stroke="#0F2A4A" stroke-width="1.2">
    <rect x="50" y="54" width="290" height="36" rx="3"/>
    <rect x="50" y="109" width="290" height="36" rx="3"/>
    <rect x="50" y="164" width="290" height="36" rx="3"/>
    <rect x="50" y="219" width="290" height="36" rx="3"/>
    <rect x="50" y="274" width="290" height="36" rx="3"/>
    <rect x="50" y="329" width="290" height="36" rx="3"/>
    <rect x="50" y="384" width="290" height="36" rx="3"/>
  </g>
  <g font-size="13" fill="#0F2A4A">
    <text x="66" y="77">Role cancelled or rescoped</text>
    <text x="66" y="132">Internal candidate already chosen</text>
    <text x="66" y="187">Budget freeze after posting</text>
    <text x="66" y="242">Keyword screen did not match</text>
    <text x="66" y="297">Compensation band mismatch</text>
    <text x="66" y="352">Filled before the file was read</text>
    <text x="66" y="407">Real capability gap</text>
  </g>

  <!-- MIDDLE: the one bit -->
  <rect x="515" y="205" width="110" height="64" rx="3" fill="none" stroke="#0F2A4A" stroke-width="1.6"/>
  <text x="570" y="246" font-size="26" font-weight="700" fill="#0F2A4A" text-anchor="middle" letter-spacing="1">NO</text>
  <text x="570" y="294" font-size="12" fill="#64748B" text-anchor="middle" letter-spacing="1.5">1 BIT</text>
  <text x="570" y="314" font-size="12" fill="#94A3B8" text-anchor="middle" font-style="italic">no reason attached</text>

  <!-- RIGHT: reconstruction, all still live -->
  <g fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 3">
    <rect x="760" y="54" width="390" height="36" rx="3"/>
    <rect x="760" y="109" width="390" height="36" rx="3"/>
    <rect x="760" y="164" width="390" height="36" rx="3"/>
    <rect x="760" y="219" width="390" height="36" rx="3"/>
    <rect x="760" y="274" width="390" height="36" rx="3"/>
    <rect x="760" y="384" width="390" height="36" rx="3"/>
  </g>
  <rect x="760" y="329" width="390" height="36" rx="3" fill="none" stroke="#0EA5E9" stroke-width="1.8"/>

  <g font-size="13" fill="#475569">
    <text x="776" y="77">Role cancelled or rescoped</text>
    <text x="776" y="132">Internal candidate already chosen</text>
    <text x="776" y="187">Budget freeze after posting</text>
    <text x="776" y="242">Keyword screen did not match</text>
    <text x="776" y="297">Compensation band mismatch</text>
    <text x="776" y="407">Filled before the file was read</text>
  </g>
  <text x="776" y="352" font-size="13" font-weight="600" fill="#0F2A4A">Real capability gap</text>
  <text x="1134" y="352" font-size="11.5" fill="#0EA5E9" text-anchor="end" font-style="italic">the one most people pick</text>

  <!-- Process annotations -->
  <text x="430" y="474" font-size="12.5" fill="#64748B" text-anchor="middle" font-style="italic">seven causes into one bit. lossy by design.</text>
  <text x="900" y="474" font-size="12.5" fill="#64748B" text-anchor="middle" font-style="italic">one bit back into seven. no unique solution.</text>
</svg>
