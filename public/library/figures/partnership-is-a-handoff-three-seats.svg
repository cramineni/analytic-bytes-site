<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Three seats, three gaps">
  <title>Three seats, three gaps.</title>
  <rect width="1200" height="720" fill="#FFFFFF"/>

  <!-- Chart title (33px per readability floor for 1200 canvas) -->
  <text x="600" y="68" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="33" font-weight="700" fill="#0F2A4A">Three seats, three gaps.</text>

  <!-- Box 1: Sponsorship -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="340" height="540" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/>
    <text x="170" y="56" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="24" font-weight="700" letter-spacing="2" fill="#0F2A4A">SPONSORSHIP</text>

    <text x="24" y="140"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="21" font-weight="700" letter-spacing="2" fill="#475569">HOLDS</text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="22" fill="#334155">
      <tspan x="24" y="186">Pushes for the</tspan>
      <tspan x="24" y="218">purchase.</tspan>
    </text>

    <line x1="24" y1="316" x2="316" y2="316" stroke="#E2E8F0" stroke-width="1.4"/>

    <text x="24" y="366"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="21" font-weight="700" letter-spacing="2" fill="#475569">LACKS</text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="22" fill="#334155">
      <tspan x="24" y="412">A budget to spend.</tspan>
    </text>
  </g>

  <!-- Box 2: Budget -->
  <g transform="translate(430, 130)">
    <rect x="0" y="0" width="340" height="540" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/>
    <text x="170" y="56" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="24" font-weight="700" letter-spacing="2" fill="#0F2A4A">BUDGET</text>

    <text x="24" y="140"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="21" font-weight="700" letter-spacing="2" fill="#475569">HOLDS</text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="22" fill="#334155">
      <tspan x="24" y="186">Signs the contract,</tspan>
      <tspan x="24" y="218">decides what is</tspan>
      <tspan x="24" y="250">enough.</tspan>
    </text>

    <line x1="24" y1="316" x2="316" y2="316" stroke="#E2E8F0" stroke-width="1.4"/>

    <text x="24" y="366"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="21" font-weight="700" letter-spacing="2" fill="#475569">LACKS</text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="22" fill="#334155">
      <tspan x="24" y="412">Any role in running</tspan>
      <tspan x="24" y="444">what was bought.</tspan>
    </text>
  </g>

  <!-- Box 3: Expertise (teal accent) -->
  <g transform="translate(800, 130)">
    <rect x="0" y="0" width="340" height="540" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/>
    <rect x="0" y="0" width="5" height="540" fill="#0EA5E9"/>
    <text x="170" y="56" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="24" font-weight="700" letter-spacing="2" fill="#0F2A4A">EXPERTISE</text>

    <text x="24" y="140"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="21" font-weight="700" letter-spacing="2" fill="#475569">HOLDS</text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="22" fill="#334155">
      <tspan x="24" y="186">Knows the tool.</tspan>
      <tspan x="24" y="218">The vendor calls</tspan>
      <tspan x="24" y="250">this seat.</tspan>
    </text>

    <line x1="24" y1="316" x2="316" y2="316" stroke="#E2E8F0" stroke-width="1.4"/>

    <text x="24" y="366"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="21" font-weight="700" letter-spacing="2" fill="#475569">LACKS</text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="22" fill="#334155">
      <tspan x="24" y="412">Signing authority.</tspan>
      <tspan x="24" y="444">Voice in the next</tspan>
      <tspan x="24" y="476">purchase.</tspan>
    </text>
  </g>
</svg>
