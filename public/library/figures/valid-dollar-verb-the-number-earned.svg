<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Validity tells you which verb the number earned</title>
  <desc id="desc">Three rows ordered by the strength of the verb an impact number earns at the fourth inference link. No counterfactual earns supports. Contribution analysis, where rival explanations are tested and defeated, earns contributed to; this row is tinted because it is where most funders actually sit. A controlled comparison earns produced, with how far produced reaches depending on whether the design was matched, quasi-experimental, or randomized. Verb strength is encoded twice: colour darkens as the claim strengthens, and a three-step indicator shows one filled step, two, or three.</desc>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>

  <!-- title -->
  <text x="72" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#0F2A4A" letter-spacing="-0.5">The verb the number earned</text>
  <text x="72" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Everything below sits at link 4. Validity tells you how much weight the number can carry.</text>

  <!-- column headers -->
  <text x="104" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="2">EVIDENCE AT LINK 4 &#183; OURS, NOT ADJACENT</text>
  <text x="750" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="2">VERB IT EARNS</text>

  <!-- divider -->
  <line x1="72" y1="208" x2="1128" y2="208" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Row 1 — weakest: grey, one of three -->
  <g>
    <rect x="72" y="230" width="6" height="80" fill="#94A3B8"/>
    <text x="104" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A">No counterfactual</text>
    <text x="104" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">The outcome happened. Contribution is unexamined.</text>
    <text x="750" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" font-style="italic" fill="#64748B">supports</text>
    <text x="750" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">the number is consistent with the outcome</text>
    <rect x="1075" y="256" width="9" height="9" rx="2" fill="#94A3B8"/>
    <rect x="1089" y="256" width="9" height="9" rx="2" fill="#E2E8F0"/>
    <rect x="1103" y="256" width="9" height="9" rx="2" fill="#E2E8F0"/>
  </g>

  <line x1="72" y1="334" x2="1128" y2="334" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Row 2 — middle: teal, two of three. Tinted because this is where most funders sit. -->
  <rect x="72" y="348" width="1056" height="128" fill="#F0F9FF"/>
  <g>
    <rect x="72" y="360" width="6" height="80" fill="#0EA5E9"/>
    <text x="104" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F2A4A">Contribution analysis</text>
    <text x="104" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Story assembled; rival explanations tested and defeated (Mayne).</text>
    <text x="750" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" font-style="italic" fill="#0EA5E9">contributed to</text>
    <text x="750" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">the strongest verb no surviving rival can defeat</text>
    <rect x="1075" y="386" width="9" height="9" rx="2" fill="#0EA5E9"/>
    <rect x="1089" y="386" width="9" height="9" rx="2" fill="#0EA5E9"/>
    <rect x="1103" y="386" width="9" height="9" rx="2" fill="#E2E8F0"/>
    <text x="104" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0EA5E9" letter-spacing="1.5">WHERE MOST FUNDERS ACTUALLY SIT</text>
  </g>

  <line x1="72" y1="500" x2="1128" y2="500" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Row 3 — strongest: navy, three of three -->
  <g>
    <rect x="72" y="520" width="6" height="80" fill="#0F2A4A"/>
    <text x="104" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A">Controlled comparison</text>
    <text x="104" y="582" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Matched, quasi-experimental, or randomized.</text>
    <text x="750" y="564" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" font-style="italic" fill="#0F2A4A">produced</text>
    <text x="750" y="588" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">how far it reaches depends on which design</text>
    <rect x="1075" y="546" width="9" height="9" rx="2" fill="#0F2A4A"/>
    <rect x="1089" y="546" width="9" height="9" rx="2" fill="#0F2A4A"/>
    <rect x="1103" y="546" width="9" height="9" rx="2" fill="#0F2A4A"/>
  </g>
</svg>
