<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Validity tells you which verb the number earned</title>
  <desc id="desc">Three rows ordered by the strength of the verb an impact number earns. No counterfactual earns supports. Contribution analysis, where rival explanations are tested and defeated, earns contributed to; this row is emphasized because it is where most funders actually sit. A controlled comparison earns produced, with how far produced reaches depending on whether the design was matched, quasi-experimental, or randomized.</desc>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#FFFFFF"/>

  <!-- column headers -->
  <text x="104" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="2">EVIDENCE BEHIND THE CONTRIBUTION LINK</text>
  <text x="750" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="2">VERB IT EARNS</text>

  <!-- divider -->
  <line x1="72" y1="128" x2="1128" y2="128" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Row 1 -->
  <g>
    <rect x="72" y="158" width="6" height="80" fill="#CBD5E1"/>
    <text x="104" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A">No counterfactual</text>
    <text x="104" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">The outcome happened. Contribution is unexamined.</text>
    <text x="750" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" font-style="italic" fill="#0F2A4A">supports</text>
    <text x="750" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">the number is consistent with the outcome</text>
  </g>

  <line x1="72" y1="262" x2="1128" y2="262" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Row 2 — the load-bearing case, where most funders actually sit -->
  <rect x="72" y="284" width="1056" height="102" fill="#F8FAFC"/>
  <g>
    <rect x="72" y="292" width="6" height="80" fill="#0EA5E9"/>
    <text x="104" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A">Contribution analysis</text>
    <text x="104" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Story assembled; rival explanations tested and defeated (Mayne).</text>
    <text x="750" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="600" font-style="italic" fill="#0EA5E9">contributed to</text>
    <text x="750" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">the strongest verb no surviving rival can defeat</text>
  </g>

  <line x1="72" y1="408" x2="1128" y2="408" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Row 3 -->
  <g>
    <rect x="72" y="426" width="6" height="80" fill="#CBD5E1"/>
    <text x="104" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A">Controlled comparison</text>
    <text x="104" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Matched, quasi-experimental, or randomized.</text>
    <text x="750" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" font-style="italic" fill="#0F2A4A">produced</text>
    <text x="750" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">how far it reaches depends on which design</text>
  </g>
</svg>
