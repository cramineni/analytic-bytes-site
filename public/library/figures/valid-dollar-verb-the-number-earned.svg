<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Validity tells you which verb the number earned</title>
  <desc id="desc">Three rows ordered by the strength of the verb an impact number earns. No counterfactual earns supports. Contribution analysis, where rival explanations are tested and defeated, earns contributed to; this row is emphasized because it is where most funders actually sit. A controlled comparison earns produced, with how far produced reaches depending on whether the design was matched, quasi-experimental, or randomized.</desc>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>

  <!-- eyebrow -->
  <text x="72" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0EA5E9" letter-spacing="3">FIGURE &#183; THE VALID DOLLAR</text>

  <!-- title -->
  <text x="72" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#0F2A4A" letter-spacing="-0.5">The verb the number earned</text>
  <text x="72" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Validity tells you how much weight the number can carry.</text>

  <!-- column headers -->
  <text x="104" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="2">EVIDENCE BEHIND THE CONTRIBUTION LINK</text>
  <text x="750" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="2">VERB IT EARNS</text>

  <!-- divider -->
  <line x1="72" y1="228" x2="1128" y2="228" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Row 1 -->
  <g>
    <rect x="72" y="248" width="6" height="80" fill="#CBD5E1"/>
    <text x="104" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A">No counterfactual</text>
    <text x="104" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">The outcome happened. Contribution is unexamined.</text>
    <text x="750" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" font-style="italic" fill="#0F2A4A">supports</text>
    <text x="750" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">the number is consistent with the outcome</text>
  </g>

  <line x1="72" y1="352" x2="1128" y2="352" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Row 2 — the load-bearing case, where most funders actually sit -->
  <rect x="72" y="364" width="1056" height="102" fill="#F0F9FF"/>
  <g>
    <rect x="72" y="372" width="6" height="80" fill="#0EA5E9"/>
    <text x="104" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F2A4A">Contribution analysis</text>
    <text x="104" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Story assembled; rival explanations tested and defeated (Mayne).</text>
    <text x="750" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" font-style="italic" fill="#0EA5E9">contributed to</text>
    <text x="750" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">the strongest verb no surviving rival can defeat</text>
  </g>

  <line x1="72" y1="488" x2="1128" y2="488" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Row 3 -->
  <g>
    <rect x="72" y="506" width="6" height="80" fill="#CBD5E1"/>
    <text x="104" y="544" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F2A4A">Controlled comparison</text>
    <text x="104" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Matched, quasi-experimental, or randomized.</text>
    <text x="750" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" font-style="italic" fill="#0F2A4A">produced</text>
    <text x="750" y="574" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">how far it reaches depends on which design</text>
  </g>
</svg>
