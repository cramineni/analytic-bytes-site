<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">Success rate by share accepted, base rate 50%</title>
  <desc id="d">Two curves, with half of applicants able to succeed. A test with validity .50 yields 78 percent successful hires when the top 20 percent are accepted. A perfect test yields 77 percent when 65 percent are accepted, because it has to take people who will not succeed once it accepts more than half. Redrawn after Chart II of Taylor and Russell (1939); every plotted value matches their published table for a base rate of .50.</desc>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="56" font-size="33" font-weight="700" fill="#0F2A4A" text-anchor="middle">Success rate by share accepted, base rate 50%</text>
    <line x1="150" y1="590" x2="1110" y2="590" stroke="#0F2A4A" stroke-width="1.4"/>
    <line x1="150" y1="130" x2="150" y2="590" stroke="#0F2A4A" stroke-width="1.4"/>
    <line x1="246" y1="590" x2="246" y2="598" stroke="#94A3B8" stroke-width="1.2"/><text x="246" y="626" font-size="21" fill="#475569" text-anchor="middle">10%</text><line x1="342" y1="590" x2="342" y2="598" stroke="#94A3B8" stroke-width="1.2"/><text x="342" y="626" font-size="21" fill="#475569" text-anchor="middle">20%</text><line x1="438" y1="590" x2="438" y2="598" stroke="#94A3B8" stroke-width="1.2"/><text x="438" y="626" font-size="21" fill="#475569" text-anchor="middle">30%</text><line x1="534" y1="590" x2="534" y2="598" stroke="#94A3B8" stroke-width="1.2"/><text x="534" y="626" font-size="21" fill="#475569" text-anchor="middle">40%</text><line x1="630" y1="590" x2="630" y2="598" stroke="#94A3B8" stroke-width="1.2"/><text x="630" y="626" font-size="21" fill="#475569" text-anchor="middle">50%</text><line x1="726" y1="590" x2="726" y2="598" stroke="#94A3B8" stroke-width="1.2"/><text x="726" y="626" font-size="21" fill="#475569" text-anchor="middle">60%</text><line x1="822" y1="590" x2="822" y2="598" stroke="#94A3B8" stroke-width="1.2"/><text x="822" y="626" font-size="21" fill="#475569" text-anchor="middle">70%</text><line x1="918" y1="590" x2="918" y2="598" stroke="#94A3B8" stroke-width="1.2"/><text x="918" y="626" font-size="21" fill="#475569" text-anchor="middle">80%</text><line x1="1014" y1="590" x2="1014" y2="598" stroke="#94A3B8" stroke-width="1.2"/><text x="1014" y="626" font-size="21" fill="#475569" text-anchor="middle">90%</text>
    <line x1="142" y1="590" x2="150" y2="590" stroke="#94A3B8" stroke-width="1.2"/><text x="132" y="597" font-size="21" fill="#475569" text-anchor="end">50%</text><line x1="142" y1="498" x2="150" y2="498" stroke="#94A3B8" stroke-width="1.2"/><text x="132" y="505" font-size="21" fill="#475569" text-anchor="end">60%</text><line x1="142" y1="406" x2="150" y2="406" stroke="#94A3B8" stroke-width="1.2"/><text x="132" y="413" font-size="21" fill="#475569" text-anchor="end">70%</text><line x1="142" y1="314" x2="150" y2="314" stroke="#94A3B8" stroke-width="1.2"/><text x="132" y="321" font-size="21" fill="#475569" text-anchor="end">80%</text><line x1="142" y1="222" x2="150" y2="222" stroke="#94A3B8" stroke-width="1.2"/><text x="132" y="229" font-size="21" fill="#475569" text-anchor="end">90%</text><line x1="142" y1="130" x2="150" y2="130" stroke="#94A3B8" stroke-width="1.2"/><text x="132" y="137" font-size="21" fill="#475569" text-anchor="end">100%</text>
    <text x="630" y="664" font-size="21" fill="#475569" text-anchor="middle">Share of applicants accepted (selection ratio)</text>
    <text x="40" y="360" font-size="21" fill="#475569" text-anchor="middle" transform="rotate(-90 40 360)">Successful among those accepted</text>
    <polyline points="198.0,130.0 630.0,130.0 678.0,213.7 726.0,283.6 774.0,342.5 822.0,393.1 870.0,436.4 918.0,475.0 966.0,509.0 1014.0,538.5 1062.0,566.1" fill="none" stroke="#475569" stroke-width="2.4" stroke-dasharray="9 7"/>
    <polyline points="198.0,242.2 246.0,279.0 294.0,306.6 342.0,330.6 390.0,351.7 438.0,370.1 486.0,388.5 534.0,405.1 582.0,420.7 630.0,436.4 678.0,452.0 726.0,466.7 774.0,481.4 822.0,496.2 870.0,510.9 918.0,524.7 966.0,540.3 1014.0,555.0 1062.0,571.6" fill="none" stroke="#0F2A4A" stroke-width="2.6"/>
    <text x="851" y="374" font-size="22" fill="#475569">perfect validity</text>
    <text x="467" y="447" font-size="22" fill="#0F2A4A">validity .50</text>
    <circle cx="342.0" cy="330.6" r="9" fill="#0EA5E9"/>
    <text x="360" y="315" font-size="22" fill="#0F2A4A">top fifth: 78%</text>
    <circle cx="774.0" cy="342.5" r="9" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="2.4"/>
    <text x="792" y="329" font-size="22" fill="#0F2A4A">top two thirds: 77%</text>
    <text x="1110" y="704" font-size="18" fill="#94A3B8" text-anchor="end">Redrawn after Taylor and Russell's Chart II (1939). Every plotted point matches their published table for a base rate of .50.</text>
  </g>
</svg>
