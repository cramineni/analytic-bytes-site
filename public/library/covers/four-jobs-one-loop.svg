<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Field Note: Four jobs, one loop.</title>
<desc>White background with a navy line diagram. A box labeled design on the left forks by navy arrows into two boxes stacked to its right, operations and external claim, which converge by navy arrows into a box labeled revision on the far right. A dashed teal arc runs beneath from revision back to design, closing the loop. The teal return is the piece's move: the link from measurement revision back to measurement design, which org design keeps leaving unowned. Title and italic subtitle in sans-serif beneath. Analytic Bytes signature at the bottom.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>

<text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Field Note  ·  No. 16</text>

<defs>
  <marker id="navyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F2A4A"/>
  </marker>
  <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0EA5E9"/>
  </marker>
</defs>

<g transform="translate(600, 240)" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <!-- 1 design (left) -->
  <rect x="-300" y="-28" width="130" height="56" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
  <text x="-235" y="-6" text-anchor="middle" font-size="13" fill="#0F2A4A">1</text>
  <text x="-235" y="14" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">DESIGN</text>

  <!-- 2 operations (upper middle) -->
  <rect x="-65" y="-80" width="130" height="56" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
  <text x="0" y="-58" text-anchor="middle" font-size="13" fill="#0F2A4A">2</text>
  <text x="0" y="-38" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">OPERATIONS</text>

  <!-- 3 external claim (lower middle) -->
  <rect x="-65" y="24" width="130" height="56" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
  <text x="0" y="46" text-anchor="middle" font-size="13" fill="#0F2A4A">3</text>
  <text x="0" y="66" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">EXTERNAL CLAIM</text>

  <!-- 4 revision (right) -->
  <rect x="170" y="-28" width="130" height="56" fill="none" stroke="#0F2A4A" stroke-width="1.5" rx="3"/>
  <text x="235" y="-6" text-anchor="middle" font-size="13" fill="#0F2A4A">4</text>
  <text x="235" y="14" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">REVISION</text>

  <!-- fork 1 -> 2, 1 -> 3 -->
  <path d="M -170 0 L -120 0 L -120 -52 L -69 -52" fill="none" stroke="#0F2A4A" stroke-width="1.5" marker-end="url(#navyArrow)"/>
  <path d="M -120 0 L -120 52 L -69 52" fill="none" stroke="#0F2A4A" stroke-width="1.5" marker-end="url(#navyArrow)"/>
  <!-- merge 2 -> 4, 3 -> 4 -->
  <path d="M 65 -52 L 120 -52 L 120 0 L 166 0" fill="none" stroke="#0F2A4A" stroke-width="1.5" marker-end="url(#navyArrow)"/>
  <path d="M 65 52 L 120 52 L 120 0" fill="none" stroke="#0F2A4A" stroke-width="1.5"/>

  <!-- return 4 -> 1: the piece's move -->
  <path d="M 235 28 L 235 100 Q 235 116 219 116 L -219 116 Q -235 116 -235 100 L -235 34" fill="none" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#tealArrow)"/>
  <circle cx="0" cy="116" r="5" fill="#0EA5E9"/>
  <text x="0" y="142" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">THE RETURN NOBODY HOLDS</text>
</g>

<text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">Four jobs, one loop.</text>
<text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">Why measurement design, operational analysis, the external claim and measurement revision belong in one charter.</text>
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>
<text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  ·  2026</text>
</svg>
