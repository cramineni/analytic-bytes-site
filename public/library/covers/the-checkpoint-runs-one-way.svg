<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Field Note No. 17: The checkpoint runs one way.</title>
<desc>White background with a navy line-work diagram of two horizontal tracks, each carrying a dot travelling left to right toward an arrowhead. The upper navy track, labelled risk, passes through a solid gate drawn as two posts and a bar. The lower teal track, labelled benefit, passes through the same gate drawn only in dashes: the gate that is not there. Title and italic subtitle in sans-serif beneath, Analytic Bytes signature at the bottom.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>
<text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Field Note  ·  No. 17</text>
<g transform="translate(600, 235)">
<!-- risk track: the claim passes through a gate before it moves -->
<line x1="-280" y1="-50" x2="-24" y2="-50" stroke="#0F2A4A" stroke-width="1.5"/>
<line x1="24" y1="-50" x2="270" y2="-50" stroke="#0F2A4A" stroke-width="1.5"/>
<polyline points="262,-56 270,-50 262,-44" fill="none" stroke="#0F2A4A" stroke-width="1.5"/>
<circle cx="-200" cy="-50" r="3.5" fill="#0F2A4A"/>
<line x1="-16" y1="-84" x2="-16" y2="-16" stroke="#0F2A4A" stroke-width="1.6"/>
<line x1="16" y1="-84" x2="16" y2="-16" stroke="#0F2A4A" stroke-width="1.6"/>
<line x1="-16" y1="-84" x2="16" y2="-84" stroke="#0F2A4A" stroke-width="1.6"/>
<text x="300" y="-46" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#475569" text-anchor="start">risk</text>
<!-- benefit track: same journey, the gate drawn only in dashes. Teal is the move: the gate that is not there. -->
<line x1="-280" y1="60" x2="-24" y2="60" stroke="#0EA5E9" stroke-width="1.5"/>
<line x1="24" y1="60" x2="270" y2="60" stroke="#0EA5E9" stroke-width="1.5"/>
<polyline points="262,54 270,60 262,66" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
<circle cx="-200" cy="60" r="3.5" fill="#0EA5E9"/>
<line x1="-16" y1="26" x2="-16" y2="94" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="5 5"/>
<line x1="16" y1="26" x2="16" y2="94" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="5 5"/>
<line x1="-16" y1="26" x2="16" y2="26" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="5 5"/>
<text x="300" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#475569" text-anchor="start">benefit</text>
</g>
<text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">The checkpoint runs one way.</text>
<text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">Verification is becoming a condition of AI risk claims and still optional for benefit claims.</text>
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>
<text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  ·  2026</text>
</svg>