<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Field Note No. 13: Extending the gates</title>
<desc>White background with a small navy line diagram. Two lines diverge from a common origin on the left: the upper line stays level all the way across, ending in a teal filled dot marked "documented"; the lower line dashes downward across the same distance, ending in a small open circle marked "lowered". The level line is the discipline holding; the dashed line is the drift PDDS refuses. Title and italic subtitle in sans-serif beneath.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>

<!-- Eyebrow -->
<text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Field Note  ·  No. 13</text>

<!-- Motif: level line vs drifting line, small editorial illustration -->
<g transform="translate(600, 240)">

<!-- Origin point -->
<circle cx="-280" cy="0" r="5" fill="#0F2A4A"/>

<!-- Level line — the discipline holding -->
<line x1="-280" y1="0" x2="280" y2="0" stroke="#0F2A4A" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="280" cy="0" r="9" fill="#0EA5E9"/>

<!-- Drifting line — dashed, slate, drifting downward -->
<path d="M -280 0 Q -50 12, 280 58" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-dasharray="4 4" stroke-linecap="round"/>
<circle cx="280" cy="58" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>

<!-- Small labels at the endpoints -->
<text x="280" y="-18" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1" fill="#475569" text-anchor="middle">documented</text>
<text x="280" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-style="italic" letter-spacing="1" fill="#94A3B8" text-anchor="middle">lowered</text>

</g>

<!-- Title -->
<text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">Extending the gates.</text>

<!-- Subtitle -->
<text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">Revising the PDDS gates for survey data and continuous levers.</text>

<!-- Short divider -->
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>

<!-- Footer -->
<text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  ·  2026</text>

</svg>
