<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>JD scan: relative emphasis on three skill tiers across senior data role postings</title>
<desc>Three horizontal bars of equal length showing how three skill tiers are named in senior data role postings. Engineering tier is filled solid navy — named specifically. Domain / SME tier is filled slate — named abstractly. Governance and contract authoring tier is filled light slate — usually compliance-framed, thin on semantic and definitional authority. Bar fills mirror the role-map weight scale (Heavy, Medium, Light). Teal marks the governance tier as the narrative focus.</desc>
<rect width="1200" height="640" fill="#FFFFFF"/>

<text x="600" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">What the rubric names, how specifically</text>

<!-- Row 1: ENGINEERING TIER — Heavy fill -->
<g>
<text x="60" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#0F2A4A" text-anchor="start">ENGINEERING TIER</text>
<text x="60" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#475569" text-anchor="start">Snowflake, dbt, Fivetran, Python, SQL, Tableau — named tool by tool</text>
<rect x="60" y="168" width="960" height="40" fill="#0F2A4A"/>
<text x="1040" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1" fill="#475569" text-anchor="start">SPECIFIC</text>
</g>

<!-- Row 2: DOMAIN-SME TIER — Medium fill -->
<g>
<text x="60" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#0F2A4A" text-anchor="start">DOMAIN / SME TIER</text>
<text x="60" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#475569" text-anchor="start">&#8220;Stakeholder management,&#8221; &#8220;cross-functional collaboration&#8221; — named abstractly</text>
<rect x="60" y="310" width="960" height="40" fill="#475569"/>
<text x="1040" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1" fill="#475569" text-anchor="start">ABSTRACT</text>
</g>

<!-- Row 3: GOVERNANCE / CONTRACT AUTHORING TIER — Light fill, teal eyebrow -->
<g>
<text x="60" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#0EA5E9" text-anchor="start">GOVERNANCE / CONTRACT AUTHORING TIER</text>
<text x="60" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#475569" text-anchor="start">Who reads, who writes, on what cadence, with what authority —</text>
<text x="60" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#475569" text-anchor="start">usually compliance-framed, thin on semantic and definitional authority</text>
<rect x="60" y="480" width="960" height="40" fill="#94A3B8" opacity="0.5"/>
<text x="1040" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1" fill="#475569" text-anchor="start">LIGHT</text>
</g>

<line x1="560" y1="560" x2="640" y2="560" stroke="#94A3B8" stroke-width="1"/>
<text x="600" y="594" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#475569" text-anchor="middle">Pattern observed across senior data role postings, June 2026.</text>
<text x="600" y="622" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#475569" text-anchor="middle">Illustrative; bar fill mirrors the role-map weight scale (Heavy · Medium · Light).</text>
</svg>
