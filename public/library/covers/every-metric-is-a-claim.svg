<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <text x="600" y="90" text-anchor="middle" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9">Essay  ·  No. 21</text>

  <g transform="translate(600, 258)">
    <!-- the timeline -->
    <line x1="-300" y1="0" x2="300" y2="0" stroke="#0F2A4A" stroke-width="1.6"/>
    <!-- two evaluations -->
    <circle cx="-250" cy="0" r="9" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.6"/>
    <circle cx="250" cy="0" r="9" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.6"/>
    <text x="-250" y="34" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">EVALUATION</text>
    <text x="250" y="34" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">EVALUATION</text>
    <!-- the carried signal: warranted, then expired -->
    <path d="M -250 -10 C -180 -70, -40 -70, 40 -52" fill="none" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="6 5"/>
    <path d="M 40 -52 C 120 -34, 200 -14, 250 -10" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="2 5"/>
    <circle cx="40" cy="-52" r="6" fill="#0EA5E9"/>
    <text x="40" y="-72" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#0EA5E9">WARRANT EXPIRES</text>
    <text x="-110" y="-16" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">THE NUMBER</text>
    <!-- the decision, made in between -->
    <line x1="150" y1="-4" x2="150" y2="-30" stroke="#0F2A4A" stroke-width="1.4"/>
    <text x="150" y="-38" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">DECISION</text>
  </g>

  <text x="600" y="450" text-anchor="middle" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A">Every metric is a claim.</text>
  <text x="600" y="495" text-anchor="middle" font-size="18" font-style="italic" fill="#475569">What a dashboard number is allowed to say about an outcome, and for how long.</text>
  <line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>
  <text x="600" y="585" text-anchor="middle" font-size="13" letter-spacing="3" fill="#94A3B8">Analytic Bytes  ·  2026</text>
</svg>
