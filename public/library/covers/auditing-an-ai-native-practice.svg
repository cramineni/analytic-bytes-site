<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Field Note No. 12: Auditing an AI-native practice</title>
<desc>White background with a small navy line diagram. Four small nodes are arranged horizontally on a shared baseline: Data, Enterprise, Practitioner (highlighted as a filled teal disc — this piece's contribution), and Agent (a dashed circle marking the emerging fourth slice). A short arrow arcs from Practitioner to Agent, marking the transfer of instruments from operator-level governance to agent-level governance. Title and italic subtitle in sans-serif beneath.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>

<!-- Eyebrow -->
<text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Field Note  ·  No. 12</text>

<!-- Motif: four slices, one highlighted, arrow to emerging fourth -->
<g transform="translate(600, 240)">

<!-- Shared baseline connecting the four -->
<line x1="-270" y1="0" x2="270" y2="0" stroke="#0F2A4A" stroke-width="1.5" stroke-linecap="round"/>

<!-- Slice 1: Data (small navy dot) -->
<circle cx="-270" cy="0" r="8" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.6"/>
<text x="-270" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1" fill="#475569" text-anchor="middle">Data</text>

<!-- Slice 2: Enterprise -->
<circle cx="-90" cy="0" r="8" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.6"/>
<text x="-90" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1" fill="#475569" text-anchor="middle">Enterprise</text>

<!-- Slice 3: Practitioner — this piece's contribution, larger filled teal disc -->
<circle cx="90" cy="0" r="14" fill="#0EA5E9"/>
<text x="90" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1" font-weight="600" fill="#0F2A4A" text-anchor="middle">Practitioner</text>

<!-- Slice 4: Agent — emerging, dashed outline -->
<circle cx="270" cy="0" r="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="270" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-style="italic" letter-spacing="1" fill="#94A3B8" text-anchor="middle">Agent</text>

<!-- Arc from Practitioner to Agent — instruments transfer -->
<path d="M 106 -8 Q 180 -42, 258 -12" stroke="#0EA5E9" stroke-width="1.4" fill="none" stroke-linecap="round"/>
<polygon points="258,-12 250,-16 251,-8" fill="#0EA5E9"/>
<text x="182" y="-46" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-style="italic" letter-spacing="1" fill="#0EA5E9" text-anchor="middle">instruments transfer</text>

</g>

<!-- Title -->
<text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">Auditing an AI-native practice.</text>

<!-- Subtitle -->
<text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">Ninety days, one operator, and measurement-validity discipline.</text>

<!-- Short divider -->
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>

<!-- Footer -->
<text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  ·  2026</text>

</svg>
