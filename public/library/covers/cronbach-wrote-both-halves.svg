<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title>Essay No. 25: Cronbach wrote both halves.</title>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <text x="600" y="90" text-anchor="middle" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9">Essay  ·  No. 25</text>

  <g transform="translate(600, 238)">
    <!-- banks -->
    <line x1="-300" y1="70" x2="-262" y2="70" stroke="#0F2A4A" stroke-width="1.6"/>
    <line x1="262" y1="70" x2="300" y2="70" stroke="#0F2A4A" stroke-width="1.6"/>
    <rect x="-276" y="-4" width="14" height="74" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5"/>
    <rect x="262" y="-4" width="14" height="74" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5"/>
    <!-- the benchmark's half: built -->
    <line x1="-262" y1="0" x2="-4" y2="0" stroke="#0F2A4A" stroke-width="1.6"/>
    <path d="M -262 70 Q -131 -14 -4 70" fill="none" stroke="#0F2A4A" stroke-width="1.5"/>
    <line x1="-196" y1="0" x2="-196" y2="38" stroke="#0F2A4A" stroke-width="1.2"/>
    <line x1="-131" y1="0" x2="-131" y2="28" stroke="#0F2A4A" stroke-width="1.2"/>
    <line x1="-66" y1="0" x2="-66" y2="38" stroke="#0F2A4A" stroke-width="1.2"/>
    <!-- the adopter's half: the piece's move, only the adopter can finish it -->
    <line x1="4" y1="0" x2="262" y2="0" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="7 6"/>
    <path d="M 4 70 Q 131 -14 262 70" fill="none" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="7 6"/>
    <circle cx="0" cy="0" r="5" fill="#0EA5E9"/>
    <!-- labels -->
    <text x="-150" y="100" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="#475569">WHAT THE SCORE MEANS</text>
    <text x="150" y="100" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="#475569">WHAT THE DECISION NEEDS</text>
  </g>

  <text x="600" y="450" text-anchor="middle" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A">Cronbach wrote both halves.</text>
  <text x="600" y="495" text-anchor="middle" font-size="18" font-style="italic" fill="#475569">A benchmark can build only half the bridge.</text>
  <line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>
  <text x="600" y="585" text-anchor="middle" font-size="13" letter-spacing="3" fill="#94A3B8">Analytic Bytes  ·  2026</text>
</svg>
