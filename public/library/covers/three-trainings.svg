<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Essay No. 18: Three trainings, three questions.</title>
<desc>White background with a navy line-work mark — three identical squares in a row, each with a small dot floating above it representing the claim that training is asked to support. The first two dots connect down to their squares with solid navy lines. The third dot is teal and its connector is dashed, marking the step that cannot be verified by watching the system run. Small slate labels beneath read Will it run, Will it return, Is it supportable. Title and italic slate subtitle in sans-serif beneath, Analytic Bytes signature at the bottom.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>
<text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Essay  ·  No. 18</text>
<g transform="translate(600, 260)">

  <circle cx="-170" cy="-70" r="4" fill="#0F2A4A"/>
  <line x1="-170" y1="-63" x2="-170" y2="-31" stroke="#0F2A4A" stroke-width="1.5"/>
  <rect x="-192" y="-26" width="44" height="44" fill="none" stroke="#0F2A4A" stroke-width="1.5"/>
  <text x="-170" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="1.2" fill="#475569" text-anchor="middle">Will it run</text>

  <circle cx="0" cy="-70" r="4" fill="#0F2A4A"/>
  <line x1="0" y1="-63" x2="0" y2="-31" stroke="#0F2A4A" stroke-width="1.5"/>
  <rect x="-22" y="-26" width="44" height="44" fill="none" stroke="#0F2A4A" stroke-width="1.5"/>
  <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="1.2" fill="#475569" text-anchor="middle">Will it return</text>

  <circle cx="170" cy="-70" r="4" fill="#0EA5E9"/>
  <line x1="170" y1="-63" x2="170" y2="-31" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="148" y="-26" width="44" height="44" fill="none" stroke="#0F2A4A" stroke-width="1.5"/>
  <text x="170" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="1.2" fill="#475569" text-anchor="middle">Is it supportable</text>

</g>
<text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">Three trainings, three questions.</text>
<text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">Why the third question becomes non-optional once an output is used as evidence.</text>
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>
<text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  ·  2026</text>
</svg>
