<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Essay  ·  No. 21</text>

  <g transform="translate(600, 245)">
    <path d="M -280 45 L -190 45 L -190 20 L -100 20 L -100 -5 L -10 -5 L -10 -30 L 80 -30 L 80 -55 L 180 -55 L 180 -80 L 280 -80" fill="none" stroke="#0F2A4A" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="-280" y1="45" x2="280" y2="45" stroke="#0F2A4A" stroke-width="1.6"/>

    <line x1="-100" y1="45" x2="-100" y2="20" stroke="#0EA5E9" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="-10" y1="45" x2="-10" y2="-5" stroke="#0EA5E9" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="80" y1="45" x2="80" y2="-30" stroke="#0EA5E9" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="180" y1="45" x2="180" y2="-55" stroke="#0EA5E9" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="280" y1="45" x2="280" y2="-80" stroke="#0EA5E9" stroke-width="1.4" stroke-dasharray="4 4"/>
    <circle cx="280" cy="-80" r="4" fill="#0EA5E9"/>

    <text x="90" y="-96" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1.8" fill="#475569" text-anchor="middle">THE WORLD</text>
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1.8" fill="#475569" text-anchor="middle">THE CONFIGURATION</text>
  </g>

  <text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">The delta nobody budgeted.</text>

  <text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">Keeping a system matched to a moving world has never been anyone&#8217;s job.</text>

  <line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>

  <text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  ·  2026</text>
</svg>
