<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Essay No. 24: The decision chain.</title><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">The decision chain.</title>
  <desc id="d">Six small nodes in a row, labelled construct, representation, inference, decision, action and consequence. The decision node is filled teal. A dashed teal arc runs from consequence back over the row to construct, labelled the return leg.</desc>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <text x="600" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9">Essay  ·  No. 24</text>
  <g transform="translate(600, 265)" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <!-- return leg -->
    <path d="M 275 -16 C 200 -120, -200 -120, -275 -16" fill="none" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="5 5"/>
    <path d="M -282 -27 L -275 -15 L -267 -26" fill="none" stroke="#0EA5E9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="-102" text-anchor="middle" font-size="11" letter-spacing="1.6" fill="#475569">THE RETURN LEG</text>
    <!-- links -->
    <g stroke="#0F2A4A" stroke-width="1.5">
      <line x1="-265" y1="0" x2="-175" y2="0"/>
      <line x1="-155" y1="0" x2="-65" y2="0"/>
      <line x1="-45" y1="0" x2="45" y2="0"/>
      <line x1="65" y1="0" x2="155" y2="0"/>
      <line x1="175" y1="0" x2="265" y2="0"/>
    </g>
    <!-- nodes -->
    <g stroke="#0F2A4A" stroke-width="1.6" fill="#FFFFFF">
      <circle cx="-275" cy="0" r="10"/>
      <circle cx="-165" cy="0" r="10"/>
      <circle cx="-55" cy="0" r="10"/>
      <circle cx="165" cy="0" r="10"/>
      <circle cx="275" cy="0" r="10"/>
    </g>
    <circle cx="55" cy="0" r="10" fill="#0EA5E9" stroke="#0EA5E9" stroke-width="1.6"/>
    <!-- labels -->
    <g font-size="11" letter-spacing="1.2" fill="#475569" text-anchor="middle">
      <text x="-275" y="34">construct</text>
      <text x="-165" y="34">representation</text>
      <text x="-55" y="34">inference</text>
      <text x="55" y="34">decision</text>
      <text x="165" y="34">action</text>
      <text x="275" y="34">consequence</text>
    </g>
  </g>
  <text x="600" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A">The decision chain.</text>
  <text x="600" y="495" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569">Part two of The Decision System, from construct to consequence and back.</text>
  <line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>
  <text x="600" y="585" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8">Analytic Bytes  ·  2026</text>
</svg>
