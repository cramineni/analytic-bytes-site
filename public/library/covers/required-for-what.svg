<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ct cd">
<title id="ct">Required for what?</title>
<desc id="cd">Two boxes of the same size sit side by side in navy outline. The left one is labelled requirements and is filled with three full rows of small navy dots, the enumerated items the document asks for. A short navy arrow runs from it to the right-hand box, labelled decision scope. That box holds one row of navy dots, roughly a third of what the left box holds, because about a third of these postings name a decision the role may make. Where its other two rows would sit there are dashed teal lines. The arrow carries the title's question; the dashed lines are what is not written down.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">

<text x="600" y="90" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Essay  &#183;  No. 17</text>

<g transform="translate(600, 245)">

  <text x="-150" y="-56" font-size="10" letter-spacing="1.6" fill="#475569" text-anchor="middle">REQUIREMENTS</text>
  <rect x="-250" y="-40" width="200" height="80" rx="4" fill="none" stroke="#0F2A4A" stroke-width="1.4"/>

  <g fill="#0F2A4A">
    <circle cx="-234" cy="-18" r="2.5"/><circle cx="-217" cy="-18" r="2.5"/><circle cx="-200" cy="-18" r="2.5"/><circle cx="-183" cy="-18" r="2.5"/><circle cx="-166" cy="-18" r="2.5"/><circle cx="-149" cy="-18" r="2.5"/><circle cx="-132" cy="-18" r="2.5"/><circle cx="-115" cy="-18" r="2.5"/><circle cx="-98" cy="-18" r="2.5"/><circle cx="-81" cy="-18" r="2.5"/><circle cx="-64" cy="-18" r="2.5"/>
    <circle cx="-234" cy="0" r="2.5"/><circle cx="-217" cy="0" r="2.5"/><circle cx="-200" cy="0" r="2.5"/><circle cx="-183" cy="0" r="2.5"/><circle cx="-166" cy="0" r="2.5"/><circle cx="-149" cy="0" r="2.5"/><circle cx="-132" cy="0" r="2.5"/><circle cx="-115" cy="0" r="2.5"/><circle cx="-98" cy="0" r="2.5"/><circle cx="-81" cy="0" r="2.5"/><circle cx="-64" cy="0" r="2.5"/>
    <circle cx="-234" cy="18" r="2.5"/><circle cx="-217" cy="18" r="2.5"/><circle cx="-200" cy="18" r="2.5"/><circle cx="-183" cy="18" r="2.5"/><circle cx="-166" cy="18" r="2.5"/><circle cx="-149" cy="18" r="2.5"/><circle cx="-132" cy="18" r="2.5"/><circle cx="-115" cy="18" r="2.5"/><circle cx="-98" cy="18" r="2.5"/><circle cx="-81" cy="18" r="2.5"/><circle cx="-64" cy="18" r="2.5"/>
  </g>

  <line x1="-38" y1="0" x2="30" y2="0" stroke="#0F2A4A" stroke-width="1.3"/>
  <path d="M 42 0 L 30 -5 L 30 5 Z" fill="#0F2A4A"/>

  <text x="150" y="-56" font-size="10" letter-spacing="1.6" fill="#475569" text-anchor="middle">DECISION SCOPE</text>
  <rect x="50" y="-40" width="200" height="80" rx="4" fill="none" stroke="#0F2A4A" stroke-width="1.4"/>

  <g fill="#0F2A4A">
    <circle cx="66" cy="-18" r="2.5"/><circle cx="83" cy="-18" r="2.5"/><circle cx="100" cy="-18" r="2.5"/><circle cx="117" cy="-18" r="2.5"/><circle cx="134" cy="-18" r="2.5"/><circle cx="151" cy="-18" r="2.5"/><circle cx="168" cy="-18" r="2.5"/><circle cx="185" cy="-18" r="2.5"/><circle cx="202" cy="-18" r="2.5"/><circle cx="219" cy="-18" r="2.5"/><circle cx="236" cy="-18" r="2.5"/>
  </g>

  <line x1="66" y1="0" x2="236" y2="0" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="66" y1="18" x2="236" y2="18" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="5 4"/>

</g>

<text x="600" y="450" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">Required for what?</text>
<text x="600" y="495" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">Forty-two of sixty-five senior data postings require attributes and name no decision.</text>
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>
<text x="600" y="585" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  &#183;  2026</text>

</g>
</svg>
