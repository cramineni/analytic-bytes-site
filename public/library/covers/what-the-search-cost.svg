<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Field Note No. 14: What the search cost</title>
<desc>White background with a small navy line diagram. A loose cluster of small navy dots on the left feeds a short line into a vertical navy bar marked "screen". From the bar, one solid navy line rises to a filled navy dot labelled "measured". Three slate dashed lines fall away from the same bar and end at an empty teal dashed circle labelled "no record". The upper path has an endpoint that holds something; the lower path, carrying more lines, ends in nothing. Title and italic subtitle in sans-serif beneath.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>

<!-- Eyebrow -->
<text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Field Note  ·  No. 14</text>

<!-- Motif: pool -> screen -> one measured endpoint, one empty one -->
<g transform="translate(600, 240)">

<!-- Applicant pool -->
<circle cx="-296" cy="-30" r="3.5" fill="#0F2A4A"/>
<circle cx="-268" cy="-42" r="3.5" fill="#0F2A4A"/>
<circle cx="-262" cy="-12" r="3.5" fill="#0F2A4A"/>
<circle cx="-292" cy="4" r="3.5" fill="#0F2A4A"/>
<circle cx="-272" cy="26" r="3.5" fill="#0F2A4A"/>
<circle cx="-300" cy="38" r="3.5" fill="#0F2A4A"/>
<circle cx="-244" cy="8" r="3.5" fill="#0F2A4A"/>
<circle cx="-248" cy="-32" r="3.5" fill="#0F2A4A"/>
<circle cx="-278" cy="-2" r="3.5" fill="#0F2A4A"/>

<!-- Feed into the screen -->
<line x1="-232" y1="0" x2="-170" y2="0" stroke="#0F2A4A" stroke-width="1.6" stroke-linecap="round"/>

<!-- The screen -->
<line x1="-170" y1="-58" x2="-170" y2="58" stroke="#0F2A4A" stroke-width="1.6" stroke-linecap="round"/>
<text x="-170" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1.4" fill="#475569" text-anchor="middle">screen</text>

<!-- Hired path: one solid line to an endpoint that holds something -->
<path d="M -170 -20 C -40 -20, 80 -58, 208 -58" stroke="#0F2A4A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<circle cx="216" cy="-58" r="7" fill="#0F2A4A"/>
<text x="216" y="-78" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1" fill="#475569" text-anchor="middle">measured</text>

<!-- Rejected paths: more lines, ending in nothing -->
<path d="M -170 12 C -40 12, 80 34, 202 40" stroke="#94A3B8" stroke-width="1.4" fill="none" stroke-dasharray="4 5" stroke-linecap="round"/>
<path d="M -170 26 C -40 26, 80 50, 202 56" stroke="#94A3B8" stroke-width="1.4" fill="none" stroke-dasharray="4 5" stroke-linecap="round"/>
<path d="M -170 40 C -40 40, 80 66, 202 72" stroke="#94A3B8" stroke-width="1.4" fill="none" stroke-dasharray="4 5" stroke-linecap="round"/>
<circle cx="216" cy="56" r="13" fill="none" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="3 4"/>
<text x="216" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1" fill="#0EA5E9" text-anchor="middle">no record</text>

</g>

<!-- Title -->
<text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">What the search cost.</text>

<!-- Subtitle -->
<text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">Hiring is a high-stakes assessment with no consequential validity argument.</text>

<!-- Short divider -->
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>

<!-- Footer -->
<text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  ·  2026</text>

</svg>
