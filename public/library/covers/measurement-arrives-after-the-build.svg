<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ct cd" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Field Note No. 19: When measurement arrives after the build.</title><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ct">When measurement arrives after the build.</title>
  <desc id="cd">A timeline. A navy block marked build, then a pilot drawn as five events, three filled and two hollow, then a teal box marked measurement at the far end. Dashed teal lines reach back from measurement to the three filled events only; the two hollow events were never recorded and cannot be reached.</desc>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <text x="600" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9">Field Note  ·  No. 19</text>
  <g transform="translate(600, 250)" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <line x1="-300" y1="40" x2="300" y2="40" stroke="#0F2A4A" stroke-width="1.5"/>
    <rect x="-290" y="12" width="150" height="28" fill="none" stroke="#0F2A4A" stroke-width="1.6"/>
    <text x="-215" y="68" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">BUILD</text>
    <g stroke="#0F2A4A" stroke-width="1.6">
      <circle cx="-100" cy="26" r="7" fill="#0F2A4A"/>
      <circle cx="-55" cy="26" r="7" fill="#FFFFFF"/>
      <circle cx="-10" cy="26" r="7" fill="#0F2A4A"/>
      <circle cx="35" cy="26" r="7" fill="#FFFFFF"/>
      <circle cx="80" cy="26" r="7" fill="#0F2A4A"/>
    </g>
    <text x="-10" y="68" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">PILOT</text>
    <g fill="none" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M160,14 Q 30,-95 -100,16"/>
      <path d="M160,14 Q 75,-60 -10,16"/>
      <path d="M160,14 Q 120,-30 80,16"/>
    </g>
    <rect x="160" y="6" width="130" height="34" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.6"/>
    <text x="225" y="68" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#475569">MEASUREMENT</text>
  </g>
  <text x="600" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A">When measurement arrives after the build.</text>
  <text x="600" y="495" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569">The first pilot happens once.</text>
  <line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>
  <text x="600" y="585" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8">Analytic Bytes  ·  2026</text>
</svg>
