<svg viewBox="0 0 1200 940" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The data role landscape: senior data-leadership roles distributed across the decision arc</title>
<desc>A grid where columns represent the five stages of the decision arc — build the system, govern the system, interpret the signal, support the decision, own the decision — and rows are seven senior data-leadership titles. Fill intensity per cell shows how heavily each role loads each arc stage. A teal composite band shows the impossible role many JDs imply, heavy across every arc position.</desc>

<rect width="1200" height="940" fill="#FFFFFF"/>

<!-- Title -->
<text x="600" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#0F2A4A" text-anchor="middle">The data role landscape</text>

<!-- Arc direction labels above column headers -->
<text x="480" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="start">FAR FROM DECISION</text>
<text x="1160" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#0EA5E9" text-anchor="end">CLOSE TO DECISION</text>

<!-- Arc arrow spanning columns -->
<line x1="480" y1="126" x2="1152" y2="126" stroke="#94A3B8" stroke-width="1"/>
<polygon points="1152,122 1160,126 1152,130" fill="#94A3B8"/>

<!-- Column headers (arc stages) -->
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" fill="#0F2A4A" text-anchor="middle">
  <text x="548" y="160" font-size="22" letter-spacing="1.2">BUILD</text>
  <text x="548" y="188" font-size="22" font-weight="500" fill="#475569">the system</text>
  <text x="684" y="160" font-size="22" letter-spacing="1.2">GOVERN</text>
  <text x="684" y="188" font-size="22" font-weight="500" fill="#475569">the system</text>
  <text x="820" y="160" font-size="22" letter-spacing="1.2">INTERPRET</text>
  <text x="820" y="188" font-size="22" font-weight="500" fill="#475569">the signal</text>
  <text x="956" y="160" font-size="22" letter-spacing="1.2">SUPPORT</text>
  <text x="956" y="188" font-size="22" font-weight="500" fill="#475569">the decision</text>
  <text x="1092" y="160" font-size="22" letter-spacing="1.2">OWN</text>
  <text x="1092" y="188" font-size="22" font-weight="500" fill="#475569">the decision</text>
</g>

<line x1="60" y1="204" x2="1160" y2="204" stroke="#94A3B8" stroke-width="1"/>

<!-- Row 1: Director of Data Systems -->
<text x="465" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="end">Director of Data Systems</text>
<rect x="480" y="214" width="136" height="52" fill="#0F2A4A"/>
<rect x="616" y="214" width="136" height="52" fill="#475569"/>
<rect x="752" y="214" width="136" height="52" fill="#94A3B8" opacity="0.3"/>
<rect x="888" y="214" width="136" height="52" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.35"/>
<rect x="1024" y="214" width="136" height="52" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.35"/>

<!-- Row 2: Director of Data Platforms -->
<text x="465" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="end">Director of Data Platforms</text>
<rect x="480" y="276" width="136" height="52" fill="#0F2A4A"/>
<rect x="616" y="276" width="136" height="52" fill="#94A3B8" opacity="0.3"/>
<rect x="752" y="276" width="136" height="52" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.35"/>
<rect x="888" y="276" width="136" height="52" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.35"/>
<rect x="1024" y="276" width="136" height="52" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.35"/>

<!-- Row 3: Director of Data Analytics + Engineering (wrapped to two lines) -->
<text x="465" y="361" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="end">Director of Data Analytics</text>
<text x="465" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="end">+ Engineering</text>
<rect x="480" y="338" width="136" height="52" fill="#475569"/>
<rect x="616" y="338" width="136" height="52" fill="#94A3B8" opacity="0.3"/>
<rect x="752" y="338" width="136" height="52" fill="#0F2A4A"/>
<rect x="888" y="338" width="136" height="52" fill="#475569"/>
<rect x="1024" y="338" width="136" height="52" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.35"/>

<!-- Row 4: Director of AI Transformation -->
<text x="465" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="end">Director of AI Transformation</text>
<rect x="480" y="400" width="136" height="52" fill="#475569"/>
<rect x="616" y="400" width="136" height="52" fill="#475569"/>
<rect x="752" y="400" width="136" height="52" fill="#475569"/>
<rect x="888" y="400" width="136" height="52" fill="#475569"/>
<rect x="1024" y="400" width="136" height="52" fill="#94A3B8" opacity="0.5"/>

<!-- Row 5: Director of Data Governance -->
<text x="465" y="493" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="end">Director of Data Governance</text>
<rect x="480" y="462" width="136" height="52" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.35"/>
<rect x="616" y="462" width="136" height="52" fill="#0F2A4A"/>
<rect x="752" y="462" width="136" height="52" fill="#475569"/>
<rect x="888" y="462" width="136" height="52" fill="#475569"/>
<rect x="1024" y="462" width="136" height="52" fill="#94A3B8" opacity="0.5"/>

<!-- Row 6: Director of MEL / Impact Measurement -->
<text x="465" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="end">Director of MEL</text>
<text x="465" y="574" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="end">/ Impact Measurement</text>
<rect x="480" y="524" width="136" height="52" fill="#94A3B8" opacity="0.3"/>
<rect x="616" y="524" width="136" height="52" fill="#475569"/>
<rect x="752" y="524" width="136" height="52" fill="#0F2A4A"/>
<rect x="888" y="524" width="136" height="52" fill="#0F2A4A"/>
<rect x="1024" y="524" width="136" height="52" fill="#475569"/>

<!-- Row 7: Enterprise Data & AI Executive -->
<text x="465" y="613" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#0F2A4A" text-anchor="end">Enterprise Data &amp; AI Executive</text>
<text x="465" y="639" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#94A3B8" text-anchor="end">CDO · CDAO · VP Data &amp; AI</text>
<rect x="480" y="586" width="136" height="52" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.35"/>
<rect x="616" y="586" width="136" height="52" fill="#475569"/>
<rect x="752" y="586" width="136" height="52" fill="#94A3B8" opacity="0.3"/>
<rect x="888" y="586" width="136" height="52" fill="#475569"/>
<rect x="1024" y="586" width="136" height="52" fill="#0F2A4A"/>

<!-- Separator -->
<line x1="60" y1="672" x2="1160" y2="672" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>

<!-- Composite role band — navy cells with white cell dividers, teal label signals framing -->
<text x="465" y="723" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0EA5E9" text-anchor="end">The composite role many JDs imply</text>
<text x="465" y="753" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-style="italic" fill="#475569" text-anchor="end">heavy at every arc position — the shape no real role fits</text>
<rect x="480" y="696" width="136" height="60" fill="#0F2A4A" stroke="#FFFFFF" stroke-width="2"/>
<rect x="616" y="696" width="136" height="60" fill="#0F2A4A" stroke="#FFFFFF" stroke-width="2"/>
<rect x="752" y="696" width="136" height="60" fill="#0F2A4A" stroke="#FFFFFF" stroke-width="2"/>
