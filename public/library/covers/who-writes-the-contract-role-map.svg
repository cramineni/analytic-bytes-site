  <text x="304" y="877">Medium</text>
  <rect x="440" y="850" width="52" height="34" fill="#94A3B8" opacity="0.5" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="504" y="877">Light</text>
  <rect x="600" y="850" width="52" height="34" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" stroke-opacity="0.6"/>
