<rect x="1024" y="696" width="136" height="60" fill="#0F2A4A" stroke="#FFFFFF" stroke-width="2"/>

<!-- Legend -->
<text x="60" y="820" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1.5" fill="#94A3B8">DEPTH OF INVOLVEMENT</text>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#475569">
  <rect x="60" y="850" width="52" height="34" fill="#0F2A4A" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.4"/>
