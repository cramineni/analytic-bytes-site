<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Essay No. 11: The valid dollar</title>
<desc>White background. A small chain diagram in navy line work: four inference links from left to right, with the third link — the weakest — highlighted in teal. Small dollar-sign glyph at the terminus. Title and subtitle in sans-serif beneath.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>

<!-- Eyebrow -->
<text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Essay  &#183;  No. 11</text>

<!-- Diagram — inference chain with weakest link highlighted -->
<g transform="translate(600, 240)">
  <!-- Chain track -->
  <line x1="-240" y1="0" x2="240" y2="0" stroke="#0F2A4A" stroke-width="1.4"/>

  <!-- Four link nodes -->
  <circle cx="-180" cy="0" r="10" fill="#0F2A4A"/>
  <circle cx="-60"  cy="0" r="10" fill="#0F2A4A"/>
  <!-- The weak link, highlighted teal -->
  <circle cx="60"   cy="0" r="14" fill="#0EA5E9"/>
  <circle cx="60"   cy="0" r="22" fill="none" stroke="#0EA5E9" stroke-width="1.4" stroke-dasharray="3 4"/>
  <circle cx="180"  cy="0" r="10" fill="#0F2A4A"/>

  <!-- Terminus dollar glyph -->
  <text x="180" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">$</text>

  <!-- Link labels below -->
  <text x="-180" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1" fill="#94A3B8" text-anchor="middle">measure</text>
  <text x="-60"  y="36" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1" fill="#94A3B8" text-anchor="middle">real</text>
  <text x="60"   y="46" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1" fill="#0EA5E9" text-anchor="middle" font-weight="600">weakest link</text>
  <text x="180"  y="36" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1" fill="#94A3B8" text-anchor="middle">act</text>
</g>

<!-- Title -->
<text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="500" fill="#0F2A4A" text-anchor="middle">The valid dollar.</text>

<!-- Subtitle -->
<text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">A validity gate for the impact numbers we report.</text>

<!-- Divider + footer -->
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>
<text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  &#183;  2026</text>
</svg>
