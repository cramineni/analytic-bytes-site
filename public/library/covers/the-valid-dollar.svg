<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Essay No. 14: The valid dollar</title>
<desc>White background with a small navy line diagram. Four vertical bars stand in a row on a shared baseline. Three are tall navy bars — strong inferences. One is a short teal bar — the weakest inference. A dashed horizontal line runs across the diagram at the height of the shortest bar, showing where the verdict caps: the score is the minimum of the four, never the average. Title and italic subtitle in sans-serif beneath.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>

<!-- Eyebrow -->
<text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Essay  ·  No. 14</text>

<!-- Motif: min-bar chart — 4 bars, one short (weakest), horizontal verdict line at short-bar height -->
<g transform="translate(600, 275)">

<!-- Baseline -->
<line x1="-160" y1="0" x2="160" y2="0" stroke="#0F2A4A" stroke-width="1.2" stroke-linecap="round"/>

<!-- Bar 1: tall navy (strong) -->
<rect x="-140" y="-90" width="20" height="90" fill="#0F2A4A"/>

<!-- Bar 2: tall navy (strong) -->
<rect x="-60" y="-100" width="20" height="100" fill="#0F2A4A"/>

<!-- Bar 3: SHORT teal (weakest) -->
<rect x="20" y="-35" width="20" height="35" fill="#0EA5E9"/>

<!-- Bar 4: tall navy (strong) -->
<rect x="100" y="-80" width="20" height="80" fill="#0F2A4A"/>

<!-- Dashed verdict line at the height of the shortest bar -->
<line x1="-170" y1="-35" x2="170" y2="-35" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>

<!-- Small verdict label at the right end of the dashed line -->
<text x="178" y="-31" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#0EA5E9" text-anchor="start">verdict</text>

<!-- Scoring rule label beneath the baseline -->
<text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-style="italic" letter-spacing="1" fill="#475569" text-anchor="middle">the score is the minimum, never the average</text>

</g>

<!-- Title -->
<text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">The valid dollar.</text>

<!-- Subtitle -->
<text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">A validity gate for Dollars in Pockets and the impact numbers that follow.</text>

<!-- Short divider -->
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>

<!-- Footer -->
<text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  ·  2026</text>

</svg>
