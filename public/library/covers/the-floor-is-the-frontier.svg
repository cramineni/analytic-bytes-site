<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Field Note No. 15: The Floor Is the Frontier</title>
<desc>White background with a navy line-work diagram of two horizontal lines. A navy ceiling line near the top carries a few navy dots and a small navy up-arrow — frontier-first work raising the ceiling for the few already near it. Below, a dashed slate old-floor line and, raised above it in teal, a new solid floor with teal up-arrows lifting it and teal dots spread across it — the many, the floor rising. Title and italic subtitle in sans-serif beneath, Analytic Bytes signature at the bottom.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>
<text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Field Note  ·  No. 15</text>
<g transform="translate(600, 235)">
<!-- ceiling: the frontier, raised for the few already near it -->
<line x1="-280" y1="-62" x2="280" y2="-62" stroke="#0F2A4A" stroke-width="1.5"/>
<circle cx="-150" cy="-62" r="3.5" fill="#0F2A4A"/>
<circle cx="-70" cy="-62" r="3.5" fill="#0F2A4A"/>
<circle cx="70" cy="-62" r="3.5" fill="#0F2A4A"/>
<circle cx="150" cy="-62" r="3.5" fill="#0F2A4A"/>
<!-- frontier-first up-arrow, pushing the ceiling higher -->
<line x1="0" y1="-72" x2="0" y2="-104" stroke="#0F2A4A" stroke-width="1.5"/>
<polyline points="-6,-97 0,-104 6,-97" fill="none" stroke="#0F2A4A" stroke-width="1.5"/>
<text x="240" y="-70" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#475569" text-anchor="middle">ceiling</text>
<!-- old floor: the baseline as it was -->
<line x1="-280" y1="82" x2="280" y2="82" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 5"/>
<!-- the many, lifting: teal is the move -->
<line x1="-180" y1="78" x2="-180" y2="40" stroke="#0EA5E9" stroke-width="1.5"/>
<polyline points="-186,47 -180,40 -174,47" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
<line x1="-90" y1="78" x2="-90" y2="40" stroke="#0EA5E9" stroke-width="1.5"/>
<polyline points="-96,47 -90,40 -84,47" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
<line x1="0" y1="78" x2="0" y2="40" stroke="#0EA5E9" stroke-width="1.5"/>
<polyline points="-6,47 0,40 6,47" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
<line x1="90" y1="78" x2="90" y2="40" stroke="#0EA5E9" stroke-width="1.5"/>
<polyline points="84,47 90,40 96,47" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
<line x1="180" y1="78" x2="180" y2="40" stroke="#0EA5E9" stroke-width="1.5"/>
<polyline points="174,47 180,40 186,47" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
<!-- new floor: raised, solid, teal -->
<line x1="-280" y1="30" x2="280" y2="30" stroke="#0EA5E9" stroke-width="2"/>
<circle cx="-180" cy="30" r="4" fill="#0EA5E9"/>
<circle cx="-90" cy="30" r="4" fill="#0EA5E9"/>
<circle cx="0" cy="30" r="4" fill="#0EA5E9"/>
<circle cx="90" cy="30" r="4" fill="#0EA5E9"/>
<circle cx="180" cy="30" r="4" fill="#0EA5E9"/>
<text x="240" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#475569" text-anchor="middle">floor</text>
</g>
<text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">The Floor Is the Frontier</text>
<text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">If powerful AI raises the floor at all, that&#8217;s not a side effect. It&#8217;s the whole point.</text>
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>
<text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  ·  2026</text>
</svg>
