<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Field Note No. 06: It's a blown assignment.</title>
<desc>White background with navy line-work. Three horizontal boxes: ALIGNMENT (navy outline, "Where you fit"), ASSIGNMENT (dashed teal outline with a small teal question mark inside — the missing phase), EXECUTE (navy outline, "Run the play"). Navy arrows connect them left to right. Title beneath: "It's a blown assignment." Italic subtitle "Alignment. Assignment. Execute." Analytic Bytes signature at the bottom.</desc>

<rect width="1200" height="630" fill="#FFFFFF"/>

<!-- Eyebrow -->
<text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Field note  ·  No. 06</text>

<!-- Structural diagram, centered around (600, 240) -->
<g transform="translate(600, 240)">

  <!-- Box 1: ALIGNMENT -->
  <rect x="-330" y="-60" width="180" height="120" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5"/>
  <text x="-240" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="1.8" fill="#475569" text-anchor="middle">PHASE ONE</text>
  <text x="-240" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.5" fill="#0F2A4A" text-anchor="middle">ALIGNMENT</text>
  <text x="-240" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" fill="#475569" text-anchor="middle">Where you fit.</text>

  <!-- Arrow 1 -->
  <line x1="-145" y1="0" x2="-100" y2="0" stroke="#0F2A4A" stroke-width="1.6"/>
  <polygon points="-95,0 -105,-5 -105,5" fill="#0F2A4A"/>

  <!-- Box 2: ASSIGNMENT (dashed teal outline, small teal ?) -->
  <rect x="-90" y="-60" width="180" height="120" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="0" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="1.8" fill="#0EA5E9" text-anchor="middle">PHASE TWO</text>
  <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.5" fill="#0F2A4A" text-anchor="middle">ASSIGNMENT</text>
  <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#0EA5E9" text-anchor="middle">?</text>

  <!-- Arrow 2 -->
  <line x1="100" y1="0" x2="145" y2="0" stroke="#0F2A4A" stroke-width="1.6"/>
  <polygon points="150,0 140,-5 140,5" fill="#0F2A4A"/>

  <!-- Box 3: EXECUTE -->
  <rect x="150" y="-60" width="180" height="120" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5"/>
  <text x="240" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="1.8" fill="#475569" text-anchor="middle">PHASE THREE</text>
  <text x="240" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.5" fill="#0F2A4A" text-anchor="middle">EXECUTE</text>
  <text x="240" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" fill="#475569" text-anchor="middle">Run the play.</text>

</g>

<!-- Title -->
<text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">It&#8217;s a blown assignment.</text>

<!-- Subtitle -->
<text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">Alignment. Assignment. Execute.</text>

<!-- Bottom divider -->
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>

<!-- AB signature -->
<text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  ·  2026</text>

</svg>
