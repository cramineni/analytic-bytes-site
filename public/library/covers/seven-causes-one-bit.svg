<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Seven causes, one bit.</title>
<desc>Seven filled navy dots on the left fan inward along seven navy lines and converge on a single small teal-outlined box in the centre. One short teal line leaves that box to the right, then frays back out into seven dashed grey lines ending in seven open circles. The label under the left fan and the label under the right fan are the same words, seven causes; the label under the box reads one bit.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>

<text x="600" y="90" font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9" text-anchor="middle">Essay  ·  No. 16</text>

<g transform="translate(600, 240)">

  <!-- seven causes converging -->
  <g stroke="#0F2A4A" stroke-width="1.4" fill="none">
    <path d="M-300,-72 L-96,0"/>
    <path d="M-300,-48 L-96,0"/>
    <path d="M-300,-24 L-96,0"/>
    <path d="M-300,0 L-96,0"/>
    <path d="M-300,24 L-96,0"/>
    <path d="M-300,48 L-96,0"/>
    <path d="M-300,72 L-96,0"/>
  </g>
  <g fill="#0F2A4A">
    <circle cx="-300" cy="-72" r="3.5"/>
    <circle cx="-300" cy="-48" r="3.5"/>
    <circle cx="-300" cy="-24" r="3.5"/>
    <circle cx="-300" cy="0" r="3.5"/>
    <circle cx="-300" cy="24" r="3.5"/>
    <circle cx="-300" cy="48" r="3.5"/>
    <circle cx="-300" cy="72" r="3.5"/>
    <circle cx="-96" cy="0" r="4.5"/>
  </g>

  <!-- the channel: one bit -->
  <line x1="-96" y1="0" x2="-26" y2="0" stroke="#0EA5E9" stroke-width="1.8"/>
  <rect x="-26" y="-15" width="52" height="30" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.8"/>
  <line x1="26" y1="0" x2="96" y2="0" stroke="#0EA5E9" stroke-width="1.8"/>

  <!-- seven causes, still -->
  <circle cx="96" cy="0" r="4.5" fill="#94A3B8"/>
  <g stroke="#94A3B8" stroke-width="1.2" fill="none" stroke-dasharray="5 4">
    <path d="M96,0 L300,-72"/>
    <path d="M96,0 L300,-48"/>
    <path d="M96,0 L300,-24"/>
    <path d="M96,0 L300,0"/>
    <path d="M96,0 L300,24"/>
    <path d="M96,0 L300,48"/>
    <path d="M96,0 L300,72"/>
  </g>
  <g fill="none" stroke="#94A3B8" stroke-width="1.2">
    <circle cx="300" cy="-72" r="3.5"/>
    <circle cx="300" cy="-48" r="3.5"/>
    <circle cx="300" cy="-24" r="3.5"/>
    <circle cx="300" cy="0" r="3.5"/>
    <circle cx="300" cy="24" r="3.5"/>
    <circle cx="300" cy="48" r="3.5"/>
    <circle cx="300" cy="72" r="3.5"/>
  </g>

  <text x="-198" y="122" font-size="11" letter-spacing="1.8" fill="#475569" text-anchor="middle">SEVEN CAUSES</text>
  <text x="0" y="122" font-size="11" letter-spacing="1.8" fill="#475569" text-anchor="middle">ONE BIT</text>
  <text x="198" y="122" font-size="11" letter-spacing="1.8" fill="#475569" text-anchor="middle">SEVEN CAUSES</text>

</g>

<text x="600" y="450" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A" text-anchor="middle">Seven causes, one bit.</text>
<text x="600" y="495" font-size="18" font-style="italic" fill="#475569" text-anchor="middle">A rejection carries one bit. At least seven states produce it.</text>
<line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>
<text x="600" y="585" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">Analytic Bytes  ·  2026</text>

</svg>
