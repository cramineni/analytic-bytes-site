<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover: Partnership is a handoff.">
  <title>Essay No. 22: Partnership is a handoff.</title>
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Eyebrow -->
  <text x="600" y="90" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="500" letter-spacing="3.5" fill="#0EA5E9">Essay  ·  No. 22</text>

  <!-- Motif -->
  <g transform="translate(600, 240)">
    <!-- Partnership bracket (spans vendor to buyer only) -->
    <path d="M -240 -70 L -240 -55 L 40 -55 L 40 -70"
          fill="none" stroke="#94A3B8" stroke-width="1"/>
    <text x="-100" y="-80" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="12" font-style="italic" fill="#475569">partnership</text>

    <!-- Vendor circle -->
    <circle cx="-240" cy="0" r="30" fill="none" stroke="#0F2A4A" stroke-width="1.5"/>
    <text x="-240" y="52" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="11" letter-spacing="2" fill="#475569">VENDOR</text>

    <!-- Arrow vendor to buyer (the named handoff) -->
    <line x1="-208" y1="0" x2="6" y2="0" stroke="#0F2A4A" stroke-width="1.5"/>
    <polyline points="0,-5 10,0 0,5" fill="#0F2A4A" stroke="#0F2A4A" stroke-width="1.5"/>

    <!-- Buyer circle -->
    <circle cx="40" cy="0" r="30" fill="none" stroke="#0F2A4A" stroke-width="1.5"/>
    <text x="40" y="52" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="11" letter-spacing="2" fill="#475569">BUYER</text>

    <!-- Dashed continuation arrow past buyer to internal (the unnamed handoff) -->
    <line x1="72" y1="0" x2="206" y2="0" stroke="#0F2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polyline points="200,-5 210,0 200,5" fill="#0F2A4A" stroke="#0F2A4A" stroke-width="1.5"/>

    <!-- Internal role — the piece's move, teal filled -->
    <circle cx="240" cy="0" r="14" fill="#0EA5E9"/>
    <text x="240" y="52" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="11" letter-spacing="2" fill="#0F2A4A">INTERNAL</text>
  </g>

  <!-- Title -->
  <text x="600" y="450" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="38" font-weight="500" letter-spacing="-0.5" fill="#0F2A4A">Partnership is a handoff.</text>

  <!-- Subtitle -->
  <text x="600" y="495" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-style="italic" fill="#475569">The seat past the signature.</text>

  <!-- Short divider -->
  <line x1="570" y1="555" x2="630" y2="555" stroke="#94A3B8" stroke-width="1"/>

  <!-- Footer -->
  <text x="600" y="585" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="13" letter-spacing="3" fill="#94A3B8">Analytic Bytes  ·  2026</text>
</svg>
